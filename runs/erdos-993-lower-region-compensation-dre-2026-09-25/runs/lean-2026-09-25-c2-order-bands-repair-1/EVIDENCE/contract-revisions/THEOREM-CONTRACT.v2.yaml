    "declaration_name": "E993OrderBand.markedIsolateAndOrdinaryLeafOrderBand",
    "expected_declaration_kind": "theorem",
    "expected_statement": "theorem E993OrderBand.markedIsolateAndOrdinaryLeafOrderBand :\n    (∀ (V : Type u) [Fintype V] [DecidableEq V]\n      (G : SimpleGraph V) [DecidableRel G.Adj]\n      (W : Finset V) (k : ℕ),\n      E993OrderBand.IsolateCovered G W →\n      2 ≤ k →\n      Fintype.card V ≤ 2 * k + 1 →\n      E993OrderBand.markedCount G W (k + 1) ≤\n        E993OrderBand.markedCount G W k) ∧\n    (∀ (V : Type u) [Fintype V] [DecidableEq V]\n      (T : SimpleGraph V) [DecidableRel T.Adj]\n      (v : V) (p : ℕ),\n      T.IsTree →\n      C4LA1.IsGraphLeaf T v →\n      3 ≤ p →\n      Fintype.card V ≤ 2 * p + 1 →\n      C5LA1.forwardDifferenceDel T (C5LA1.H T v) (p - 1) -\n        C5LA1.forwardDifferenceDel T (C5LA1.R T v) (p - 1) ≤ 0)",
    "expected_statement_sha256": "2f76927cdaeade070834c224eae8d5a846ee9a05cb4d04aade9524be58ad0437"
  },
