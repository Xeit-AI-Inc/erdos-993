{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-c2-order-band-pair-v2",
  "theorem": {
    "title": "Marked-isolate and ordinary-leaf order bands",
    "informal_statement": "For every finite simple graph G with m vertices, every vertex subset W containing all isolated vertices of G, and every natural k>=2 with m<=2k+1, the number of independent (k+1)-sets meeting W is at most the number of independent k-sets meeting W. Also, for every finite ordinary tree T, every original degree-one leaf v with its unique original support s, and every natural p>=3 with |V(T)|<=2p+1, Delta_(p-1)(T-{v,s})-Delta_(p-1)(T-N_T[s])<=0. Counts are zero outside supported natural ranks, and Delta_j(G)=i_(j+1)(G)-i_j(G) is an integer difference. All neighborhoods and leaf identities are those of the original tree."
  },
  "formulation_status": {
    "status": "open",
    "evidence": []
  },
  "definitions": [
    {
      "id": "def-marked",
      "description": "Independent sets of size k meeting W, counted once each; zero beyond vertex order.",
      "lean_name": "E993OrderBand.markedCount",
      "dependencies": []
    },
    {
      "id": "def-isolates",
      "description": "Every isolated vertex of G belongs to W; relative-U version is internal only.",
      "lean_name": "E993OrderBand.IsolateCovered",
      "dependencies": []
    },
    {
      "id": "def-leaf",
      "description": "An original graph vertex with exactly one adjacent vertex.",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": []
    },
    {
      "id": "def-support",
      "description": "The unique original neighbor of a degree-one leaf.",
      "lean_name": "C5LA1.support",
      "dependencies": [
        "def-leaf"
      ]
    },
    {
      "id": "def-h",
      "description": "Deletion set {v,s} in the original graph.",
      "lean_name": "C5LA1.H",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-r",
      "description": "Original closed neighborhood N_T[s] as deletion set.",
      "lean_name": "C5LA1.R",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-delta",
      "description": "Integer difference of deletion independent counts i_(j+1)-i_j, with natural counts zero beyond support.",
      "lean_name": "C5LA1.forwardDifferenceDel",
      "dependencies": []
    }
  ],
