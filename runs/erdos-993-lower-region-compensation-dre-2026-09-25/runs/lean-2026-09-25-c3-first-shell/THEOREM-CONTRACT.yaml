  "contract_id": "e993-c3-first-shell-pair-v1",
  "theorem": {
    "title": "First-shell original-leaf pointwise sign and favorable aggregate",
    "informal_statement": "For every finite ordinary tree T and natural p>=3 with |V(T)|=2p+2 and x(T)+2<=p, every original degree-one leaf v with unique original support s has Delta_(p-1)(T-{v,s})-Delta_(p-1)(T-N_T[s])<=0. Also, for every finite ordinary tree T and natural p with |V(T)|=2p+2, x(T)+2<=p and 3p<2alpha(T)+1, the complete sum of that same term over the original degree-one leaves v satisfying Delta_p(T-v)<0 is nonpositive. Here x is the first STRICT descent of the zero-extended independence counts, Delta_j=i_(j+1)-i_j is an integer difference, all supports and neighborhoods belong to the original tree, and distinct leaves remain separate summands even with common support. The first conjunct has no alpha or favorability hypothesis."
  },
