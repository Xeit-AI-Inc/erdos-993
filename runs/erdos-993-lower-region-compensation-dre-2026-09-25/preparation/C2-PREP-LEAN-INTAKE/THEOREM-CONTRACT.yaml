{
  "schema": "proposed.theorem-contract.json-compatible-yaml.v1",
  "authority": "proposal_to_controller_only",
  "contract_id": "C2-PREP-LEAN-INTAKE-ORDER-BAND-PAIR-PROPOSED",
  "title": "Marked-isolate and ordinary-leaf order bands",
  "informal_statement": "The two exact registered claims E993-MARKED-ISOLATE-ORDER-BAND and E993-ORDINARY-LEAF-ORDER-BAND, conjoined without additional graph or rank premises.",
  "formulation_status": "registered OPEN; pinned independent informal audits pass exact scopes; proposed for formal intake only",
  "known_counterexample_evidence": {
    "within_scope": null,
    "boundary_only": [
      "k=1,m=3 can fail for the generic graph claim",
      "m=2k+2 can fail for the generic graph claim"
    ],
    "other_claims": "unrestricted pointwise beta refutation does not address this order band"
  },
  "claims": [
    "E993-MARKED-ISOLATE-ORDER-BAND",
    "E993-ORDINARY-LEAF-ORDER-BAND"
  ],
  "definitions": [
    {
      "name": "E993OrderBand.IsolateCoveredOn",
      "domain": "SimpleGraph V, U W : Finset V",
      "meaning": "each vertex in U with no neighbor in U is in W",
      "depends_on": [
        "SimpleGraph.Adj",
        "Finset membership"
      ]
    },
    {
      "name": "E993OrderBand.IsolateCovered",
      "domain": "finite SimpleGraph V, W : Finset V",
      "meaning": "all isolates of G are in W",
      "depends_on": [
        "E993OrderBand.IsolateCoveredOn",
        "Finset.univ"
      ]
    },
    {
      "name": "E993OrderBand.markedCount",
      "domain": "finite SimpleGraph V, W : Finset V, natural k",
      "meaning": "cardinality of independent k-sets meeting W, zero beyond order",
      "depends_on": [
        "E993Interior.taggedFamily"
      ]
    },
    {
      "name": "C5LA1.H",
      "domain": "original finite graph and original leaf v",
      "meaning": "deletion set {v, support G v}",
      "depends_on": [
        "C5LA1.support"
      ],
      "reuse": "pinned FirstInteriorMain.lean, unchanged"
    },
    {
      "name": "C5LA1.R",
      "domain": "original finite graph and original leaf v",
      "meaning": "deletion set N_G[support G v] in original G",
      "depends_on": [
        "C5LA1.support"
      ],
      "reuse": "pinned FirstInteriorMain.lean, unchanged"
    },
    {
      "name": "C5LA1.forwardDifferenceDel",
      "domain": "graph G, deletion finset D, natural rank",
      "meaning": "integer i_(rank+1)(G-D)-i_rank(G-D), zero extended",
      "depends_on": [
        "C5LA1.indepSetCount"
      ],
      "reuse": "pinned FirstInteriorMain.lean, unchanged"
    }
  ],
  "domains": [
    {
      "claim": "E993-MARKED-ISOLATE-ORDER-BAND",
      "objects": "all finite simple graphs on arbitrary finite V; arbitrary W : Finset V; natural k",
      "depends_on": [
        "E993OrderBand.IsolateCovered",
        "E993OrderBand.markedCount"
      ]
    },
    {
      "claim": "E993-ORDINARY-LEAF-ORDER-BAND",
      "objects": "all finite ordinary trees on arbitrary finite V; every original degree-one leaf v; natural p",
      "depends_on": [
        "C4LA1.IsGraphLeaf",
        "C5LA1.H",
        "C5LA1.R",
        "C5LA1.forwardDifferenceDel"
      ]
    }
  ],
  "quantified_binders": [
    {
      "conjunct": 1,
      "binders": "∀ (V : Type u) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (W : Finset V) (k : ℕ)"
    },
    {
      "conjunct": 2,
      "binders": "∀ (V : Type u) [Fintype V] [DecidableEq V] (T : SimpleGraph V) [DecidableRel T.Adj] (v : V) (p : ℕ)"
    }
  ],
  "hypotheses": [
    {
      "conjunct": 1,
      "exact": [
        "E993OrderBand.IsolateCovered G W",
        "2 ≤ k",
        "Fintype.card V ≤ 2 * k + 1"
      ]
    },
    {
      "conjunct": 2,
      "exact": [
        "T.IsTree",
        "C4LA1.IsGraphLeaf T v",
        "3 ≤ p",
        "Fintype.card V ≤ 2 * p + 1"
      ]
    }
  ],
  "conclusion": [
    {
      "conjunct": 1,
      "exact": "E993OrderBand.markedCount G W (k + 1) ≤ E993OrderBand.markedCount G W k"
    },
    {
      "conjunct": 2,
      "exact": "C5LA1.forwardDifferenceDel T (C5LA1.H T v) (p - 1) - C5LA1.forwardDifferenceDel T (C5LA1.R T v) (p - 1) ≤ 0"
    }
  ],
