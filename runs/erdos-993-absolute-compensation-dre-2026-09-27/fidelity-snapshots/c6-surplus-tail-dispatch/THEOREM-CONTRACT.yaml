{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-guarded-tip-surplus-tail-m100-v1",
  "theorem": {
    "title": "Exact guarded tip-surplus tail for every arity2/3/4 profile with at least100 branches",
    "informal_statement": "For every natural m>=100, every function r from Fin m to the natural numbers with r_i in {2,3,4}, every i in Fin m, and every natural k with 1<=k and 2k<=N+2, put N=sum_j r_j, h=1+sum_j w(r_j), where w(2)=2,w(3)=4,w(4)=7. In the real polynomial ring let L=1+X, B_a=L^a+X, C=B_1 product_j B_(r_j), U_i=B_1 B_(r_i-1) product_(j!=i) B_(r_j), and E=X L^N. Then (h+1)U_i[k]C[k]+(k+1)(h-k+1)(E[k]C[k]-E[k+1]C[k-1]) is strictly positive. Brackets mean actual monomial coefficients with zero extension. The subtraction h-k+1 in the expression is real subtraction; k>=1 guards the natural coefficient index k-1. All repeated and mixed arity profiles and both parity endpoints are included. There is no actual-first-descent, selector, assumed ULC, main-product LR or numerical-prefix hypothesis. No assertion is made for m<100, for the endpoint deletion, for a full shifted-comparison minor, for selected payment, or for arbitrary trees."
  },
