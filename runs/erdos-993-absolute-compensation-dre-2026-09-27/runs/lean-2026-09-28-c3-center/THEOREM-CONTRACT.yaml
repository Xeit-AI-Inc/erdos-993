  "contract_id": "e993-center-subset-coefficient-expansion-v1",
  "theorem": {
    "title": "Exact finite center-subset coefficient expansion",
    "informal_statement": "For every index type with decidable equality, every finite set s of indices, every function r from the index type to the natural numbers, and every natural k, define H(X) as the product over i in s of ((1+X)^(r(i))+X) in polynomials with natural coefficients. Then the coefficient of X^k in H is the sum over all subsets t of s of the following natural number: if the cardinality of t is at most k, take binomial(sum of r(i) over i in s minus t, k minus the cardinality of t); otherwise take zero. Binomial coefficients vanish when the lower argument exceeds the upper argument. The empty index set, zero exponents, repeated exponent values at distinct indices, and all natural k are included. No degree bound by the sum of the exponents is assumed."
  },
