{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-any-strict-descent-rank-v1",
  "theorem": {
    "title": "Arity 2-4 parent polynomial rank bound at every strict descent",
    "informal_statement": "For every finite list rs of natural numbers whose entries are each 2, 3 or 4, let N be the sum of rs and define P(X)=(1+2X)*product_{r in rs}((1+X)^r+X)+X*(1+X)^(N+1) in rational polynomials. For every natural k, if the coefficient of X^(k+1) in P is strictly less than the coefficient of X^k in P, then 2*N<=5*k. Coefficients have their standard zero extension and the empty list is permitted."
  },
  "formulation_status": {
    "status": "open",
    "evidence": []
  },
  "definitions": [
    {
      "id": "def-parent",
      "description": "e993RankParent rs=(1+2*X)*(rs.map (fun r => (1+X)^r+X)).prod+X*(1+X)^(rs.sum+1), in Polynomial Rat. The exponent weight N+1 is not asserted to be the degree of P.",
      "lean_name": "e993RankParent",
      "dependencies": [
        "domain-list",
        "domain-polynomial"
      ]
    }
  ],
