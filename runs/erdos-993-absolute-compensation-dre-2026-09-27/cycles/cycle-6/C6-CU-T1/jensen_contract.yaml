{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-finite-block-coefficient-jensen-v1",
  "theorem": {
    "title": "Full actual finite-subset coefficient expectation and Jensen-Taylor bound",
    "informal_statement": "For every finite index type I, including the empty type, positive natural block sizes r_i, and real coefficients f_i(t) satisfying f_i(t) >= binomial(r_i,t) for every natural t <= r_i, put M=sum_i r_i, F_i(X)=sum_(t=0..r_i) f_i(t) X^t, and H=product_i F_i. For every natural k <= M let S be uniform among the actual k-element subsets of the labeled disjoint union V=Sigma_(i:I) Fin(r_i), and K_i its number of elements in block i. Put c=binomial(M,k), w_i(t)=f_i(t)/binomial(r_i,t), and y=sum_i sum_(t=0..r_i) p_i(t) * 2(f_i(t)-binomial(r_i,t))/(f_i(t)+binomial(r_i,t)), where p_i(t)=binomial(r_i,t)*binomial(M-r_i,k-t)/c if t<=k, and zero otherwise. Then, for every natural d, H[k]/c equals the actual uniform-subset average of product_i w_i(K_i), H[k] >= c*exp(y), and c*exp(y) >= c*sum_(a=0..d) y^a/a!. Binomial coefficients above their upper support are zero; the guard t<=k precedes natural subtraction. All three conclusions are required. Empty I, k=0, k=M, repeated sizes, blocks of size one, and d=0 are included. No independence of the conditioned block counts is assumed. No graph, deletion, first-descent, selector, or payment conclusion is asserted."
  },
