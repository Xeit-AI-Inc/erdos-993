{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c6-la1-c6-forest-delta2-order-9-v1",
  "theorem": {
    "title": "Uniform forest Delta_2 positivity threshold, order >= 9 (award group C6-LA1, E993-R25-FOREST-DELTA2-POS-ORDER-9)",
    "informal_statement": "For every finite forest F (SimpleGraph X, [Finite X], F.IsAcyclic) with Nat.card X >= 9, 0 < Erdos993G1.delta F 2 (i.e. i_3(F) > i_2(F), Delta_2 in the SEMANTIC-CONTRACT.md sense), with the quantitative companion (Nat.card X)^3 - 12*(Nat.card X)^2 + 35*(Nat.card X) - 30 <= 6 * Erdos993G1.delta F 2 for Nat.card X >= 5. A grade change for the registered VERIFIED E993-R25-FOREST-DELTA2-POS-ORDER-9 (proved_informal -> formally_verified), not a new claim. SCOPE (mandatory fences): uniform in the order, no horizon, no enumeration at any order; nu (matching number), tau (vertex-cover number), the excess d, and x(F) < r (first strict descent) enter nowhere; Delta_2 > 0 is a POSITIVITY statement, the opposite sign from a no-recovery statement; this is a forest THRESHOLD theorem, never 'the run's first unconditional forest theorem'; it does not sharpen E993-R25-FOREST-DESCENT-ORDER-BOUND-SHARP (an order bound is a different object); it is not E993-R25-FOREST-DELTA3-THRESHOLD-ORDER-12; it bears on no tier, on FOREST/TREE/TRANSFER, or on Erdos #993. Alias: E993-R25-FOREST-DELTA2-POS-ORDER-9; strictly generalises frozen ENTRY 176 (Erdos993G1.ThirdWide.forest_delta_two_ten_pos, Nat.card X = 10); also aliases E993-PAIR-RANK3-FOREST-MIN. Attribution: critic-attributed jointly to C-U4-T (contract form, quantitative cubic) and C-U4-F (component-corrected bound, entry176_is_an_instance disclosure), on the frozen G1 project's own compiled lemmas; seat U4's route framed the question and settled the decide-reach question the critics' closed form routes around."
  },
