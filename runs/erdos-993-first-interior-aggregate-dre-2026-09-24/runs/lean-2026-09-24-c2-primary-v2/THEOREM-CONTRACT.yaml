{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-first-interior-aggregate-c2-primary-v2",
  "theorem": {
    "title": "First-interior ordinary favorable-leaf aggregate",
    "informal_statement": "For every finite ordinary tree T with integer p=alpha(T)-2 and x(T)+2<=p, the complete sum over original leaves v satisfying Delta_p(T-v)<0 of Delta_(p-1)(T-{v,s_v})-Delta_(p-1)(T-N_T[s_v]) is nonpositive."
  },
  "formulation_status": {
    "status": "open",
    "evidence": [
      "SOURCE/CANDIDATE-PROOF.md: complete informal candidate selected by C2 synthesis; no formal award yet."
    ]
  },
  "definitions": [
    {
      "id": "def-alpha",
      "description": "Maximum cardinality of an independent vertex set in the finite graph.",
      "lean_name": "SimpleGraph.indepNum",
      "dependencies": []
    },
    {
      "id": "def-leaf",
      "description": "An original vertex has exactly one adjacent vertex, not an isolate.",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": []
    },
    {
      "id": "def-support",
      "description": "Unique original neighbor of a leaf; arbitrary off the leaf set.",
      "lean_name": "C5LA1.support",
      "dependencies": [
        "def-leaf"
      ]
    },
    {
      "id": "def-count",
      "description": "Natural count of independent k-subsets of the original carrier avoiding deletion set D, including zero counts above capacity.",
      "lean_name": "C5LA1.indepSetCount",
      "dependencies": []
    },
    {
      "id": "def-delta",
      "description": "Integer difference i_(k+1)(G-D)-i_k(G-D). The intended integer coefficients are zero outside feasible ranks.",
      "lean_name": "C5LA1.forwardDifferenceDel",
      "dependencies": [
        "def-count"
      ]
    },
    {
      "id": "def-crossing",
      "description": "Least natural index with strict negative full-graph forward difference, defined by Nat.find; terminal zero extension proves existence.",
      "lean_name": "C5LA1.crossingIndex",
      "dependencies": [
        "def-delta",
        "def-alpha"
      ]
    },
    {
      "id": "def-h",
      "description": "Deletion set {v,s_v} using the original leaf support.",
      "lean_name": "C5LA1.H",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-r",
      "description": "Original closed neighborhood of s_v as a deletion set.",
      "lean_name": "C5LA1.R",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-favorable",
      "description": "Strict negativity of the vertex-deleted difference at the original rank p; its independent-set count is the original-carrier avoiding-{v} representation.",
      "lean_name": "C4LA1.IsFavorableAt",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-aggregate",
      "description": "Integer sum over every favorable original leaf vertex, retaining shared-support multiplicity, of forwardDifferenceDel(H,p-1)-forwardDifferenceDel(R,p-1).",
      "lean_name": "C5LA1.aggregate",
      "dependencies": [
        "def-leaf",
        "def-h",
        "def-r",
        "def-delta",
        "def-favorable"
      ]
    }
  ],
  "domains": [
    {
      "id": "domain-v",
      "description": "Arbitrary finite vertex type, with Fintype and classical-compatible decidable equality instances. No order restriction.",
      "lean_type": "Type*",
      "dependencies": []
    },
    {
      "id": "domain-g",
      "description": "Arbitrary simple graph on V; decidable adjacency is available for finite counting and does not restrict the mathematical class.",
      "lean_type": "SimpleGraph V",
      "dependencies": [
        "domain-v"
      ]
    }
  ],
  "quantifiers": [
    {
      "binder": "V",
      "kind": "forall",
