      "binder": "G",
      "kind": "forall",
      "domain_id": "domain-g"
    }
  ],
  "hypotheses": [
    {
      "id": "hyp-tree",
      "statement": "G is connected and acyclic, exactly an ordinary finite tree.",
      "dependencies": [
        "domain-g"
      ]
    },
    {
      "id": "hyp-interior",
      "statement": "With integer p=alpha(G)-2, x(G)+2<=p. The exact Lean Nat premise is equivalent: it forces alpha>=4 and p>=2, so both subtractions in the aggregate agree with integer ranks. Alpha>=7 is a conclusion to prove, not an added premise.",
      "dependencies": [
        "def-alpha",
        "def-crossing"
      ]
    }
  ],
  "conclusion": {
