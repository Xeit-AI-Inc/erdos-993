{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-r27-c1-la1-forest-extension-inequality-v1",
  "theorem": {
    "title": "(EX) Forest extension inequality, with (DL) the forest degree lemma",
    "informal_statement": "(DL) For every finite forest G and every natural k, the total incident degree over the independent k-sets satisfies (indepDegreeSum G k : Int) <= 2 * k * indepCount G k. (EX) Consequently, for every finite forest G and every natural k, (Fintype.card X : Int) * indepCount G k <= (k + 1) * indepCount G (k + 1) + 3 * k * indepCount G k. Hypotheses: acyclicity and finiteness only. (DL) is an average over the independent k-sets and bounds no individual set. Mathematics: Fang-Lu-Nevo-Yao-Zheng 2026, section 8 (Lemma 8.1 with consequence (8.3); the displayed step of Proposition 8.2). Injection derivation of the root-corrected lemma: critic C-F1-T, sustained by the F adjudication. Compiled (EX) step: U3, re-derived by C-U1-T."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Fang-Lu-Nevo-Yao-Zheng, arXiv:2609.20961v1 (2026), section 8.",
      "r27 Cycle 1 synthesis, Exact established results 1 and 8: proved_informal with two independent in-run proofs (the corrected two-potential chain and the injection proof of the root-corrected lemma).",
      "Bounded evidence: zero violations of (DL) and (EX) across 85,625 forest isomorphism classes to order 16 and 40,232 labelled forests to order 7 under every root choice (synthesis Established result 27)."
    ]
  },
  "definitions": [
    {
      "id": "def-indepcount",
      "description": "G1 definition of record (r25 award, registrar entry 1, carried byte-identically): the number of independent k-subsets, as an integer.\n\nLean text:\nuniverse u\nnoncomputable\ndef indepCount {V : Type u} (F : SimpleGraph V) (k : ℕ) : ℤ :=\n  (Nat.card {S : Finset V // F.IsNIndepSet k S} : ℤ)",
      "lean_name": "Erdos993G1.indepCount",
      "dependencies": [
        "domain-vertex-type",
        "domain-graph",
        "domain-rank"
      ]
    },
    {
      "id": "def-coeff",
      "description": "G1 definition of record (r25 entry 2), the integer-indexed zero extension of i_k. Registered because R1 mandates the three G1 definitions of record; it is NOT a dependency of the terminal statement.\n\nLean text:\nnoncomputable\ndef coeff {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ :=\n  if 0 ≤ k then Erdos993G1.indepCount F k.toNat else 0",
      "lean_name": "Erdos993G1.coeff",
      "dependencies": [
        "def-indepcount"
      ]
    },
    {
      "id": "def-delta",
      "description": "G1 definition of record (r25 entry 3), the forward difference of coeff. Registered under R1; NOT a dependency of the terminal statement.\n\nLean text:\nnoncomputable\ndef delta {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ :=\n  Erdos993G1.coeff F (k + 1) - Erdos993G1.coeff F k",
      "lean_name": "Erdos993G1.delta",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-closednbhdfinset",
      "description": "U3 definition (carried byte-identically): the closed neighbourhood of a finset of vertices.\n\nLean text:\n/-- The closed neighbourhood of a finite set `J` of vertices: `J` together with every\nneighbour of a vertex of `J`. -/\ndef closedNbhdFinset (J : Finset X) : Finset X :=\n  J ∪ J.biUnion (fun u => G.neighborFinset u)",
      "lean_name": "Erdos993G1.closedNbhdFinset",
      "dependencies": [
        "domain-vertex-type",
        "domain-graph"
      ]
    },
    {
      "id": "def-extensionfinset",
      "description": "U3 definition (carried byte-identically): the extension set of J, the vertices outside its closed neighbourhood.\n\nLean text:\n/-- The extension set of `J`: vertices outside the closed neighbourhood of `J`, i.e. those\n`v` with `J ∪ {v}` independent whenever `J` is. -/\ndef extensionFinset (J : Finset X) : Finset X :=\n  Finset.univ \\ closedNbhdFinset G J",
      "lean_name": "Erdos993G1.extensionFinset",
      "dependencies": [
        "def-closednbhdfinset"
      ]
    },
    {
      "id": "def-extensioncount",
      "description": "U3 definition of record for e(J) (carried byte-identically): the number of extensions of J.\n\nLean text:\n/-- `e(J)`, the number of extensions of `J`. -/\ndef e (J : Finset X) : ℕ := (extensionFinset G J).card",
      "lean_name": "Erdos993G1.e",
      "dependencies": [
        "def-extensionfinset"
      ]
    },
    {
      "id": "def-indepdegreesum",
      "description": "U3/U1 definition of record for D_k (carried byte-identically from U3; the U adjudicator proved U1 and U3 definitionally equal by rfl): the total incident degree over independent k-sets.\n\nLean text:\n/-- The incident degree sum `D_k(G) := Σ_{J ∈ I_k(G)} Σ_{v ∈ J} deg_G(v)`. -/\ndef indepDegreeSum (k : ℕ) : ℕ :=\n  ∑ J ∈ G.indepSetFinset k, ∑ v ∈ J, G.degree v",
      "lean_name": "Erdos993G1.indepDegreeSum",
      "dependencies": [
        "domain-graph",
        "domain-rank"
      ]
    },
    {
      "id": "def-rootrep",
      "description": "Authored in-run. A distinguished vertex of each connected component; adjacent vertices share it. One root per component.\n\nLean text:\n/-- A distinguished vertex of the connected component of `v`: the root of `v`'s component.\nIt depends only on the component, so adjacent vertices share it. -/\nnoncomputable\ndef rootRep {X : Type u} (G : SimpleGraph X) (v : X) : X :=\n  (G.connectedComponentMk v).out",
      "lean_name": "Erdos993G1.rootRep",
      "dependencies": [
        "domain-graph"
      ]
    },
    {
      "id": "def-rootpath",
      "description": "Authored in-run. A path from v to its component root; in a forest it is THE path.\n\nLean text:\n/-- A path from `v` to the root of its component. In a forest it is *the* path, by\n`SimpleGraph.IsAcyclic.path_unique`; the definition itself needs no acyclicity. -/\nnoncomputable\ndef rootPath {X : Type u} [DecidableEq X] (G : SimpleGraph X) (v : X) :\n    G.Walk v (rootRep G v) :=\n  (Nonempty.some\n    (show G.Reachable v (rootRep G v) from\n      (SimpleGraph.ConnectedComponent.exact\n        (Quot.out_eq (G.connectedComponentMk v))).symm)).toPath.1",
      "lean_name": "Erdos993G1.rootPath",
      "dependencies": [
        "def-rootrep"
      ]
    },
    {
      "id": "def-par",
      "description": "Authored in-run. The parent map: the second vertex of the root path. par G v = v exactly for the component roots.\n\nLean text:\n/-- The parent of `v`: the second vertex of `v`'s root path. `par G v = v` exactly when that\npath is trivial, i.e. when `v` is its component's root. -/\nnoncomputable\ndef par {X : Type u} [DecidableEq X] (G : SimpleGraph X) (v : X) : X :=\n  (rootPath G v).snd",
      "lean_name": "Erdos993G1.par",
      "dependencies": [
        "def-rootpath"
      ]
    },
    {
      "id": "def-rk",
      "description": "Authored in-run. The rank (root-path length). It strictly decreases along par, which forbids two-cycles in the parent map.\n\nLean text:\n/-- The rank of `v`: the length of its root path. The parent strictly decreases it, which is\nwhat forbids two-cycles in the parent map. -/\nnoncomputable\ndef rk {X : Type u} [DecidableEq X] (G : SimpleGraph X) (v : X) : ℕ :=\n  (rootPath G v).length",
      "lean_name": "Erdos993G1.rk",
      "dependencies": [
        "def-rootpath"
      ]
    },
    {
      "id": "def-childrenfinset",
      "description": "Authored in-run. The children of v: the non-root vertices whose parent is v.\n\nLean text:\n/-- The children of `v`: the non-root vertices whose parent is `v`. -/\nnoncomputable\ndef childrenFinset {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    (v : X) : Finset X :=\n  Finset.univ.filter (fun u => par G u = v ∧ par G u ≠ u)",
      "lean_name": "Erdos993G1.childrenFinset",
      "dependencies": [
        "def-par"
      ]
    },
    {
      "id": "def-uppairs",
      "description": "Authored in-run. The up incidences: (J, v) with J independent of size k and v a non-root member of J.\n\nLean text:\n/-- The \"up\" incidences: pairs `(J, v)` with `J` an independent `k`-set and `v ∈ J` a non-root.\nEach such pair is the incidence of `v ∈ J` with the edge `{v, par v}`. -/\nnoncomputable\ndef upPairs {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] (k : ℕ) : Finset ((_ : Finset X) × X) :=\n  (G.indepSetFinset k).sigma (fun J => J.filter (fun v => par G v ≠ v))",
      "lean_name": "Erdos993G1.upPairs",
      "dependencies": [
        "def-par",
        "domain-rank"
      ]
    },
    {
      "id": "def-downpairs",
      "description": "Authored in-run. The down incidences: (J, u) with J independent of size k, u a non-root and par u in J.\n\nLean text:\n/-- The \"down\" incidences: pairs `(J, u)` with `J` an independent `k`-set, `u` a non-root and\n`par u ∈ J`. Each such pair is the incidence of `par u ∈ J` with the edge `{u, par u}`. -/\nnoncomputable\ndef downPairs {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] (k : ℕ) : Finset ((_ : Finset X) × X) :=\n  (G.indepSetFinset k).sigma\n    (fun J => Finset.univ.filter (fun u => par G u ≠ u ∧ par G u ∈ J))",
      "lean_name": "Erdos993G1.downPairs",
      "dependencies": [
        "def-par",
        "domain-rank"
      ]
    },
    {
      "id": "def-rootpairs",
      "description": "Authored in-run. The root incidences: (J, r) with r a component root in J. This is the root-correction term of the root-corrected degree lemma, counted with multiplicity across components.\n\nLean text:\n/-- The root incidences: pairs `(J, r)` with `J` an independent `k`-set and `r ∈ J` a root.\nThis is the root correction term of the root-corrected degree lemma. -/\nnoncomputable\ndef rootPairs {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] (k : ℕ) : Finset ((_ : Finset X) × X) :=\n  (G.indepSetFinset k).sigma (fun J => J.filter (fun v => par G v = v))",
      "lean_name": "Erdos993G1.rootPairs",
      "dependencies": [
        "def-par",
        "domain-rank"
      ]
    },
    {
      "id": "def-swapmap",
      "description": "Authored in-run. The explicit injection from the down incidences into the up incidences: move to a child in J when one exists, otherwise swap the vertex for its parent inside J.\n\nLean text:\n/-- The injection witnessing `#downPairs ≤ #upPairs`. On a down incidence `(J, u)` (so\n`par u ∈ J` and `u ∉ J`): if `u` has a child in `J`, keep `J` and move to that child; otherwise\nswap `u` for its parent inside `J`. The two branches are told apart by whether the image's\ngrandparent lies in the image's set. -/\nnoncomputable\ndef swapMap {X : Type u} [DecidableEq X] (G : SimpleGraph X)\n    (a : (_ : Finset X) × X) : (_ : Finset X) × X :=\n  if h : (a.1.filter (fun c => par G c = a.2)).Nonempty then ⟨a.1, h.choose⟩\n  else ⟨insert a.2 (a.1.erase (par G a.2)), a.2⟩",
      "lean_name": "Erdos993G1.swapMap",
      "dependencies": [
        "def-par"
      ]
    }
  ],
