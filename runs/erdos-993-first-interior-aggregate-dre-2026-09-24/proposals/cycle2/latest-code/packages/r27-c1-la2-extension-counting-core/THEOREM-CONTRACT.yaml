      "id": "hyp-indep-k-set",
      "statement": "`hJ : G.IsNIndepSet k J`: `J` is an independent set of cardinality `k`. Enters exactly once, in the terminal declaration, and is used there only through `hJ.card_eq : J.card = k`. NO acyclicity hypothesis, NO `(★)` hypothesis, NO `hyp-alpha`, and no `α(G)` side condition occurs in this contract.",
