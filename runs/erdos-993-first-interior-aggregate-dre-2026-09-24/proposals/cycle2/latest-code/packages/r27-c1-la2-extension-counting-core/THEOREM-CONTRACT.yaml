{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-r27-c1-la2-extension-counting-core-v1",
  "theorem": {
    "title": "C1-LA2 - the unconditional counting core: the independent-set extension double count and the extension lower bound",
    "informal_statement": "Two graph-general statements about an arbitrary finite simple graph G on a finite vertex type X, with n = Fintype.card X, i_k(G) = Erdos993G1.indepCount G k, I_k(G) = G.indepSetFinset k, and e(J) = Erdos993G1.e G J = |V \\ N[J]| the number of vertices extending J to an independent set. (1) THE DOUBLE COUNT (registered as the lemma Erdos993G1.double_count, the award's first face): ((k : ℤ) + 1) * Erdos993G1.indepCount G (k + 1) = ∑ J ∈ G.indepSetFinset k, (Erdos993G1.e G J : ℤ), for every k : ℕ. (2) THE EXTENSION LOWER BOUND (registered as the terminal theorem Erdos993G1.e_ge_sub, the award's second face and the declaration this contract binds): (Erdos993G1.e G J : ℤ) ≥ (Fintype.card X : ℤ) - (k : ℤ) - (∑ v ∈ J, G.degree v : ℤ) for every k : ℕ and every J with hJ : G.IsNIndepSet k J. Hypotheses are exactly [Fintype X], [DecidableEq X], [DecidableRel G.Adj] and, for (2), hJ. THERE IS NO ACYCLICITY HYPOTHESIS on either statement, no (★) hypothesis and no hyp-alpha; a stray G.IsAcyclic binder on either is struck at fidelity review. Mathematics: Fang-Lu-Nevo-Yao-Zheng 2026, arXiv:2609.20961v1, §8 (Lemma 8.1 / (8.1) and the displayed step of Proposition 8.2); the double count is classical (the extension method). Derivation in run r27: seat U3 (compiled), critic C-U1-T (independent re-derivation), U adjudicator (replay). These are graph-general facts: they are not forest statements, they transfer no status, and they are not evidence for (DL) or (EX)."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Fang, Lu, Nevo, Yao, Zheng, Unimodality of Independence Polynomials for Sufficiently Large Forests, arXiv:2609.20961v1 (17 September 2026), section 8: Lemma 8.1 / (8.1) and the displayed step of Proposition 8.2.",
      "cycles/cycle-1/stage6/SYNTHESIS.md, ## Lean awards, Decision 2, C1-LA2: 'Already sorry-free at [propext, Classical.choice, Quot.sound], seat-attributed to U3, independently re-derived by C-U1-T, replayed by the U adjudicator.'",
      "The classical extension-method double count for independent sets; no counterexample is known or possible (the identity is a bijection count)."
    ]
  },
