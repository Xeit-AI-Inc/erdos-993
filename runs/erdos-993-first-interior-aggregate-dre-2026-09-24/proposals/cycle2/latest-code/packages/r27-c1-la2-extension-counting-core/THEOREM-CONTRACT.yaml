  "conclusion": {
    "id": "conclusion",
    "statement": "For every finite simple graph `G` on `X`, every `k : ℕ` and every independent `k`-set `J`, the number of extensions of `J` satisfies `e(J) ≥ n - k - ∑_{v ∈ J} deg(v)` in `ℤ`, where `n = Fintype.card X`. Stated in `ℤ`; no natural-number subtraction occurs at any point of the development. Excluded: this is a graph-general fact, not a forest statement; it transfers no status to any r25/r26/r27 forest key, NR1, FOREST, TREE, TRANSFER or Erdős #993; and it is not evidence for (DL) or (EX).",
    "dependencies": [
      "def-extension-count",
      "def-fintype-card",
      "def-degree",
      "hyp-fintype",
      "hyp-decidable-eq",
      "hyp-decidable-adj",
      "hyp-indep-k-set"
    ]
  },
