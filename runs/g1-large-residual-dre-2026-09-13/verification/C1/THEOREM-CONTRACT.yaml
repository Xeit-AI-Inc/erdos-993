{
  "conclusion": {
    "id": "conclusion",
    "statement": "Conjunction of separately universal implications: (1) Every finite ordinary forest F and natural p satisfying all classification hypotheses has p=5, an actual graph isomorphism F equiv_g P8, and delta F 3=-15. (2) Every finite ordinary ambient tuple T,v,s,g,pT satisfying every unchanged ordinaryG1Guards condition and pT<=5 has delta (residual T v g) ((pT:Z)-2)<=0. The residual is the induced ordinary graph on actual original survivors. No RTree or unrestricted G1 theorem is concluded.",
    "dependencies": [
      "hyp-forest",
      "hyp-forest-low-rank",
      "hyp-forest-size",
      "hyp-forest-crossing",
      "hyp-g1-tuple",
      "hyp-g1-low-rank",
      "domain-iso",
      "def-delta",
      "def-residual"
    ]
  },
  "constructivity": {
    "required": false,
    "policy": "explicit_axiom_allowlist",
    "rationale": "Arbitrary finite subset cardinality, quotient connected components, Nat infimum and classical graph decidability may use the three authorized standard Lean axioms. No mathematical axioms or admitted graph obligations are allowed."
  },
  "contract_id": "erdos-993-g1-large-residual-dre-2026-09-13-v1",
  "definitions": [
    {
      "id": "def-simple-graph",
      "lean_name": "SimpleGraph",
      "description": "Ordinary undirected loopless graph on an arbitrary vertex type, with no RTree or special graph encoding.",
      "dependencies": []
    },
    {
      "id": "def-forest",
      "lean_name": "SimpleGraph.IsAcyclic",
      "description": "No cyclic walk satisfies IsCycle. Forests may be disconnected and empty.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-tree",
      "lean_name": "SimpleGraph.IsTree",
      "description": "Connected, nonempty, acyclic ordinary graph.",
      "dependencies": [
        "def-forest"
      ]
    },
    {
      "id": "def-count",
      "lean_name": "Erdos993G1.indepCount",
      "description": "i_k(F)=(Nat.card {S : Finset V // F.IsNIndepSet k S}:Z). IsNIndepSet means pairwise nonadjacency of distinct members and S.card=k. These are actual subsets counted once. Finite V gives i0=1 even for the empty graph and zero beyond the independence number.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-coeff",
      "lean_name": "Erdos993G1.coeff",
      "description": "For integer k, coeff F k = if 0<=k then indepCount F k.toNat else 0. Negative indices vanish; indices past support vanish by actual subset cardinality.",
      "dependencies": [
        "def-count"
      ]
    },
    {
      "id": "def-delta",
      "lean_name": "Erdos993G1.delta",
      "description": "For integer k, delta F k = coeff F (k+1)-coeff F k in Z; delta(-1)=1 for finite F.",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-first-descent",
      "lean_name": "Erdos993G1.firstDescent",
      "description": "x(F)=sInf {k:N | delta F (k:Z)<0}. Prove this set nonempty for every finite F via a maximum independent set and its following zero coefficient. This is the first strict descent, not a global maximizer or a plateau.",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-order",
      "lean_name": "Nat.card",
      "description": "|F| is Nat.card of its actual finite vertex type. Induced graph order is the cardinality of the actual survivor subtype.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-degree",
      "lean_name": "Erdos993G1.vertexDegree",
      "description": "vertexDegree T v=Nat.card (T.neighborSet v), the number of original graph neighbors. Degree one and adjacency to s identify the leaf's unique neighbor.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-neighborhood",
      "lean_name": "Erdos993G1.closedNeighborhood",
      "description": "closedNeighborhood T v={w | w=v or T.Adj v w}; all neighborhoods in the target use the ORIGINAL T.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-deletion",
      "lean_name": "Erdos993G1.deleteVerts",
      "description": "deleteVerts F S = F.induce S-complement, on {w:V // w notin S}, with inherited original adjacency.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-ambient-a",
      "lean_name": "Erdos993G1.ambientA",
      "description": "A=deleteVerts T (closedNeighborhood T v), namely T-N_T[v].",
      "dependencies": [
        "def-neighborhood",
        "def-deletion"
      ]
    },
    {
      "id": "def-ambient-h",
      "lean_name": "Erdos993G1.ambientH",
      "description": "H=deleteVerts T (closedNeighborhood T v union {g}). Prove its ordinary graph isomorphism to A-g and subset-count transport; this flat survivor subtype adds no graph condition.",
      "dependencies": [
        "def-ambient-a",
        "def-deletion"
      ]
    },
    {
      "id": "def-residual",
      "lean_name": "Erdos993G1.residual",
      "description": "U=deleteVerts T (closedNeighborhood T v union closedNeighborhood T g). On tuple structure this also equals H-(N_T(g)-{s}); prove the survivor identification. No neighborhood is recomputed after deletion and no RTree transfer is claimed.",
      "dependencies": [
        "def-neighborhood",
        "def-deletion",
        "def-ambient-h"
      ]
    },
    {
      "id": "def-residual-order",
      "lean_name": "Erdos993G1.residualOrder",
      "description": "Nat.card {w:V // w notin closedNeighborhood T v union closedNeighborhood T g}, exactly the vertex count of U.",
      "dependencies": [
        "def-residual",
        "def-order"
      ]
    },
    {
      "id": "def-p8",
      "lean_name": "SimpleGraph.pathGraph",
      "description": "P8 is pathGraph 8 with all Fin 8 vertices and adjacency a.val+1=b.val or b.val+1=a.val. Eight is the number of vertices.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-iso",
      "lean_name": "SimpleGraph.Iso",
      "description": "F equiv_g P8 is a bijection of full vertex types preserving AND reflecting adjacency. Nonempty asserts existence of this graph isomorphism, not a degree or polynomial identity.",
      "dependencies": [
        "def-p8"
      ]
    },
    {
      "id": "def-g1-guards",
      "lean_name": "Erdos993G1.ordinaryG1Guards",
      "description": "Exactly: T.IsTree AND degree(T,v)=1 AND T.Adj v s AND degree(T,s)=2 AND T.Adj s g AND g!=v AND p=x(T)+1 AND delta A (p:Z)+delta H ((p:Z)-1)<0 AND natural (2*p-3)<residualOrder T v g AND firstDescent U<natural (p-2). Every ordinary G1 structural/numerical guard is retained. No numeric identities, connected residual, cap, LC, unimodality or RTree premise is added.",
      "dependencies": [
        "def-tree",
        "def-degree",
        "def-first-descent",
        "def-ambient-a",
        "def-ambient-h",
        "def-residual",
        "def-residual-order",
        "def-delta"
      ]
    }
  ],
