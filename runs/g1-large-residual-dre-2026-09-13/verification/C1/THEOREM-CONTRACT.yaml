    "expected_declaration_kind": "theorem",
    "expected_statement": "theorem Erdos993G1.lowRankForestClassificationAndG1 :\n    (∀ (V : Type u) [finiteV : Finite V] (F : SimpleGraph V) (p : ℕ),\n      F.IsAcyclic →\n      p ≤ 5 →\n      2 * p - 3 < Nat.card V →\n      Erdos993G1.firstDescent F < p - 2 →\n      p = 5 ∧ Nonempty (F ≃g SimpleGraph.pathGraph 8) ∧\n        Erdos993G1.delta F 3 = -15) ∧\n    (∀ (W : Type u) [finiteW : Finite W] (T : SimpleGraph W) (v s g : W) (pT : ℕ),\n      Erdos993G1.ordinaryG1Guards T v s g pT →\n      pT ≤ 5 →\n      Erdos993G1.delta (Erdos993G1.residual T v g) ((pT : ℤ) - 2) ≤ 0)",
    "expected_statement_sha256": "9c3aa735668bbe320ce5bc45aaa9da766a8a1ea90065672b22a9360b6ddcbacf"
  },
