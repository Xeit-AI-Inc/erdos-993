  "theorem": {
    "title": "Ordinary finite-forest low-rank P8 classification and unchanged G1 for p <= 5",
    "informal_statement": "For every finite ordinary forest F and natural p<=5, if natural 2p-3<|F| and natural x(F)<p-2, then p=5,F is graph-isomorphic to P8,and Delta_3(F)=-15. Therefore every unchanged ordinary G1 tuple with the additional hypothesis p<=5 satisfies Delta_((p:Z)-2)(U)<=0."
