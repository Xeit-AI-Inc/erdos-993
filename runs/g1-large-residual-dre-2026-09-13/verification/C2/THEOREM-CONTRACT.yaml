    "expected_statement": "theorem Erdos993G1.firstWideClassificationHistoryAndG1 :\n    (∀ (V : Type u) [finiteV : Finite V] (G : SimpleGraph V) (r : ℕ),\n      1 ≤ r →\n      Nat.card V = 2 * r + 2 →\n      (0 < Erdos993G1.delta G (r : ℤ) ↔ Nat.card G.edgeSet ≤ 1)) ∧\n    (∀ (W : Type u) [finiteW : Finite W] (H : SimpleGraph W) (rH : ℕ),\n      1 ≤ rH →\n      Nat.card W = 2 * rH + 2 →\n      Nat.card H.edgeSet ≤ 1 →\n      ∀ (k : ℕ), k ≤ rH → 0 < Erdos993G1.delta H (k : ℤ)) ∧\n    (∀ (X : Type u) [finiteX : Finite X] (T : SimpleGraph X)\n      (v s g : X) (p : ℕ),\n      Erdos993G1.ordinaryG1Guards T v s g p →\n      Erdos993G1.residualOrder T v g = 2 * p - 2 →\n      Erdos993G1.delta (Erdos993G1.residual T v g) ((p : ℤ) - 2) ≤ 0)",
    "expected_statement_sha256": "ee2b961c4adf032f3e6e1a77ccdfa01557ce47ce91db21dc6824615859be64c7"
