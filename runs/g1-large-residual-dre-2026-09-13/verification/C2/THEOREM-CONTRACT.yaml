{
  "schema_version": "theorem-contract/v1",
  "contract_id": "erdos-993-g1-c2s-l1-first-wide-20260920-v1",
  "theorem": {
    "title": "Sharp first-wide classification and exceptional positivity history for ordinary finite graphs, with the literal G1 first-wide corollary",
    "informal_statement": "For every finite ordinary simple graph G and natural r>=1 with |V(G)|=2r+2, Delta_r(G)>0 iff G has at most one edge, and those exceptional graphs have Delta_k>0 for all 0<=k<=r. Consequently every frozen ordinary G1 tuple with |U|=2p-2 has Delta_(p-2)(U)<=0."
  },
  "formulation_status": {
    "status": "open",
    "evidence": [
      "SOURCE/intake/C2-LEAN-SELECTION-v1.json selects C2S-L1 and requires all three outputs; this producer proposal does not freeze or verify the formulation.",
      "SOURCE/intake/PROOFS.md Common definitions and Candidate L1 supply the elementary graph proof; the fresh independent informal audit and all formal gates remain controller-owned and pending from this phase. No known counterexample is asserted.",
      "C1 source is reused only by unchanged source-fragment replay with fresh kernel checking. Its archived terminal theorem and report do not certify this successor."
    ]
  },
  "definitions": [
    {
      "id": "def-simple-graph",
      "lean_name": "SimpleGraph",
      "description": "Ordinary undirected loopless graph on an arbitrary vertex type, with no RTree or special graph encoding.",
      "dependencies": []
    },
    {
      "id": "def-forest",
      "lean_name": "SimpleGraph.IsAcyclic",
      "description": "No cyclic walk satisfies IsCycle. Forests may be disconnected and empty.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-tree",
      "lean_name": "SimpleGraph.IsTree",
      "description": "Connected, nonempty, acyclic ordinary graph.",
      "dependencies": [
        "def-forest"
      ]
    },
    {
      "id": "def-count",
      "lean_name": "Erdos993G1.indepCount",
      "description": "i_k(F)=(Nat.card {S : Finset V // F.IsNIndepSet k S}:Z). IsNIndepSet means pairwise nonadjacency of distinct members and S.card=k. These are actual subsets counted once. Finite V gives i0=1 even for the empty graph and zero beyond the independence number.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-coeff",
      "lean_name": "Erdos993G1.coeff",
      "description": "For integer k, coeff F k = if 0<=k then indepCount F k.toNat else 0. Negative indices vanish; indices past support vanish by actual subset cardinality.",
      "dependencies": [
        "def-count"
      ]
    },
    {
      "id": "def-delta",
      "lean_name": "Erdos993G1.delta",
      "description": "For integer k, delta F k = coeff F (k+1)-coeff F k in Z; delta(-1)=1 for finite F.",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-first-descent",
      "lean_name": "Erdos993G1.firstDescent",
      "description": "x(F)=sInf {k:N | delta F (k:Z)<0}. Prove this set nonempty for every finite F via a maximum independent set and its following zero coefficient. This is the first strict descent, not a global maximizer or a plateau.",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-order",
      "lean_name": "Nat.card",
      "description": "|F| is Nat.card of its actual finite vertex type. Induced graph order is the cardinality of the actual survivor subtype.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-degree",
      "lean_name": "Erdos993G1.vertexDegree",
      "description": "vertexDegree T v=Nat.card (T.neighborSet v), the number of original graph neighbors. Degree one and adjacency to s identify the leaf's unique neighbor.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-neighborhood",
      "lean_name": "Erdos993G1.closedNeighborhood",
      "description": "closedNeighborhood T v={w | w=v or T.Adj v w}; all neighborhoods in the target use the ORIGINAL T.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-deletion",
      "lean_name": "Erdos993G1.deleteVerts",
      "description": "deleteVerts F S = F.induce S-complement, on {w:V // w notin S}, with inherited original adjacency.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-ambient-a",
      "lean_name": "Erdos993G1.ambientA",
      "description": "A=deleteVerts T (closedNeighborhood T v), namely T-N_T[v].",
      "dependencies": [
        "def-neighborhood",
        "def-deletion"
      ]
    },
    {
      "id": "def-ambient-h",
      "lean_name": "Erdos993G1.ambientH",
      "description": "H=deleteVerts T (closedNeighborhood T v union {g}), exactly the unchanged flattened survivor graph. Replayed original Deletion lemmas prove its graph isomorphism to deleting the surviving original g from A; no new graph-identification hypothesis is added.",
      "dependencies": [
        "def-neighborhood",
        "def-deletion"
      ]
    },
    {
      "id": "def-residual",
      "lean_name": "Erdos993G1.residual",
      "description": "U=deleteVerts T (closedNeighborhood T v union closedNeighborhood T g), exactly the original survivor subtype with adjacency inherited from T. Both neighborhoods are evaluated in original T. This ordinary graph is instantiated directly in the first-wide theorem; no RTree transport is claimed.",
      "dependencies": [
        "def-neighborhood",
        "def-deletion"
      ]
    },
    {
      "id": "def-residual-order",
      "lean_name": "Erdos993G1.residualOrder",
      "description": "Nat.card {w:V // w notin closedNeighborhood T v union closedNeighborhood T g}, exactly the vertex count of U.",
      "dependencies": [
        "def-residual",
        "def-order"
      ]
    },
    {
      "id": "def-g1-guards",
      "lean_name": "Erdos993G1.ordinaryG1Guards",
      "description": "Exactly the unchanged ten-part conjunction: T.IsTree; vertexDegree T v=1; T.Adj v s; vertexDegree T s=2; T.Adj s g; g!=v; p=firstDescent T+1; delta (ambientA T v) (p:Z)+delta (ambientH T v g) ((p:Z)-1)<0; natural 2*p-3<residualOrder T v g; firstDescent (residual T v g)<natural p-2. Every structural and numerical guard is retained. The selected corollary adds only residualOrder=natural 2*p-2. No upper rank/size bound, LC, unimodality, count identity premise or RTree premise is introduced.",
      "dependencies": [
        "def-tree",
        "def-degree",
        "def-first-descent",
        "def-ambient-a",
        "def-ambient-h",
        "def-residual",
        "def-residual-order",
        "def-delta"
      ]
    },
    {
      "id": "def-edge-count",
      "lean_name": "Nat.card G.edgeSet",
      "description": "The natural cardinality of the subtype of Sym2 V consisting of the actual unordered edges of the finite ordinary graph G. Looplessness ensures two distinct endpoints; at most one means exactly zero or one actual edge. Internal edgeFinset cardinal representations require a proved bridge. No replacement count parameter is quantified.",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-stratum",
      "lean_name": "Erdos993G1.FirstWide.stratum",
      "description": "Planned noncomputable def under Fintype X: stratum G M k j = (G.indepSetFinset k).filter (fun S => (S inter M).card=j), constructed with classical decidability. Counts only actual independent k-subsets. Requires no old lemma in its definition body; exact text and insertion context are in PLAN.md. Used only inside the proof, absent from terminal hypotheses.",
      "dependencies": [
        "def-simple-graph",
        "def-count"
      ]
    },
    {
      "id": "def-binom-coeff",
      "lean_name": "Erdos993G1.FirstWide.binomCoeff",
      "description": "Planned def binomCoeff (n:Nat) (k:Int):Int := if 0<=k then (n.choose k.toNat:Int) else 0. Negative integer ranks vanish, while Nat.choose gives zero above n. This arithmetic auxiliary must be identified with actual graph counts by proved subset bijections; it does not replace indepCount/coeff. Exact text is in PLAN.md.",
      "dependencies": []
    }
  ],
