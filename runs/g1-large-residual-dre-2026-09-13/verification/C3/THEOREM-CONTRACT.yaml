{
  "schema_version": "theorem-contract/v1",
  "contract_id": "erdos-993-g1-c3s-l1-third-wide-20260920-v2",
  "theorem": {
    "title": "Third-band finite-forest crossing theorem and literal ordinary G1 residual-order 2p consequence",
    "informal_statement": "for every finite ordinary forest F and natural r>=1, |V(F)|=2r+4 and x(F)<r imply Delta_r(F)<=0. Consequently, for every finite ordinary tree T, leaf v, its unique neighbor s of degree two and other neighbor g, with A=T-N_T[v], H=A-g, U=T-(N_T[v] union N_T[g]), p=x(T)+1, Gamma=Delta_p(A)+Delta_(p-1)(H)<0, 2p-3<|U|, x(U)<p-2, and |U|=2p, one has Delta_(p-2)(U)<=0. Every count is an actual independent-set cardinality of that same U. This is an ordinary graph theorem, with no RTree transport."
  },
  "formulation_status": {
    "status": "open",
    "evidence": [
      "C3S-L1 is a complete informal graph candidate; this proposal is not a validated contract or a formal award.",
      "The exact two-output statement follows the selected candidate. The earlier controller three-output provisional note is not the contract; its additional matching theorem is an internal supporting lemma.",
      "Controller alternate direct-incidence and forest-certificate sources are explicitly separate from the DRE synthesis and require the independent informal audit. No unseen graph/count assumption is introduced.",
      "The unchanged C2 prefix is replayed as source only, with a fresh kernel check. Its old terminal theorem is excluded and its old receipts are not transferred."
    ]
  },
  "definitions": [
