      "lean_name": "Erdos993G1.ordinaryG1Guards",
      "description": "The unchanged ten-part conjunction: T.IsTree; vertexDegree T v=1; T.Adj v s; vertexDegree T s=2; T.Adj s g; g!=v; p=firstDescent T+1; delta (ambientA T v) (p:Z)+delta (ambientH T v g) ((p:Z)-1)<0; natural 2*p-3<residualOrder T v g; firstDescent (residual T v g)<natural p-2. Every original guard is retained. The selected corollary adds only residualOrder=2*p. No LC, matching, vertex-cover, count-identity or RTree premise is added.",
      "dependencies": [
