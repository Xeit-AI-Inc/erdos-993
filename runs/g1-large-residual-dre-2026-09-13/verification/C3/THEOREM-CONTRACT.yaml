      ]
    },
    {
      "id": "def-delta",
      "lean_name": "Erdos993G1.delta",
      "description": "For integer k, delta F k = coeff F (k+1)-coeff F k in Z; delta(-1)=1 for finite F.",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-first-descent",
      "lean_name": "Erdos993G1.firstDescent",
      "description": "x(F)=sInf {k:N | delta F (k:Z)<0}. Prove this set nonempty for every finite F via a maximum independent set and its following zero coefficient. This is the first strict descent, not a global maximizer or a plateau.",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-order",
      "lean_name": "Nat.card",
      "description": "|F| is Nat.card of its actual finite vertex type. Induced graph order is the cardinality of the actual survivor subtype.",
      "dependencies": [
        "def-simple-graph"
      ]
