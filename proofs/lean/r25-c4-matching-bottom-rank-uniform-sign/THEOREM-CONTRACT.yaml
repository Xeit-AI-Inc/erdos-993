{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c4-la1-bottom-rank-uniform-matching-sign-v1",
  "theorem": {
    "title": "Bottom-rank uniform matching sign (award group C4-LA1)",
    "informal_statement": "For every d >= 3, every finite type X, every finite simple graph G on X with Nat.card X = 3*d, and every matching of size m(d) = (3*d+1)/2 - 1 in G (realised by an injective f : Fin m(d) x Bool -> X with G.Adj (f (i,false)) (f (i,true)) for every i), Erdos993G1.delta G (d : Z) <= 0, where delta/coeff/indepCount are the G1 definitions counting actual independent-set sizes with integer zero extension. No crossing hypothesis, no acyclicity, no cover; uniform in d with no horizon; rank r = d and order 3*d only."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "cycles/cycle-4/stage6/SYNTHESIS.md :: ## Lean awards :: Award group 1",
      "cycles/cycle-4/stage5/adjudicators/U/ADJUDICATION.md :: ## Lean readiness :: Candidate B",
      "cycles/cycle-4/stage4/critics/U4/T/CRITIQUE.md :: Independent re-derivation (7)",
      "cycles/cycle-4/stage4/critics/U4/F/CRITIQUE.md :: Independent re-derivation",
      "cycles/cycle-4/stage3/returns/U4/RETURN.md :: Part (A)"
    ]
  },
