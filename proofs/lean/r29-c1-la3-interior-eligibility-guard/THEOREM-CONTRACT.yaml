      "description": "Carried byte-identically (entry 2, fragment SHA-256 c2da50eb16ee788c439b146577efeedd7dd42811c6943fb437585edcf63b5880); does NOT occur in the statement; carried in the plan-of-record definition layer; not used by this statement or its proof. Lean text: def vertexDeletionForwardDifference (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (p : Nat) : Int :=\n  (vertexDeletionIndepSetCount G v (p + 1) : Int) -\n    vertexDeletionIndepSetCount G v p"
    },
