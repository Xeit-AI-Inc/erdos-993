      "statement": "hInterior : C5LA1.crossingIndex G + 2 ≤ G.indepNum - 2 (in ℕ). The hypothesis hInterior is an inequality in ℕ with truncated subtraction: crossingIndex G + 2 ≤ G.indepNum - 2. It is equivalent to the integer hypothesis (crossingIndex G : ℤ) + 2 ≤ (G.indepNum : ℤ) - 2 for EVERY value of indepNum: when indepNum < 2 the ℕ right side is 0 and the ℤ right side is negative, while the left side is ≥ 2, so both are false; when indepNum ≥ 2 the ℕ subtraction equals the ℤ one and the two are identical. So the Lean hypothesis is exactly the registry hypothesis x(T) + 2 ≤ p with integer p = α(T) − 2. Consumption: forces indepNum ≥ 4 and bounds crossingIndex G by 0, 1, 2 in the cases indepNum = 4, 5, 6.",
