      "description": "Carried byte-identically (entry 4, fragment SHA-256 65acd314d3bfd74aca476e00dd8866434c67682b627bce5e105d372a556f7ae5); does NOT occur in the statement; carried in the plan-of-record definition layer; not used by this statement or its proof. Lean text: def IsGraphLeaf (G : SimpleGraph V) (v : V) : Prop :=\n  ∃! u, G.Adj v u"
    },
    {
      "id": "def-c5la1-support",
      "lean_name": "C5LA1.support",
      "dependencies": [],
      "description": "Carried byte-identically (entry 5, fragment SHA-256 8e1e1a689393f555eb5c216207b1368c7415a8543c569884b2fc86954b7bc2b4); does NOT occur in the statement; carried in the plan-of-record definition layer; not used by this statement or its proof. Lean text: noncomputable\ndef support (G : SimpleGraph V) (v : V) : V :=\n  Classical.choose (p := fun u => C4LA1.IsGraphLeaf G v → G.Adj v u ∧ ∀ w, G.Adj v w → w = u)\n    (by\n      by_cases h : C4LA1.IsGraphLeaf G v\n      · obtain ⟨u, hu, huniq⟩ := h\n        exact ⟨u, fun _ => ⟨hu, huniq⟩⟩\n      · exact ⟨v, fun hc => absurd hc h⟩)"
