    {
      "id": "def-indepsetsavoiding",
      "lean_name": "C5LA1.indepSetsAvoiding",
      "dependencies": [
        "def-finset-univ",
        "def-isindepset"
      ],
      "description": "Carried byte-identically (first-interior entry 10, fragment SHA-256 ac0e331eec99650eca7a18e9fe98829bb5495850685b8f31936169f0a6d8e368). The independent k-subsets of V avoiding D. Lean text: def indepSetsAvoiding (G : SimpleGraph V) [DecidableRel G.Adj]\n    (D : Finset V) (k : Nat) : Finset (Finset V) :=\n  ((Finset.univ \\ D).powersetCard k).filter fun s : Finset V => G.IsIndepSet (s : Set V)"
    },
    {
      "id": "def-indepsetcount",
      "lean_name": "C5LA1.indepSetCount",
      "dependencies": [
        "def-indepsetsavoiding"
      ],
      "description": "Carried byte-identically (entry 11, e22635d8697e49b38dd521080f34c3eefe56a93964120c70f53ad9899b4a7f71). i_k(G − D) on the original carrier; with D = ∅ it is i_k(G). Lean text: def indepSetCount (G : SimpleGraph V) [DecidableRel G.Adj]\n    (D : Finset V) (k : Nat) : Nat :=\n  (indepSetsAvoiding G D k).card"
    },
    {
      "id": "def-forwarddifferencedel",
      "lean_name": "C5LA1.forwardDifferenceDel",
      "dependencies": [
        "def-indepsetcount"
      ],
      "description": "Carried byte-identically (entry 12, 60bd8efcc88e8e511a7caacac5867f7845243ccab08f1660e8c3962af544dd8f). Δ_k(G − D) = i_{k+1}(G − D) − i_k(G − D) in ℤ. Lean text: def forwardDifferenceDel (G : SimpleGraph V) [DecidableRel G.Adj]\n    (D : Finset V) (k : Nat) : Int :=\n  (indepSetCount G D (k + 1) : Int) - indepSetCount G D k"
    },
    {
      "id": "def-crossingindex",
      "lean_name": "C5LA1.crossingIndex",
      "dependencies": [
        "def-forwarddifferencedel",
        "def-indepnum"
      ],
      "description": "Carried byte-identically (entry 14, 378868ab2e660af8a36ea0b1045c55bc60f8383dca3d31dd85c4b52fa8a898fb). x(G) = Nat.find of the least k with forwardDifferenceDel G ∅ k < 0 (existence proved inside the definition from Δ_α(G) = −i_α(G) < 0; a plateau Δ_k = 0 is not a descent). Lean text: noncomputable\ndef crossingIndex (G : SimpleGraph V) [DecidableRel G.Adj] : Nat :=\n  Nat.find (p := fun k => forwardDifferenceDel G ∅ k < 0)\n    (by\n      classical\n      obtain ⟨s, hs⟩ := G.exists_isNIndepSet_indepNum\n      refine ⟨G.indepNum, ?_⟩\n      have hzero : indepSetCount G ∅ (G.indepNum + 1) = 0 := by\n        have hempty : indepSetsAvoiding G ∅ (G.indepNum + 1) = ∅ := by\n          rw [Finset.eq_empty_iff_forall_notMem]\n          intro t ht\n          simp only [indepSetsAvoiding, Finset.mem_filter, Finset.mem_powersetCard] at ht\n          have hle : t.card ≤ G.indepNum := ht.2.card_le_indepNum\n          omega\n        rw [indepSetCount, hempty, Finset.card_empty]\n      have hpos : 0 < indepSetCount G ∅ G.indepNum := by\n        rw [indepSetCount, Finset.card_pos]\n        refine ⟨s, ?_⟩\n        simp only [indepSetsAvoiding, Finset.mem_filter, Finset.mem_powersetCard]\n        refine ⟨⟨?_, hs.card_eq⟩, hs.isIndepSet⟩\n        intro x _\n        simp\n      simp only [forwardDifferenceDel, hzero]\n      omega)"
    },
    {
      "id": "def-c4la1-vertexdeletionindepsetcount",
      "lean_name": "C4LA1.vertexDeletionIndepSetCount",
      "dependencies": [],
      "description": "Carried byte-identically (entry 1, fragment SHA-256 7e0a588e243735a611c919ea1080816911a3e27e4523478af0c0f560ce1b3b48); does NOT occur in the statement; carried in the plan-of-record definition layer; not used by this statement or its proof. Lean text: def vertexDeletionIndepSetCount (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (k : Nat) : Nat :=\n  (((Finset.univ.erase v).powersetCard k).filter fun s : Finset V =>\n    G.IsIndepSet (s : Set V)).card"
