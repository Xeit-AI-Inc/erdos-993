  "theorem": {
    "title": "(ELIG) E993-INTERIOR-ELIGIBILITY-ALPHA-GE-SEVEN — interior eligibility forces α ≥ 7 on finite trees (r29 Cycle 1 award C1-LA3)",
    "informal_statement": "For every finite ordinary tree T with integer p = α(T) − 2: if x(T) + 2 ≤ p, where x(T) is the least k with Δ_k(T) = i_{k+1}(T) − i_k(T) < 0, then α(T) ≥ 7. Lean: for every finite type V with decidable equality and every G : SimpleGraph V with decidable adjacency, G.IsTree and C5LA1.crossingIndex G + 2 ≤ G.indepNum - 2 (ℕ) imply 7 ≤ G.indepNum. The hypothesis hInterior is an inequality in ℕ with truncated subtraction: crossingIndex G + 2 ≤ G.indepNum - 2. It is equivalent to the integer hypothesis (crossingIndex G : ℤ) + 2 ≤ (G.indepNum : ℤ) - 2 for EVERY value of indepNum: when indepNum < 2 the ℕ right side is 0 and the ℤ right side is negative, while the left side is ≥ 2, so both are false; when indepNum ≥ 2 the ℕ subtraction equals the ℤ one and the two are identical. So the Lean hypothesis is exactly the registry hypothesis x(T) + 2 ≤ p with integer p = α(T) − 2. Terminal declaration E993HighTail.interiorEligibilityAlphaGeSeven, body E993Interior.eligibleAlphaGeSeven G hT hInterior: a NEW terminal name applying the carried entry 43, not a byte-identical re-export. Fences (SOLUTION-CONTRACT §3): §3.1 not a no-recovery statement; no status transfer to E993-R25-UNR-FOREST-WIDE, E993-G1WIDE-NO-SIZE-CAP, NR1, FOREST, TREE, TRANSFER, E993-BETA-AGG or Erdős #993. §3.2 E993-INTERIOR-ALPHA-MINUS-TWO-AGGREGATE (VERIFIED, first-interior award) unchanged and never re-registered; the relation is a scope note. §3.5 no census value, r27 root correction or r28 Hall/SDR route. §3.7 attribution on every face. §3.8 separate certificate; entry 43's presence inside the first-interior package is context, never a certificate. Excluded conclusions: no aggregate sign; no statement at any other depth; no no-recovery or unimodality claim; no re-certification of E993-INTERIOR-ALPHA-MINUS-TWO-AGGREGATE. Attribution: Codex (GPT-6): entry 43's proof (the three low-α exclusions) and the proposed statement; r25: the G1 definitions (entries 15–17) and the Erdos993G1 counting layer as carried in the first-interior source; r24 C4-LA1 / r26: the C4LA1 / C5LA1 definition layer; r29 T1's extraction as corrected by C-T1-F, C-T1-U and the T adjudicator (acyclicity in all three branches); the U adjudicator's recomputation and scratch candidate (terminal declaration text). Key: E993-INTERIOR-ELIGIBILITY-ALPHA-GE-SEVEN (OPEN → VERIFIED by this award only, after every gate). Canonical DRE run id: erdos-993-math-dre-20260925-r29-high-tail-certification."
  },
