      "dependencies": [],
      "description": "Carried byte-identically (entry 15, fragment SHA-256 f6bc96fd41a76a97b28a866a483e2b1d637d371832690897422edeeb9b65bc2b); does NOT occur in the statement; used inside the carried proof of entry 43 (bridged to C5LA1.indepSetCount by count_bridge/delta_bridge). Lean text: noncomputable\ndef indepCount {V : Type u}\n    (F : SimpleGraph V) (k : ℕ) : ℤ :=\n  (Nat.card {S : Finset V // F.IsNIndepSet k S} : ℤ)"
