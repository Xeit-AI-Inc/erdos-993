      "description": "Carried BYTE-IDENTICALLY (registrar entry 7; first-interior entry 7; fragment SHA-256 ccfc9b2f549aa8c9986931152d249096ce49e3ccd3b67f4afd8678a749d93a68). Carried definition of record (registrar unit); NOT used by the terminal statement, the companion statement or any proof in this award. Full carried fragment text (verbatim):\nnamespace C5LA1\n\nopen SimpleGraph C4LA1\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\n/-- `lambda(s)`: the number of leaves of `G` adjacent to `s`, zero off\nsupports. -/\nnoncomputable\ndef leafDegree (G : SimpleGraph V) [DecidableRel G.Adj] (s : V) : Nat :=\n  ((leafSet G).filter fun v => G.Adj v s).card\n\nend C5LA1",
