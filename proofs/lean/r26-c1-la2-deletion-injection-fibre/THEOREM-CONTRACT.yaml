{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c1-la2-deletion-injection-fibre-v1",
  "theorem": {
    "title": "C1-LA2 Deletion Injection and Sharp Fibre Inequality for Independent Subsets of an Arbitrary Vertex Finset",
    "informal_statement": "Let V be a finite type with decidable equality, G a simple graph on V with decidable adjacency, U : Finset V an arbitrary vertex finset, and I(U) the finset of independent subsets of U. Then (a) 2 * (sum over A in I(U) of |A|) <= |U| * |I(U)| in the natural numbers, and (b) for EVERY natural number ℓ, ((ℓ : ℤ) - (|U| : ℤ)) * (|I(U)| : ℤ) <= sum over A in I(U) of ((ℓ : ℤ) - 2 * (|A| : ℤ)) in the integers. The terminal declaration of this contract is (b), the sharp fibre inequality. There are no hypotheses beyond finiteness: no tree, no connectivity, no hyp-alpha, no hyp-eligible, no residual hypothesis (star), and no |U| <= ℓ. Statement (a) is the in-run RE-PROOF of the occupancy bound of Andriantiana-Razanajatovo Misanantenaina-Wagner (2020), carried on the face of this contract per SOLUTION-CONTRACT.md fence 7; nothing is imported. The award asserts nothing about the residual aggregate S, about trees, about the family decomposition, about W_III, or about (RC); the instantiation of (b) at U := U(J') belongs to award group C1-LA1."
  },
