      "lean_name": "R26LA2.indepPowerset",
      "description": "I(U) := indepPowerset G U := U.powerset.filter (fun A => G.IsIndepSet (A : Set V)) : the finset of independent subsets of the vertex finset U. Membership A in I(U) unfolds exactly to A subset U and G.IsIndepSet (A : Set V). Carried byte-identically at the declaration level from U2 (sources/c1-stage7-sources/U2-Main.lean, c382707596674822e0b78135414cdd3320e0bc56f9f558fee78e438794b1043b).",
