    {
      "id": "def-sum-card-filter-comm",
      "lean_name": "C5LA1.sum_card_filter_comm",
      "description": "The frozen C5-LA1 award's ENTRY 23 lemma (Fubini for filters): for finsets s and t and a decidable relation r, sum over a in s of |{b in t : r a b}| equals sum over b in t of |{a in s : r a b}|. Carried byte-identically at the declaration level from the frozen C5-LA1 Lean source sources/r24/c5-la1/LeanProject/LeanProof/Main.lean (0933211d8f02acd867e91547d4a2b09d13fcc3ea178e192e385acc33b696b63b), entry digest 8a2d0fcef47481141c9b03c55648c36181f4dde28ed2dd5ed1d8d96bc4b0f59e. It is the only C5-LA1 entry this award depends on; it is a lemma, recorded here as a declaration node because the contract schema carries declaration nodes under 'definitions'.",
      "dependencies": []
    },
    {
      "id": "def-deletion-injection-bound",
      "lean_name": "R26LA2.deletionInjectionBound",
      "description": "The deletion injection bound: 2 * (sum over A in I(U) of |A|) <= |U| * |I(U)| in the natural numbers, for an arbitrary finite simple graph and an arbitrary vertex finset U, with no tree, connectivity, hyp-alpha, hyp-eligible or residual hypothesis. Proved in-run by the injection A |-> A.erase u from {A in I(U) : u in A} into {A in I(U) : u not-in A} for each fixed u in U, the exact partition of I(U) by membership of u, and the double count sum over u in U of |{A in I(U) : u in A}| = sum over A in I(U) of |A|. This is the in-run RE-PROOF of the occupancy bound of Andriantiana-Razanajatovo Misanantenaina-Wagner (2020); nothing is imported. Carried byte-identically at the body level from U2 (sources/c1-stage7-sources/U2-Main.lean), with the single declaration keyword changed from 'theorem' to 'lemma' as the Stage 7 brief section 2 directs and the registrar's kind grammar requires.",
