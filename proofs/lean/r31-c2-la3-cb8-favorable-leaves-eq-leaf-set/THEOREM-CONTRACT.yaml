 "theorem": {
  "title": "C2-LA3 (r31): graph-level favorability - favorableLeaves (cbGraph m) p* = leafSet (cbGraph m) at p* = (16m+4)/3 on the literal tree CB(8,m), for the class m >= 107, m = 2 (mod 3)",
  "informal_statement": "Canonical run id erdos-993-math-dre-20260927-r31-cb-uniform-switch; award C2-LA3 (graph-level favorability); Lean run lean-2026-09-28-c2-la3-cb8-favorable-leaves-eq-leaf-set; producer c2-la3-formalizer-opus-20260928. Terminal: for every natural number m with 107 <= m and m % 3 = 2, on the literal tree CB(8,m) = cbGraph m (vertices Fin (17m+3); r = 0, s = 1, v = 2, u_i = 3+17i, b_ij = u_i+1+2j, c_ij = u_i+2+2j), the fixed original strict selector favorableLeaves (cbGraph m) p* at p* = (16m+4)/3 (natural-number floor division, exact on the class) equals the whole leaf set C5LA1.leafSet (cbGraph m); i.e. every original leaf w satisfies Delta_p*(CB - w) = i_(p*+1)(CB - w) - i_p*(CB - w) < 0 (counts over N, difference over Z; C4LA1.IsFavorableAt). Proof DAG (synthesis ### C2-LA3; INFORMAL-PROOF.md): (N1) for every private leaf c_ij (i < m, j < 8), per (i, j) directly, C4LA1.vertexDeletionIndepSetCount (cbGraph m) c_ij k equals the k-th coefficient of (1+2X) G_c G^(m-1) + X(1+X)^2(1+2X)^(8m-1) over N, G = (1+2X)^8 + X(1+X)^8, G_c = (1+2X)^7(1+X) + X(1+X)^7 (synthesis correction 5: G_c, not G'), by the vertex split at r and the branch product with one damaged branch (E993Transport.cb8_indepPoly_isolated_factor, cb8_damagedGadget, cb8_pairs_erase, cb8_privateLeaf_minus_closedNbhd_root, cb8_privateLeaf_minus_root, cb8_privateLeaf_indepPoly_closedForm, cb8_vertexDeletion_privateLeaf_eq_coeff); (N2) the arm leaf v: I(CB - v) = (1+X)G^m + X(1+2X)^(8m) and its count = coefficient (critU3T_cb_gadgets, critU3T_cb_minus_v_closedForm, critU3T_cb_vertexDeletion_v_eq_coeff, re-authored from C-U3-T's draft); (N3) the leaf classification (carried C1-LA2 entries 60 mem_leafSet_cbGraph_iff and 72 cb_leafSet_eq_image); (N4) favorability of each leaf from C2-LA2's two closed-form inequalities (carried C2-LA2 terminal cb8_leafDeletion_closedForms_descent_topRank, rekeyed theorem -> lemma, ruling R31-N-15) through the N -> Z cast of the forward difference (carried C1-LA2 entry 2) (cb8_armLeaf_isFavorableAt_topRank, cb8_privateLeaf_isFavorableAt_topRank), then carried C1-LA2 entry 74 favorableLeaves_eq_leafSet_of_all. Carried fragments (byte-identical, keyed by (origin award, entry, digest), bound to each origin kernel receipt with verdict verified): C1-LA2 Main.lean a906ec179d52c2548ca7026d8c9de532577100308444af2e722db3fd963b5f3f (30 entries), C2-LA2 Main.lean e75c66b2eee237d04354da33ab9fb941c5fb77be98cf8db42720a681361bfaae (28 entries, entry 28 rekeyed), C2-LA1 Main.lean 986b525702a5a0d03f205da6ffbe6faf675ef4841473a498b33ef27e70190c9d (19 entries: the vertex split, the m-ary product and C-U3-T's closed-form machinery). Statement plumbing change recorded (EVIDENCE/terminal-statement-check.json): the frozen fully qualified name is written namespace-relative inside namespace E993Transport, and the Markdown list indentation is removed; binders, hypotheses, types and conclusion are byte-identical. Fences on the face: one rank p* = (16m+4)/3; d = 8; the r31 class m >= 107, m = 2 (mod 3) only; a statement about the literal cbGraph m. Excluded conclusions (not claimed, not implied): (H); conjunct 4 of the terminal; (HALL) at any scope; any aggregate; any TREE, FOREST or TRANSFER status; Erdos #993; any rank other than p*; m < 107; m not = 2 (mod 3); d != 8. No grade is asserted for any companion (every non-terminal declaration, carried or new, is a kernel-checked companion with no grade of its own). On closure the controller registers the formal clause of the r30 favorability key's scope note (d = 8, the r31 class, rank (16m+4)/3); no new key. Attribution (exactly the synthesis ### C2-LA3 list, \"as C2-LA2, plus C-U3-T and U3 for the link machinery\", with the brief's additions): T1 (seat, arm leaf); C-T1-F, C-T1-U (arm-leaf Lean); C-F2-U (both leaves, regrouping, Lean); C-F2-T, C-T2-F, C-T2-U (independent private-leaf proofs); r30 (closed forms, pairing, favorability key); C1-LA3 (G); C-U3-T (critic; closed-form link) and U3 (seat C2-U-03; Node 0) for the link machinery; C2-LA1 and C2-LA2 (r31 Cycle 2 formalizers); plus the formalizer c2-la3-formalizer-opus-20260928 (Claude Opus 5.5; chartered effort high, session-applied; runtime-reported model id claude-opus-5-5). Carry provenance (binding, not an attribution addition): the definition layer and entries 60, 72, 74 are C1-LA2's (r31 C1 formalizer); each carried fragment keeps its origin header."
