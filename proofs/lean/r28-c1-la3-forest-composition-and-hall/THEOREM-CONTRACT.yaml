  "contract_id": "erdos-993-r28-c1-la3-forest-composition-and-hall-v1",
  "theorem": {
    "title": "r28 C1-LA3: forest degree lemma from the tree degree lemma at every size a ≤ k (FC, corrected), with the SDR/threshold equivalence on trees as companion lemma",
    "informal_statement": "(FC), corrected (erratum R28-E-c), key E993-R28-FOREST-DEGREE-LEMMA-FROM-TREES: for every finite simple graph G on a finite type X in universe u with G acyclic (a finite forest) and every k : ℕ, IF for every finite tree T on any carrier Y : Type u and every a ≤ k the degree lemma D_a(T) ≤ 2a·i_a(T) holds, THEN D_k(G) ≤ 2k·i_k(G), with i = Erdos993G1.indepCount (r25 entry 1) and D = Erdos993G1.indepDegreeSum (r27 entry 7). Acyclicity enters only through 'components of a forest are trees'; the composition itself (separated-union convolution, bridge, peel over components) holds for every finite graph (scope declarations R28CritU2T.degree_lemma_of_components, R28CritU2T.forest_degree_lemma_of_components_allk, R28U2.indepCountOn_union, R28U2.indepDegreeSumOn_union — hsep and hdisj both necessary — R28CritU2T.bridge, R28CritU2T.induce_supp_isTree). Companion lemma in the same source, key E993-R28-SDR-THRESHOLD-EQUIVALENCE (registers independently; not a dependency of the terminal theorem): lemma sdr_iff_threshold_pos_of_tree {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] (hT : G.IsTree) (k : ℕ) :\n    (∃ f : R28U2.Slot G → X, Function.Injective f ∧\n        ∀ s, G.degree (f s) = 1 ∧ R28U2.occ G s.1.1 k ≤ R28U2.occ G (f s) k) ↔\n      (∀ t, 1 ≤ t → R28U2.slotsAtLeast G k t ≤ R28U2.leavesAtLeast G k t) ; scope declaration R28U2.sdr_iff_threshold (graph-general, ∀ t : ℕ) via R28U2.nested_hall_iff_threshold and R28U2.sdr_iff_threshold_abstract, and R28CritU2F.tree_slots_zero_le. Fences: (FC) is never composed with r27's forest_degree_lemma to present a second proof of (DL) (not carried into this project); it is the formal consequence clause of E993-R27-POTENTIAL-SEPARATED-UNION-CONVOLUTION, a scope note there. The SDR equivalence is per (G, k), never evidence for either side. U2's slot_leaf_sdr_exists and tree_leaf_slot_dominance (FALSE, T22) are not carried and nothing depends on them. No status transfer (SOLUTION-CONTRACT §3.1). Attribution: (FC) — r27 convolution key (SR-JOIN JN-2), U2 (seat, convolution in Lean), C-U2-T (end to end, bridge), C-U2-F (core); SDR — T2 (Lemma SAP, informal), C-F1-T (rank lemma), Hall (Mathlib), U2 (graph-general Lean), C-U2-F (tree form), SR-PP (PP-3)."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "(FC): r27 E993-R27-POTENTIAL-SEPARATED-UNION-CONVOLUTION proved_informal (SR-JOIN JN-2); r28 synthesis Exact established results item 8 at the corrected every-a hypothesis (R28-E-c).",
      "SDR: r28 E993-R28-SDR-THRESHOLD-EQUIVALENCE proved_informal (T2 Lemma SAP; C-F1-T rank lemma); synthesis item 5.",
      "The single-k form of SOLUTION-CONTRACT §2 is defective (K_4 ⊔ K_4, k = 2) and is not this contract's statement."
    ]
  },
