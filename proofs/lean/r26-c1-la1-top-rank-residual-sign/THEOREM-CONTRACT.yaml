  "theorem": {
    "title": "C1-LA1 Top-Rank Residual Sign for Finite Eligible Residual Trees (RC)",
    "informal_statement": "For every finite simple graph G on a finite vertex type with decidable equality and decidable adjacency: if G is a tree, 2 <= alpha(G), x(G) + 2 <= alpha(G) - 1, and every leaf of G belongs to every maximum independent set of G, then the literal top-rank residual aggregate satisfies S(G, alpha(G)-1) <= 0. The proof composes the verified (RI) identity S = ell M - W with the exact budget identity sum_{s in B cap C}(lambda(s)-1) + (a - |B cap D|) + h(B) = 1 on I_{alpha-1}(G), the three-family classification (I) A_C empty, (II) A_C = {s} with lambda(s) = 2, (III) |A_D| = a - 1 obtained by forced-neighbour pruning under (star), the exact counts |family I| = ell M and N_2 <= k_2 M with k_2 <= floor(ell/2), and the nonnegativity of the family-(III) weight sum via the deletion injection, giving S <= -ell(ell-2) M - (ell-4) N_2 and hence S <= 0 in each of the branches ell >= 4, ell = 3 and ell = 2. The statement is NON-STRICT and is confined to rank alpha-1 on the eligible residual class."
  },
