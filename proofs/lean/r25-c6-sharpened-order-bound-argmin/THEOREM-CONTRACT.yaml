  "theorem": {
    "title": "Candidate D's argmin step (C6-LA6; T2's node N8; RE-FROZEN contract; scope update of E993-R25-FOREST-ORDER-BOUND-SHARPENED)",
    "informal_statement": "Let C(a,b) denote the zero-extended integer binomial coefficient (0 whenever a < 0 or b < 0, or b > a >= 0). Let H(n,k,e,c_e) := C(n,k+1) - e*C(n-2,k-1) + (e-c_e)*C(n-3,k-2) + (c_e-1)*C(n-4,k-3), and W(n,k,e) := H(n,k,e, min(e, n-e)). For every integer n >= 4, every integer k, and every integer e with 1 <= e <= n-1: H(n,k,n-1,1) <= W(n,k,e). That is, e = n-1, c_e = 1 minimises H(n,k,e,min(e,n-e)) over 1 <= e <= n-1 (Candidate D's own missing step, in Candidate D's own words). NO graph token occurs anywhere in this statement: it is purely about zero-extended integer binomial coefficients, uniform in k, with the n >= 4 fence TIGHT (the Pascal-derived closed form underlying the proof fails at n = 3, k = 1, e = 1 and below; EVIDENCE/argmin_evidence_check.py Check B). d, nu, tau and x(F) < r occur nowhere. This is NOT the forest order bound: the seat's own separate frozen contract of RETURN.md Section 4.1 (graph theorem, declaration name Erdos993G1.ForestOrderBound.forest_descent_order_bound_sharpened) is explicitly NOT dispatched by this contract -- no shipped fragment proves it (a token sweep of every compiled source finds no SimpleGraph, IsAcyclic, indepCount or Erdos993G1 occurrence). Registry effect: no new E993-R25-... registration; a SCOPE UPDATE of the already-registered E993-R25-FOREST-ORDER-BOUND-SHARPENED (whose scope text names this exact argmin as its own open step) -- \"the argmin step is now kernel-checked\" -- never a grade change."
  },
