    }
  ],
  "hypotheses": [
    {
      "id": "hyp-acyclic",
      "statement": "F.IsAcyclic (SimpleGraph.IsAcyclic; never SimpleGraph.IsTree, so no connectivity is assumed -- disconnected forests are genuinely covered).",
      "dependencies": ["domain-f"]
    },
    {
      "id": "hyp-order",
      "statement": "12 <= Nat.card X (the exact threshold of the n >= 12 half of E993-R25-FOREST-DELTA3-THRESHOLD-ORDER-12).",
      "dependencies": ["domain-x"]
    }
  ],
  "conclusion": {
    "id": "conclusion",
    "statement": "0 < Erdos993G1.delta F 3",
    "dependencies": ["def-delta", "hyp-acyclic", "hyp-order"]
  },
