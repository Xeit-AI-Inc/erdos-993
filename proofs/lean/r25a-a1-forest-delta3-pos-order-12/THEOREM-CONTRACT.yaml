{
  "schema_version": "theorem-contract/v1",
  "contract_id": "a1-la1-forest-delta3-order-12-v1",
  "theorem": {
    "title": "Forest Delta-3 positivity threshold at order 12 (n >= 12 half only)",
    "informal_statement": "For every finite simple graph F on a finite vertex type X, if F is acyclic (a forest, connected or not) and Nat.card X is at least 12, then Delta_3(F) = i_4(F) - i_3(F) > 0, where i_k(F) is the exact count of independent k-subsets of F (Erdos993G1.indepCount), coeff is the integer zero-extension of indepCount to negative indices, and delta is the first difference coeff(k+1) - coeff(k). This proves the first conjunct only of the registered claim E993-R25-FOREST-DELTA3-THRESHOLD-ORDER-12, whose second conjunct (sharpness at order 11, P_11 the unique minimiser, Delta_3 = -14) is explicitly excluded from this contract and stays proved_informal."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "SOURCE/ADJUDICATION.md",
      "SOURCE/SYNTHESIS.md",
      "SOURCE/RETURN.md"
    ]
  },
  "definitions": [
    {
      "id": "def-indepcount",
      "description": "Exact integer count of independent k-subsets of a finite simple graph F on carrier V: the cardinality of the subtype of k-element Finset V that are F-independent sets, cast to Int. Frozen G1 definition, byte-identical to the sealed source (see SOURCE/SEMANTIC-CONTRACT.md).",
      "lean_name": "Erdos993G1.indepCount",
      "dependencies": []
    },
    {
      "id": "def-coeff",
      "description": "Integer zero-extension of indepCount to all integer indices: coeff F k = indepCount F k.toNat when 0 <= k, else 0.",
      "lean_name": "Erdos993G1.coeff",
      "dependencies": ["def-indepcount"]
    },
    {
      "id": "def-delta",
      "description": "First difference of coeff: delta F k = coeff F (k+1) - coeff F k. Delta_3(F) is a positivity statement (opposite sign from a no-recovery statement); x(F) (first strict descent) never enters this proof.",
      "lean_name": "Erdos993G1.delta",
      "dependencies": ["def-coeff"]
    }
  ],
  "domains": [
    {
      "id": "domain-x",
      "description": "The (implicit) finite vertex carrier type of the forest, [Finite X].",
      "lean_type": "Type u",
      "dependencies": []
    },
    {
      "id": "domain-f",
      "description": "A simple graph structure on the carrier X.",
      "lean_type": "SimpleGraph X",
      "dependencies": ["domain-x"]
    }
  ],
  "quantifiers": [
    {
      "binder": "X",
      "kind": "forall",
