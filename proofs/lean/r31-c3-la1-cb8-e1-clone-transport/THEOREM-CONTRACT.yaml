    "title": "C3-LA1 (r31): the E1 clone-level transport at the class and its rho-links - at p* = (16m+4)/3 for every 1 <= q <= m on the class m >= 107, m = 2 (mod 3), d = 8, clone level only",
    "informal_statement": "Canonical run id erdos-993-math-dre-20260927-r31-cb-uniform-switch; award C3-LA1 (the E1 clone-level transport at the class and its rho-links), Lean run lean-2026-09-28-c3-la1-cb8-e1-clone-transport. Definitions (frozen synthesis text): e1S a b j al = [al <= j] C(a,al) C(b,j-al) 2^(j-al) in Q; e1T a b j al = [al+1 <= j] C(a,al) C(b,j-1-al) 2^(j-1-al); e1Rho a b j = (sum_{al<=a} e1S)/(sum_{al<=a} e1T); e1G a b j al = e1Rho * (sum_{i<al} e1T) - sum_{i<al} e1S; e1H = e1S - e1G. Terminal: for all m : N with 107 <= m and m % 3 = 2 (p* = (16m+4)/3 exact): (1) e1Rho (8*1-1) (8*(m-1)+1) ((16m+4)/3-1) = cb8R1 m ((16m+1)/3) / cb8R1 m ((16m+1)/3-1) over Q (C1-LA1's cb8R1); (2) for all q with 1 <= q <= m, writing a = 8q-1, b = 8(m-q)+1, j = (16m+4)/3-q: (2a) e1Rho a b j equals the ratio of the Z-coefficients of X^j and X^(j-1) in (1+X)^a (1+2X)^b cast to Q; (2b) e1Rho a b j < 1; (2c) for all a b j equal to those values: every G_al, H_al (al <= a) is >= 0; G_(al+1) + H_al = rho T_al for al < a; H_a = rho T_a; G_0 = 0; j <= a implies G_j = S_j and H_j = 0; and for every al <= a with T_al > 0 the column sum [al<a](a-al) G_(al+1)/((al+1) S_(al+1)) + [j-1-al<b] 2(b-(j-1-al)) H_al/((j-al) S_al) = rho. Lean conventions: N truncated subtraction and floor division (all true values on the domain; audited in INFORMAL-PROOF.md), x/0 = 0 (never reached in a used branch). Proof DAG (synthesis steps 1-9): coefficient bridge; domain Sum T > 0 from carried C1-LA3 entry 14; rho < 1 from carried entry 20 through the bridge (never a hypothesis); the q = 1 link to cb8R1; in-balance/top telescoping; G_0 = 0 and saturation; absorption identities; columns incl. degenerate l = b; nonnegativity by the minor inequalities of carried entry 15 at a = 0 and b = 0 (TP-g/TP-h; no Newton, no Darroch). Fences: clone level only - NOT a statement about cbGraph m; NOT the E1 flow on the literal network; NOT conjunct 4; NOT (HALL) at any scope; NOT S(T_m, p*) <= 0; NOT progress on (L-S)_to