    {
      "id": "def-forward-difference-del",
      "description": "Carried (C4-LA1 entry 11 = first-interior entry 12). Delta_k(G - D) = i_(k+1) - i_k, integer-valued. Lean text of record: namespace C5LA1\n\nopen SimpleGraph C4LA1\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\n/-- `Delta_k(G - D) = i_(k+1)(G-D) - i_k(G-D)`. -/\ndef forwardDifferenceDel (G : SimpleGraph V) [DecidableRel G.Adj]\n    (D : Finset V) (k : Nat) : Int :=\n  (indepSetCount G D (k + 1) : Int) - indepSetCount G D k\n\nend C5LA1",
      "lean_name": "C5LA1.forwardDifferenceDel",
