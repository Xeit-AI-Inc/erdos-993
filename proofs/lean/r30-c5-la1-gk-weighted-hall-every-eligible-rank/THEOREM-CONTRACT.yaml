  "theorem": {
    "title": "C5-LA1 (r30 Cycle 5, erdos-993-math-dre-20260926-r30-weighted-transport): the tree face and (HALL) at every eligible rank of G_k",
    "informal_statement": "For every k : Nat, the graph G_k = gkGraph k on Fin (3k+5) (root 0; leaf 1; cherry 2 with leaves 3, 4; k arms 0 - a_i - b_i - c_i) is a tree, and for every rank p with crossingIndex(G_k) + 2 <= p and 3p < 2 indepNum(G_k) + 1 the transport network of SOLUTION-CONTRACT section 2 at rank p with tag set F_p(G_k) = favorableLeaves (gkGraph k) p admits a saturating integral flow. hLow is carried and unused. Proof DAG: N0 carried (C4-LA1 entries 1-112, first-interior entry 14); N1 gkGraph_isTree (U1); N4a count bridge i_(j+1) = u_(j+1) + u_j, i_0 = u_0 (gkHalfCount); N4b u_j <= u_(j+2) for j + 2 <= k + 1; N4 = GK-MONO in Lean (0 <= Delta_j for j <= k); N2 k + 1 <= crossingIndex iff no descent at j <= k (C-U1-F); N3 reduction to C4-LA1 lemma entry 110 (C-U1-F); terminal = <N1, N3 o N2 o N4>. Fences: G_k only; deletion-supported flows (C4-LA1's); not (HALL) at full scope; not 'every tree'; nothing about the primary aggregate beyond G_k; not an RTree statement; not the strict GK-SIGN; G_k is not a second family for gate ruling 39; the k = 3 row (n = 14, p = 6) lies in the formally closed band n <= 2p+2 and is covered without re-proving that band; no statement about switch arcs or cuts; no status change of (HALL), the primary aggregate or any refuted key; (HALL) is asserted at no scope other than this theorem's own family. Companions: GK-MONO (key E993-R30-GK-TREE-INDEPENDENCE-COUNTS-NONDECREASING-THROUGH-RANK-K-PLUS-ONE) is stated on the face as a companion; its Lean form is the lemma gk_forwardDifference_nonneg (N4); this contract asserts no grade for any companion (the controller rules). Eligible set nonempty iff k >= 3 (informal companion fact, SR-C4-8; indepNum = 2k+3 not authored). Canonical run id erdos-993-math-dre-20260926-r30-weighted-transport; award C5-LA1; key on closure E993-R30-GK-TREE-WEIGHTED-HALL-AT-EVERY-ELIGIBLE-RANK (separate from C4-LA1's key). Attribution: mechanism and the lower-region run: Codex GPT-6; definition layers: first-interior (Codex) entries 1-18 incl. C5LA1.crossingIndex (entry 14), the r26/r24/r25 carried layers; C1-LA1/C1-LA2 (r30); the G_k flow: C4-LA1 (r30 Cycle 4; CT-1 by critic C-F2-T, R2' by the Cycle 4 F adjudicator); gkGraph_isTree: U1 (Claude Sonnet 5); GK-MONO: C-U1-T and C-U1-F (Claude Opus 5.5); the Lean reduction: C-U1-F; the composition and DAG: the Cycle 5 U adjudicator (Claude Opus 5.5); count bridge fibre count, N4b re-pairing and integer closing step, and Lean assembly: the C5-LA1 formalizer (Claude Opus 5.5); r29 high tail: not used."
  },
