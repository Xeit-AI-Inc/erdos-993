    "statement": "(gkGraph k).IsTree ∧ ∀ p : ℕ, C5LA1.crossingIndex (gkGraph k) + 2 ≤ p → 3 * p < 2 * (gkGraph k).indepNum + 1 → ∃ f, IsSaturatingFlow (gkGraph k) (favorableLeaves (gkGraph k) p) p f. For every k: G_k is a tree, and at every eligible rank p the network with tag set F_p(G_k) has a saturating integral flow ((HALL) in flow form). The deletion-support conjunct of C4-LA1 is omitted from the conclusion (choice recorded). Fences: G_k only; deletion-supported flows (C4-LA1's); not (HALL) at full scope; not 'every tree'; nothing about the primary aggregate beyond G_k; not an RTree statement; not the strict GK-SIGN; G_k is not a second family for gate ruling 39; the k = 3 row (n = 14, p = 6) lies in the formally closed band n <= 2p+2 and is covered without re-proving that band; no statement about switch arcs or cuts; no status change of (HALL), the primary aggregate or any refuted key; (HALL) is asserted at no scope other than this theorem's own family. Companions: GK-MONO (key E993-R30-GK-TREE-INDEPENDENCE-COUNTS-NONDECREASING-THROUGH-RANK-K-PLUS-ONE) is stated on the face as a companion; its Lean form is the lemma gk_forwardDifference_nonneg (N4); this contract asserts no grade for any companion (the controller rules). Eligible set nonempty iff k >= 3 (informal companion fact, SR-C4-8; indepNum = 2k+3 not authored). Canonical run id erdos-993-math-dre-20260926-r30-weighted-transport; award C5-LA1; key on closure E993-R30-GK-TREE-WEIGHTED-HALL-AT-EVERY-ELIGIBLE-RANK (separate from C4-LA1's key).",
