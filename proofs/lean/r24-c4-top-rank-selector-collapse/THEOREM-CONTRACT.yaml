{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c4-la1-top-rank-selector-collapse-v1",
  "theorem": {
    "title": "C4-LA1 Top-Rank Selector Collapse for Finite Literal Ordinary Trees",
    "informal_statement": "For every finite literal ordinary tree T with alpha(T) at least 2, every leaf v is strictly favorable at p = alpha(T)-1; equivalently, i_alpha(T)(T-v) is strictly less than i_(alpha(T)-1)(T-v)."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Award capsule semantic seal c481fe2755552a0f66e0c4c74009556b2cf62644c92051e02458e3fd967ad3b6 verified with all eight file digests and byte counts.",
      "The retained F7 theorem and both critiques establish the exact literal finite-tree selector collapse; Stage 5 adjudication and Stage 6 synthesis award this theorem without the aggregate-sign conclusion.",
      "INFORMAL-PROOF.md records the source-bound direct injection proof and all scope exclusions."
    ]
  },
  "definitions": [
    {
      "id": "def-independence-number",
      "description": "alpha(T), the maximum cardinality of an independent vertex set of T.",
      "lean_name": "SimpleGraph.indepNum",
      "dependencies": ["domain-finite-simple-graph"]
    },
    {
      "id": "def-graph-leaf",
      "description": "A vertex v is a leaf of T exactly when there exists a unique u adjacent to v.",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": ["domain-finite-simple-graph", "domain-vertex"]
    },
    {
      "id": "def-vertex-deletion-coefficient",
      "description": "i_k(T-v), the number of independent k-subsets of the original finite vertex type that avoid v.",
      "lean_name": "C4LA1.vertexDeletionIndepSetCount",
      "dependencies": ["domain-adjacency-decision", "domain-finite-simple-graph", "domain-vertex"]
    },
    {
      "id": "def-forward-difference",
      "description": "The integer forward difference i_(p+1)(T-v) - i_p(T-v).",
      "lean_name": "C4LA1.vertexDeletionForwardDifference",
      "dependencies": ["def-vertex-deletion-coefficient"]
    },
    {
      "id": "def-favorable",
      "description": "A leaf v is favorable at p exactly when the vertex-deletion forward difference is strictly negative.",
      "lean_name": "C4LA1.IsFavorableAt",
      "dependencies": ["def-forward-difference"]
    },
    {
      "id": "def-top-rank",
      "description": "The top interior rank p is alpha(T)-1 in Nat.",
      "lean_name": "Nat.sub",
      "dependencies": ["def-independence-number"]
    }
  ],
  "domains": [
    {
      "id": "domain-vertex-type",
      "description": "An arbitrary finite vertex type with decidable equality.",
      "lean_type": "V : Type* with [Fintype V] [DecidableEq V]",
      "dependencies": []
    },
    {
      "id": "domain-finite-simple-graph",
      "description": "An arbitrary finite simple graph on V; the tree property is a separate theorem hypothesis.",
      "lean_type": "G : SimpleGraph V",
      "dependencies": ["domain-vertex-type"]
    },
    {
      "id": "domain-adjacency-decision",
      "description": "Decidable adjacency data used only to compute finite independent-set coefficients.",
      "lean_type": "[DecidableRel G.Adj]",
      "dependencies": ["domain-finite-simple-graph"]
    },
    {
      "id": "domain-vertex",
      "description": "An arbitrary original vertex of G.",
      "lean_type": "v : V",
      "dependencies": ["domain-finite-simple-graph", "domain-vertex-type"]
    }
  ],
  "quantifiers": [
    {"binder": "V", "kind": "forall", "domain_id": "domain-vertex-type"},
    {"binder": "G", "kind": "forall", "domain_id": "domain-finite-simple-graph"},
    {"binder": "adjacencyDecision", "kind": "forall", "domain_id": "domain-adjacency-decision"},
    {"binder": "v", "kind": "forall", "domain_id": "domain-vertex"}
  ],
  "hypotheses": [
    {
      "id": "hyp-tree",
      "statement": "G is a connected acyclic simple graph, i.e. G.IsTree.",
      "dependencies": ["domain-finite-simple-graph"]
    },
    {
      "id": "hyp-alpha-lower-bound",
      "statement": "2 <= G.indepNum.",
      "dependencies": ["def-independence-number"]
    },
    {
      "id": "hyp-leaf",
      "statement": "v is a leaf of G in the unique-neighbor sense.",
      "dependencies": ["def-graph-leaf"]
    }
  ],
  "conclusion": {
    "id": "conclusion-top-rank-selector-collapse",
    "statement": "v is favorable at G.indepNum - 1, equivalently the integer forward difference i_alpha(G)(G-v) - i_(alpha(G)-1)(G-v) is strictly negative.",
    "dependencies": ["def-favorable", "def-top-rank", "hyp-alpha-lower-bound", "hyp-leaf", "hyp-tree"]
  },
