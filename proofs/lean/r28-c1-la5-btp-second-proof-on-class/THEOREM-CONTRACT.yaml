    "def-degree"
   ]
  },
  {
   "id": "def-branch-tree-max-degree-le-two",
   "description": "Run-local class predicate (new, entry 6): every branch vertex v (3 <= deg v) has at most two neighbours w from which a vertex z with 3 <= deg z is reachable by a walk of G avoiding v (equivalently: reachable in G − v; proved equivalent to the synthesis's induced-subgraph wording (G.induce {v}ᶜ).Reachable ⟨w,_⟩ ⟨z,_⟩ with z ≠ v by lemma branchTreeMaxDegreeLeTwo_iff_induce). The filter uses classical decidability (open Classical in). Lean text: def BranchTreeMaxDegreeLeTwo {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] : Prop :=\n  ∀ v : X, 3 ≤ G.degree v →\n    (Finset.univ.filter (fun w => G.Adj v w ∧\n      ∃ z : X, 3 ≤ G.degree z ∧ ∃ p : G.Walk w z, v ∉ p.support)).card ≤ 2",
   "lean_name": "Erdos993G1.BranchTreeMaxDegreeLeTwo",
