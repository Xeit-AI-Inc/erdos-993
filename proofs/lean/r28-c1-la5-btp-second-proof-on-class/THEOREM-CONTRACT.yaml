   "description": "Occupancy count c_v(k), the number of independent k-sets containing v (run definition layer; carried byte-identically from the C1-LA4 / C1-LA2 runs, identical entry db58fa88...; origin U1-Main.lean). Lean text: def occ {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj]\n    (v : X) (k : ℕ) : ℕ :=\n  ((G.indepSetFinset k).filter (fun J => v ∈ J)).card",
   "lean_name": "Erdos993G1.occ",
   "dependencies": [
