   "description": "Number of leaves with c_l(k) >= t (carried byte-identically, entry e916f3de...; origin U1). Not in the terminal statement; see def-slots-at-least. Lean text: def leavesAtLeast {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X)\n    [DecidableRel G.Adj] (k t : ℕ) : ℕ :=\n  (Finset.univ.filter (fun ℓ => G.degree ℓ = 1 ∧ t ≤ occ G ℓ k)).card",
   "lean_name": "Erdos993G1.leavesAtLeast",
   "dependencies": [
