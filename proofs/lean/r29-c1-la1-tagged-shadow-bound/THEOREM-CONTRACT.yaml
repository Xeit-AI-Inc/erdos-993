{
  "schema_version": "theorem-contract/v1",
  "contract_id": "erdos-993-r29-c1-la1-tagged-shadow-bound-v1",
  "theorem": {
    "title": "Bipartite tagged-shadow bound (TSB), E993-BIPARTITE-TAGGED-SHADOW-BOUND, r29 award C1-LA1",
    "informal_statement": "For every finite type V ([Fintype V] [DecidableEq V]), every simple graph H on V with [DecidableRel H.Adj] that is bipartite (H.IsBipartite), every tag set W : Finset V, and every natural k with 1 <= k <= H.indepNum: (k:Z) * q_{k+1} <= 2 * ((H.indepNum:Z) - k) * q_k in the integers, where q_j := (taggedFamily H Finset.univ W j).card is the number of independent j-subsets of V that meet W. Key E993-BIPARTITE-TAGGED-SHADOW-BOUND (TSB), r29 award C1-LA1 (canonical run id erdos-993-math-dre-20260925-r29-high-tail-certification); OPEN -> VERIFIED by this award only. N/Z equivalence: under hka : k <= H.indepNum the integer value (H.indepNum:Z) - k equals the cast of the natural truncated value H.indepNum - k (Nat.cast_sub hka); the registry text (1 <= k <= a, integers) and the Lean text agree on this domain. Hypothesis consumption: hBip is consumed at entry 41's Core.card_extension_le (the proper 2-colouring splits the addable set into two colour classes); hk : 1 <= k is statement scope (passed to entry 41, whose body does not use it); hka is consumed by Nat.cast_sub. Fences: SOLUTION-CONTRACT 3.1 (a statement about independent-set counts on finite bipartite graphs; not a no-recovery statement; no status transfer to E993-R25-UNR-FOREST-WIDE, E993-G1WIDE-NO-SIZE-CAP, NR1, FOREST, TREE, TRANSFER, E993-BETA-AGG or Erdos #993); 3.4 (this is NOT E993-C3-G1-POINTWISE-ADDABILITY-BOUND, which stays REFUTED and is neither reopened nor aliased); 3.7 (attribution on every face); 3.8 (a separate certificate; entry 41's presence inside the first-interior package is context, never a certificate). Excluded conclusions: no leaf, tree, selector or aggregate statement; no k = 0 or k > a clause in the terminal theorem (the N companion without k <= a is a lemma only); no tightness claim; nothing about non-bipartite graphs (false there, B4: K_1 disjoint-union K_5); no reopening or aliasing of the refuted addability bound. Attribution: Codex (GPT-6 Luna/Sol/Astra) for the tagged-shadow mechanism, entry 41 and the proposed statement (Sol's C2 scope audit); the first-interior award source for the definition of entry 18; r29 T1 (registry derivation), C-T1-F and C-T1-U (the Nat.cast_sub hka narrowing), U1 (scratch compile), C-U1-T and C-U1-F (carry sets, candidates), U's adjudicator (base candidate; the bodies of the companion lemma and the terminal theorem are adjudicator-authored and transported byte-identically), F1, C-F1-T and C-F1-U (falsification, tightness). Governing text: cycles/cycle-1/stage6/SYNTHESIS.md, ## Lean awards, C1-LA1."
  },
