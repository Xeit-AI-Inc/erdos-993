    "status": "established",
    "evidence": [
      "Synthesis R-TSB (cycles/cycle-1/stage6/SYNTHESIS.md): grade proved_informal at the close of Stage 6 (T1 registry derivation; C-T1-F, C-T1-U, T's adjudicator).",
      "Bounded: 56,649,670 triples to order 7, 0 failures (F1, replayed three times); pre-run: all 5,604 bipartite labelled graphs of orders 1-6 with every W and every 1 <= k <= a.",
      "Scratch kernel compiles (replays, not certificates): T's adjudicator CarryLA1, U's adjudicator awards/LA1, C-U1-F, C-U1-T.",
      "No counterexample is known; the statement is false for non-bipartite graphs (B4), which the hypothesis hBip excludes.",
      "This contract makes no formally_verified claim; the informal audit and fidelity review are separate pending gates."
    ]
  },
  "definitions": [
    {
      "id": "def-isbipartite",
      "lean_name": "SimpleGraph.IsBipartite",
      "dependencies": [],
      "description": "Mathlib (Bipartite.lean:286): abbrev IsBipartite (G : SimpleGraph V) : Prop := G.Colorable 2 -- a proper 2-colouring exists; disconnected graphs, isolated vertices and the empty graph are included."
    },
    {
      "id": "def-isindepset",
      "lean_name": "SimpleGraph.IsIndepSet",
      "dependencies": [],
      "description": "Mathlib (Clique.lean:843): abbrev IsIndepSet (s : Set α) : Prop := s.Pairwise (fun v w ↦ ¬G.Adj v w) -- no two distinct members are adjacent."
    },
    {
      "id": "def-indepnum",
      "lean_name": "SimpleGraph.indepNum",
      "dependencies": [
        "def-isindepset"
      ],
      "description": "Mathlib (Clique.lean:983): noncomputable def indepNum (G : SimpleGraph α) : ℕ := sSup {n | ∃ s, G.IsNIndepSet n s} -- the independence number a = α(H); every independent finset has card ≤ indepNum (IsIndepSet.card_le_indepNum, Clique.lean:991, a lemma, not a definition)."
    },
    {
      "id": "def-univ",
      "lean_name": "Finset.univ",
      "dependencies": [],
      "description": "Mathlib (Data/Fintype/Defs.lean:92): def univ : Finset α := @Fintype.elems α _ -- the finset of all vertices; the carrier U of taggedFamily in this award."
    },
    {
      "id": "def-taggedfamily",
      "lean_name": "E993Interior.taggedFamily",
      "dependencies": [
        "def-isindepset"
      ],
      "description": "Carried byte-identically (first-interior entry 18, fragment SHA-256 cb43feebd48bdf3a82d95db4c0475a34a83acdd8c55f13ac44433ea26141fa1e; this run's registrar entry 1), inside namespace E993Interior / noncomputable section: def taggedFamily {V : Type*} [Fintype V] [DecidableEq V]\n    (G : SimpleGraph V) [DecidableRel G.Adj] (U W : Finset V) (k : ℕ) :\n    Finset (Finset V) := by\n  classical\n  exact (U.powersetCard k).filter fun A =>\n    G.IsIndepSet (A : Set V) ∧ ¬ Disjoint A W -- the k-subsets of U that are independent in G and meet W. q_j(H, W) := (taggedFamily H Finset.univ W j).card."
    }
  ],
