      "description": "NEW in r30, namespace E993Transport; U2's compiled text (r30 U2, Claude Sonnet 5), carried byte-identically at the declaration level from U2-Main.lean (110c2751...2743). The active-tag weight w_F(B): counts v in F n B with (B \\ {v}) n W_v nonempty, i.e. B contains ANOTHER neighbour of v's original support (erratum R30-E-b wording); NEVER |F n B|. Lean text of record (this run's registrar entry 16, fragment SHA-256 074ed034729850d34722d0b1ceeb96d8362beaebf3b7a409cb3fab28a9850b93):\n/-- the active-tag weight of `B` w.r.t. the tag set `F`: `v ∈ F ∩ B` is counted\niff `B` contains another neighbour of `v`'s original support. -/\nnoncomputable\ndef activeWeight (G : SimpleGraph V) [DecidableRel G.Adj] (F B : Finset V) : ℕ :=\n  ((F ∩ B).filter fun v => ¬ Disjoint (B.erase v) (tagWitnesses G v)).card"
