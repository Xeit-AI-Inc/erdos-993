      "description": "Carried BYTE-IDENTICALLY through the registrar from the first-interior award source (Codex, first-interior run; r24/r25/r26 definition layers), first-interior entry 12. Delta_k(G - D) = (i_(k+1) : Z) - i_k; both counts cast to Z before subtracting. Lean text of record (this run's registrar entry 11, fragment SHA-256 60bd8efcc88e8e511a7caacac5867f7845243ccab08f1660e8c3962af544dd8f):\nnamespace C5LA1\n\nopen SimpleGraph C4LA1\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\n/-- `Delta_k(G - D) = i_(k+1)(G-D) - i_k(G-D)`. -/\ndef forwardDifferenceDel (G : SimpleGraph V) [DecidableRel G.Adj]\n    (D : Finset V) (k : Nat) : Int :=\n  (indepSetCount G D (k + 1) : Int) - indepSetCount G D k\n\nend C5LA1"
