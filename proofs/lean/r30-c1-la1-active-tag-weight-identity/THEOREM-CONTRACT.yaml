      "description": "NEW in r30, namespace E993Transport; U2's compiled text (r30 U2, Claude Sonnet 5), carried byte-identically at the declaration level from U2-Main.lean (110c2751...2743). (HALL-COND) for every source subfamily; `open Classical in` (synthesis repair 3). FROZEN HERE ONLY for C1-LA2; occurs in no statement of this award; nothing here asserts it. Lean text of record (this run's registrar entry 21, fragment SHA-256 63534ffbfcc4bb1297228e598da165dcf98732939cd51a5d7fda3e62bc518478):\nopen Classical in\n/-- weighted Hall for every source subfamily. -/\ndef WeightedHall (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ) : Prop :=\n  ∀ X ⊆ indepFamily G (p + 1),\n    ∑ B ∈ X, activeWeight G F B ≤\n      ∑ A ∈ (indepFamily G p).filter (fun A => ∃ B ∈ X, transportRel G B A), activeWeight G F A"
