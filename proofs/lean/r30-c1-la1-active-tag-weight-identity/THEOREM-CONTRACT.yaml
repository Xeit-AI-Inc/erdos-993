      "description": "NEW in r30, namespace E993Transport; U2's compiled text (r30 U2, Claude Sonnet 5), carried byte-identically at the declaration level from U2-Main.lean (110c2751...2743). FROZEN HERE ONLY for C1-LA2; occurs in no statement of this award. Lean text of record (this run's registrar entry 20, fragment SHA-256 a9d81c260914024d38f46ff5b564749d34f640674f9e9116685b4e7c631a48ac):\n/-- a saturating integral flow of the network at rank `p` with tag set `F`. -/\ndef IsSaturatingFlow (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ)\n    (f : Finset V → Finset V → ℕ) : Prop :=\n  (∀ B A, 0 < f B A → B ∈ indepFamily G (p + 1) ∧ A ∈ indepFamily G p ∧ transportRel G B A) ∧\n  (∀ B ∈ indepFamily G (p + 1), ∑ A ∈ indepFamily G p, f B A = activeWeight G F B) ∧\n  (∀ A ∈ indepFamily G p, ∑ B ∈ indepFamily G (p + 1), f B A ≤ activeWeight G F A)"
    },
