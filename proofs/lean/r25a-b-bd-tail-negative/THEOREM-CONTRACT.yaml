  "theorem": {
    "title": "Bd tail negativity, r >= 6 (r25 ADDENDUM lane B, seat B-LA1)",
    "informal_statement": "With D(b,m) = C(b,m+1) - 2C(b,m) + C(b,m-1) (zero-extended integer binomial coefficients) and the RANGED Bd(r,r) = D(2r-1,r) + sum_{a=1}^{6} C(6,a) * max(0, max_{0<=b<=2r-1-a} D(b,r-a)) (C-U2-F's integer-rank MaR/BdRR of record, CriticF2.lean verbatim): Bd(r,r) < 0 for every integer r >= 6. This is the r >= 6 half of the registry claim E993-R25-BD-TAIL-NEGATIVE; the parenthetical sharpness half (Bd(r,r) >= 0 exactly at r in {2,3,4,5}) is out of scope. No graph object occurs; this is pure binomial-integer arithmetic."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "EVIDENCE/generate_bd_tail_checks.py exact-integer replay, r = 2..60, 0 failures",
      "RECEIPTS/kernel-verification.json verdict.code = verified"
    ]
  },
  "definitions": [
    {
      "id": "def-cz",
      "description": "Zero-extended integer binomial coefficient: Cz n k = C(n,k) for 0<=k<=n, else 0 (also 0 for negative n or k). C-U2-F's convention, imported byte-identically from the C6-LA4 award (formally_verified).",
      "lean_name": "ErdosR25C6U2.Cz",
      "dependencies": []
    },
    {
      "id": "def-d",
      "description": "D(b,m) = C(b,m+1) - 2C(b,m) + C(b,m-1), over ZZ, via Cz. Imported byte-identically from the C6-LA4 award (formally_verified).",
      "lean_name": "ErdosR25C6U2.D",
      "dependencies": ["def-cz"]
    },
    {
      "id": "def-mar",
      "description": "The ranged Hall maximum M_a(r) = max_{0<=b<=2r-1-a} D(b, r-a), integer inner rank (r:ZZ)-(a:ZZ), unconditionally nonempty Finset.range. C-U2-F's definition of record (CriticF2.lean), reproduced verbatim in this run's own namespace.",
      "lean_name": "ErdosR25AddBdTail.MaR",
      "dependencies": ["def-d"]
    },
    {
      "id": "def-bdrr",
      "description": "Bd(r,r) = D(2r-1,r) + sum_{a=1}^{6} C(6,a) * max(0, M_a(r)). C-U2-F's definition of record (CriticF2.lean), reproduced verbatim in this run's own namespace; reproduces BdRR 4 = 48, BdRR 5 = 33, BdRR 6 = -16, BdRR 10 = -14406 by decide.",
