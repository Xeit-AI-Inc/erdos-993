  "theorem": {
    "title": "Matching dual scalar core (award group C5-LA1, E993-R25-MATCHING-DUAL-SCALAR-CORE)",
    "informal_statement": "Pure arithmetic of the stratified matching-incidence certificate's greedy dual, uniform in (m, d) on the region and in the index, no horizon. The conjunction of: (1) the discriminant factorisation 9d^2+12(m+1)d-12(m+1)^2 = 3*(3d-2(m+1))*(d+2(m+1)) for all integers m,d; (2) the two-sided region characterisation: for m,d >= 0, the discriminant is <= 0 iff 3d <= 2m+2; (3) step (S): for m,d >= 0 with 3d <= 2m+2 and every integer n, (n+1)*((2m-d)+1-n) >= 4*(m+n-(2m-d))*(m-n); (4) PStatement m K n := Nat.descFactorial n (2n-K-1) >= 2^(2n-K-1) * Nat.descFactorial (m+n-K-1) (2n-K-1) holds at every hard index n (K+1 < 2n, n <= m) for all naturals m,K with K <= 2m and 3*(2m-K) <= 2m+2, i.e. both parities of K. SCOPE (mandatory fences): this is the SCALAR core; it does not raise E993-R25-MATCHING-ALL-INDEX-DUAL-POSITIVITY (whose object is the coefficientwise-in-t nonnegativity of N_j); it is not the large-rank theorem and not the Tier 3a schema; no statement about any graph, forest, G1 tuple, tier, FOREST, TREE, TRANSFER or Erdos #993; no SimpleGraph, Delta_k, indepCount occurs; no sharpness claim; no claim that a certificate exists for any particular graph; m and d are numerals (arbitrary naturals/integers as quantified, not fixed constants). Attribution (travels on the award's face): the definitions, the discriminant lemmas, step (S) and both base cases are seat U1's; the induction step (CRITIC-ATTRIBUTED, C-U1-F's toolkit-free proof, PRIMARY) and the induction principle (CRITIC-ATTRIBUTED, C-U1-T's Nat.le_induction scaffold, re-derived here to call C-U1-F's step) are critic-attributed, independently."
  },
