  "theorem": {
    "title": "E993-R28-PENDANT-PATH-LEAF-DOMINANCE — pendant-path leaf dominance, graph-general (r28 C1-LA4)",
    "informal_statement": "Let G be any finite simple graph (no tree hypothesis) and u_0 - u_1 - ... - u_{m+1} a path of distinct vertices (u : Fin (m+2) -> X injective, consecutive vertices adjacent) whose interior vertices u_1, ..., u_m have degree 2 and whose end l = u_{m+1} is a leaf (degree 1); the degree of u_0 is arbitrary. Then for every k in N and every position i in {0, ..., m+1}, c_{u_i}(k) <= c_l(k), where c_v(k) = occ G v k is the number of independent k-sets of G containing v. Index note: SR-PP writes the path u_0..u_M = l with M >= 1; M = m + 1 (SR-PP's M = 1 is Lean m = 0, the leaf/support case, registered E993-PAIR-R-LE-G-POINTWISE clause (i), cited as corroboration only). Binder choices recorded on the face: relative to the T adjudicator's forall-form, the typeclass binders follow Lean order ({X} [Fintype X] [DecidableEq X] (G) [DecidableRel G.Adj]), the hypotheses are named (hinj, hadj, hdeg2, hleaf), and the final universally quantified binders are ordered (k : N) (i : Fin (m+2)) as in the brief's declaration (the T form reads forall (i) (k)); these are logically equivalent. Fences: not (PW) (no comparison of a branch vertex with an arbitrary leaf); stepwise monotonicity along the path is REFUTED (S(3,1,1), k = 3) and is not claimed; not (HS) (FALSE, T22); no status transfer; (DL) is an input, neither re-proved nor edited. Attribution: C-T1-U (two-step shift), C-T1-F and C-T2-U (induced-subgraph isomorphism; polynomial identity at u_0), C-T2-F, C-F2-T, C-F2-U (exact difference formulas) — six independent derivations, one proof (SR-PP); T1 and F2 for the leaf/support case; Lean text re-derived in-run by c1-la4-formalizer-opus-20260925."
  },
