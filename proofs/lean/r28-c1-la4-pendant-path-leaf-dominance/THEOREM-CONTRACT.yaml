      "SR-PP PP-1 (confirmed second read): the statement is proved informally (grade proved_informal) in six presentations, all checked line by line; 0 failures over 2,288 free trees to order 13, 33,867 labelled graphs to order 6 and 3,000 random hosts with pendant paths.",
