  "theorem": {
    "title": "Top-rank non-residual favorable-leaf aggregate on trees (TRN)",
    "informal_statement": "For every finite ordinary tree T with alpha = alpha(T), x = x(T) and integer rank p = alpha - 1: if x + 2 <= p, then S(T, p) = sum over original leaves v with Delta_p(T - v) < 0 of [Delta_(p-1)(T - {v, s_v}) - Delta_(p-1)(T - N_T[s_v])] <= 0. Key E993-R29-TOP-RANK-NONRESIDUAL-AGGREGATE (TRN), award C1-LA4 of r29 (canonical run id erdos-993-math-dre-20260925-r29-high-tail-certification)."
  },
