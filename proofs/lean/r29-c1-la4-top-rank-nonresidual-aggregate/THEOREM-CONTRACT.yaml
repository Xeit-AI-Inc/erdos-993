      "description": "S(G, p): integer sum over every favourable original leaf v (one summand per leaf, shared supports counted separately) of Delta_(p-1)(G - H_v) - Delta_(p-1)(G - R_v); p - 1 is Nat subtraction. Carried byte-identically as registrar entry 13 (first-interior entry 13; fragment 0013-definition-C5LA1-aggregate.lean.fragment, SHA-256 d66e776c5cf49b2a78a2d9713e4a41de2cbaf5de0af7b6d580075064d1daea8b). Exact Lean text of the fragment: namespace C5LA1\n\nopen SimpleGraph C4LA1\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\nopen Classical in\n/-- `S(G,p) = sum_{v in F} (b_v - B_v)`, the literal top-rank residual\naggregate, summed over the favorable filter of the leaf set. -/\nnoncomputable\ndef aggregate (G : SimpleGraph V) [DecidableRel G.Adj] (p : Nat) : Int :=\n  ∑ v ∈ (leafSet G).filter fun v => C4LA1.IsFavorableAt G v p,\n    (forwardDifferenceDel G (H G v) (p - 1) - forwardDifferenceDel G (R G v) (p - 1))\n\nend C5LA1\n",
