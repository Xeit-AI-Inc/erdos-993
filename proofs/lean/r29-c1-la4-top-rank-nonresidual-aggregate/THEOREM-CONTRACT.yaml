      "statement": "hT : G.IsTree. G is a finite ordinary tree (connected and acyclic). Consumption: ONLY through acyclicity, as hT.isAcyclic.isBipartite (Mathlib IsAcyclic.isBipartite, Acyclic.lean:617), which feeds G.IsBipartite to the carried entry 44. Connectivity is not consumed; no Nonempty V, edge count or IsTree.card_edgeFinset is used. The bipartite 2-colouring is used only inside the carried entry 41 (Core.card_extension_le / Core.indep_union_color).",
