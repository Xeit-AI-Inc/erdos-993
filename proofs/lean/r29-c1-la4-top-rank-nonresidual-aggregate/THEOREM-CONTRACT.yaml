      "id": "hyp-eligible",
      "statement": "hEligible : C5LA1.crossingIndex G + 2 ≤ G.indepNum - 1, in Nat with truncated subtraction: x(G) + 2 <= alpha(G) - 1. Nat/Int equivalence for EVERY alpha: for alpha >= 1, alpha - 1 (Nat) equals the integer alpha - 1, so the premise is literally the integer premise x + 2 <= p with p = alpha - 1; for alpha = 0 the Nat right side is 0 and the integer right side is -1, and for alpha = 1 both are 0, so both premises are false when alpha <= 1. Nothing is added or strengthened. Consumption: only in lemma E993HighTail.topRankEligibleAlphaGeFour (S7), which derives 4 <= alpha (alpha >= 3 by arithmetic; alpha = 3 would force x = 0, contradicting Delta_0(G) = n - 1 >= 2). Consequently the rank G.indepNum - 1 equals the integer alpha - 1 >= 3 and the aggregate's inner p - 1 equals the integer alpha - 2; entry 44's side conditions 2 <= p and 2 * alpha + 1 <= 3 * p are discharged by omega.",
      "dependencies": [
        "def-alpha",
        "def-crossing"
      ]
    }
  ],
