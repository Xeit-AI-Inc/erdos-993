    "informal_statement": "Canonical run id erdos-993-math-dre-20260927-r31-cb-uniform-switch; award C2-LA1 (r31 Cycle 2; (ELIG-top)(a) on the literal tree and conjuncts 1-3 of the terminal; the U adjudicator's group U-A plus the synthesis's added descent conjunct); governed run lean-2026-09-28-c2-la1-cb8-parent-descent-and-eligibility-on-the-tree; key on closure: none new — the synthesis ## Registrations names the scope update this award enables (the ELIG key to formally_verified at its exact scope; the controller applies it after the award closes and the matching isolated second read SR-C2-4 passes). OBJECT: for every natural m with 107 <= m and m % 3 = 2, at the one rank p* = (16m+4)/3: (1) cbGraph m is a tree; (2) the literal parent descent C5LA1.indepSetCount (cbGraph m) ∅ (p*−1) < C5LA1.indepSetCount (cbGraph m) ∅ (p*−2); (3) conjunct 2, C5LA1.crossingIndex (cbGraph m) + 2 <= p*; (4) conjunct 3, the low window 3p* < 2·indepNum + 1. FACE COMPANIONS (ungraded; no grade is asserted for any companion): CriticU1T.cb8_elig_top_a ((cb8I m).coeff (p*−1) < (cb8I m).coeff (p*−2)); the ℕ closed form critU3T_cb_indepPoly_closedForm (I(cbGraph m) = (1+2X)·G^m + X·((1+X)(1+2X)^(8m)) over ℕ) with critU3T_cb_indepSetCount_eq_coeff (count = coefficient); AdjU.cb8_topRank_of_flow (the SOLUTION-CONTRACT §2 terminal from conjunct 4 alone, via carried C1-LA2 entry 78). FENCES: one rank p*; the class only; (H) not claimed; conjunct 4 not claimed; no FLOW => SIGN; no aggregate or (HALL) status; not a new E993-R31- identity (it formalizes the registered ELIG key and the r30 closed-form node). EXCLUDED CONCLUSIONS: (H); conjunct 4; favorability; (HALL) at any scope; S(T_m, p*) <= 0; any rank other than p*; m < 107; m ≢ 2 (mod 3); d ≠ 8. REPAIRS CARRIED: U1's \"(E)\" wording narrowed; U3's import edit (P4) replaced by a clean import (single source, import Mathlib only); the extra descent conjunct added. CARRIES: C1-LA3 entries 1-21 (Main.lean c0605e12…3011) and C1-LA2 entries 1-78 (Mai