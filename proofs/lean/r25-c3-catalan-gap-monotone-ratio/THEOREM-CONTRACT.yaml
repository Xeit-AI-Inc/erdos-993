  "theorem": {
    "title": "Catalan-dominance gap: monotone ratio, base propagation, and the tau>=8 ceiling",
    "informal_statement": "For the Catalan-dominance gap Gamma(tau,k) = catalan(k+1) - sum_{j=1}^{tau} C(tau,j)*(catalan(k-j) if j<=k else 0) (catalan Mathlib's Catalan-number function, the guard an integer zero-extension convention of record): (1) for every tau>=1 and k>=tau, Gamma(tau,k)*catalan(k+2) < Gamma(tau,k+1)*catalan(k+1) (the ratio Gamma(tau,k)/catalan(k+1) strictly increases in k, stated denominator-free); (2) hence from any base 0<Gamma(tau,K) with tau<=K, 0<Gamma(tau,k) for every k>=K; (3) with the seven explicit bases K(1..7) = 0,2,3,4,6,12,70, i.e. Gamma(tau,k)>0 for every k>=K(tau) at tau=1..7; and (4) Gamma(tau,k)<0 for every tau>=8 and k>=tau. A theorem about Catalan integers, uniform in tau with explicit thresholds. Not a graph theorem; not fixed-band; not uniform in d (d does not occur)."
  },
  "formulation_status": {
