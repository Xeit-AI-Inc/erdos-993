    "statement": "C5LA1.aggregate G p ≤ 0 (Int): the aggregate S(G, p) = sum over v in F_p(G) of (Delta_(p-1)(G - H_v) - Delta_(p-1)(G - R_v)) is nonpositive. Exactly the implication (HALL-COND at F_p(G)) => S(G, p) <= 0 on every finite simple graph with p >= 1. EXCLUDED conclusions: (HALL) itself; any tree or eligible-row instance of (HALL-COND); the primary aggregate key E993-LOWER-REGION-ORDINARY-FAVORABLE-LEAF-AGGREGATE (it moves only if a future (HALL) award composes with this implication); any sign of S beyond this implication; any census value; no governed-model (rooted-tree) wording; no TREE/FOREST/TRANSFER programme key; not the parent problem.",
    "dependencies": [
      "hyp-p",
      "hyp-hall",
