  "hypotheses": [
    {
      "id": "hyp-p",
      "statement": "hp : 1 ≤ p (Nat). Kept exactly as frozen. It makes the Nat subtraction p - 1 inside C5LA1.aggregate the integer p - 1 (for p >= 1 the Nat and Int values agree). In the proof of record it enters through activeWeightAggregateIdentity / layerWeight_sub_eq_sum (the j = p step needs j >= 1 and (p - 1) + 1 = p) and is passed to aggregate_nonpos_of_saturatingFlow. For this F = F_p(G) form it is mathematically dispensable (F_0(G) is empty so S(G, 0) = 0; C-U2-F's activeWeightAggregateIdentity_unguarded, not carried); it is load-bearing for the general-F companion layerWeight_sub_eq_sum (K_{1,3}, p = 0: 0 against 6).",
      "dependencies": [
        "dom-p"
      ]
    },
    {
      "id": "hyp-hall",
      "statement": "h : WeightedHall G (favorableLeaves G p) p. (HALL-COND) for EVERY subfamily X ⊆ I_(p+1) at the fixed selector F = F_p(G), active-tag weights, relation (D) ∪ (S). The conclusion depends on it only at X = I_(p+1) (whole-layer instance: supply <= sum over N(I_(p+1)) <= capacity); the proof of record composes HALL=>FLOW (Hall's marriage theorem on the clone expansion, which consumes every X) with FLOW=>SIGN. The converse (S(G, p) <= 0 implies WeightedHall) is false as a statement and is not asserted: (HALL-COND) is strictly stronger as a statement than S <= 0 (synthesis R5); no separating instance is known. This hypothesis is never discharged here: no tree or eligible-row instance of it is claimed.",
      "dependencies": [
        "dom-g",
        "dom-p",
        "def-weighted-hall",
        "def-favorable-leaves"
      ]
    }
  ],
