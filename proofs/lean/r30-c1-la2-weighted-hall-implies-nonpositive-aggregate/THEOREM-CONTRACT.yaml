  "theorem": {
    "title": "C1-LA2 (r30, run erdos-993-math-dre-20260926-r30-weighted-transport): weighted Hall at the fixed selector implies a nonpositive aggregate, E993-R30-TRANSPORT-WEIGHTED-HALL-IMPLIES-NONPOSITIVE-AGGREGATE (STATED)",
    "informal_statement": "For every finite vertex type V, every simple graph G on V and every natural p >= 1: if the weighted Hall condition (HALL-COND) holds for the transport network at rank p with the fixed original selector F = F_p(G) (active-tag weights w_F on the independent (p+1)-sets and p-sets; relation (D) ∪ (S) literally), i.e. for every X ⊆ I_(p+1)(G) the w_F-weight of X is at most the w_F-weight of the targets joined to X, then C5LA1.aggregate G p = S(G, p) <= 0. Graph-generic (no IsTree, no eligibility). The hypothesis is (HALL-COND) for EVERY X; the conclusion depends on it only at X = I_(p+1); the converse is false as a statement and is not asserted (synthesis R5). A composition of FLOW=>SIGN (P2) and HALL=>FLOW (P3), first compiled as one declaration by critic C-U2-T, hence STATED: it registers formally_verified only after an isolated second read AND this award's close. Attribution: active-tag weight, mechanism and corrections: Codex (GPT-6 Astra/Sol/Luna), lower-region run; definitions of record entries 1-18 and 42: the first-interior run (Codex) on the r24/r25/r26 definition layers (C4LA1, C5LA1); informal proof: r30 F2 (Claude Sonnet 5); Lean proofs: r30 U2 (Claude Sonnet 5); companions and fidelity findings: C-U2-T, C-U2-F, C-F2-T, C-F2-U (Claude Opus 5.5), with C-U2-T and C-U2-F for the converse, the iff and the layer closure; reconciliation: the T/F/U adjudicators and the synthesis (Claude Opus 5.5). Phrasing: the compiled binder text (explicit G and p; explicit G of layerWeight_sub_eq_sum) is an equivalent Lean phrasing of the SOLUTION-CONTRACT §2 draft per Gate ruling 9 (control/C1-STAGE1-GATE.md), the equivalence compiled (C-U2-T CriticContract.lean re-run against this run's declarations)."
  },
