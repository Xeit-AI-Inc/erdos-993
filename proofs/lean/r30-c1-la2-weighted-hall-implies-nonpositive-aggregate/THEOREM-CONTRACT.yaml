      "id": "def-transport-rel",
      "description": "The relation (REL) from (p+1)-sets B to p-sets A, literally (D) ∪ (S): (D) A = B minus {q} for some q in B; (S) some u NOT in B has EXACTLY two neighbours in B and A = (B minus N(u)) ∪ {u}. Neither wider nor narrower. NEW in r30 (namespace E993Transport), the frozen text of the C1-LA2 brief §2 (identical to U2's compiled text and to the definitions C1-LA1 freezes; `noncomputable` on its own line as U2 compiled it; `open scoped Classical` in the enclosing block). Registrar entry 19, fragment SHA-256 aebc72a4015fecf4c7364686ea8e2ece96e3f378c5f2a4c94012f4d30edf8c3a. Lean text (whole fragment): namespace E993Transport\n\nopen SimpleGraph\nopen scoped Classical\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\ndef transportRel (G : SimpleGraph V) [DecidableRel G.Adj] (B A : Finset V) : Prop :=\n  (∃ q ∈ B, A = B.erase q) ∨\n  (∃ u, u ∉ B ∧ (G.neighborFinset u ∩ B).card = 2 ∧ A = insert u (B \\ G.neighborFinset u))\n\nend E993Transport\n",
      "lean_name": "E993Transport.transportRel",
      "dependencies": [
        "def-m-neighbor-finset"
      ]
    },
    {
      "id": "def-is-saturating-flow",
      "description": "COMPANION-LEVEL (not in the terminal statement): an integral flow f : Finset V → Finset V → ℕ, positive only on transportRel arcs from I_(p+1) to I_p, with every source row summing to w_F(B) and every target column at most w_F(A). NEW in r30 (namespace E993Transport), the frozen text of the C1-LA2 brief §2 (identical to U2's compiled text and to the definitions C1-LA1 freezes; `noncomputable` on its own line as U2 compiled it; `open scoped Classical` in the enclosing block). Registrar entry 20, fragment SHA-256 4646aaa58137cbeae90624ac3d1fa736b7f3cd1e6fc53bb9c1d3a37041f516a6. Lean text (whole fragment): namespace E993Transport\n\nopen SimpleGraph\nopen scoped Classical\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\ndef IsSaturatingFlow (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ)\n    (f : Finset V → Finset V → ℕ) : Prop :=\n  (∀ B A, 0 < f B A → B ∈ indepFamily G (p + 1) ∧ A ∈ indepFamily G p ∧ transportRel G B A) ∧\n  (∀ B ∈ indepFamily G (p + 1), ∑ A ∈ indepFamily G p, f B A = activeWeight G F B) ∧\n  (∀ A ∈ indepFamily G p, ∑ B ∈ indepFamily G (p + 1), f B A ≤ activeWeight G F A)\n\nend E993Transport\n",
      "lean_name": "E993Transport.IsSaturatingFlow",
      "dependencies": [
        "def-indep-family",
        "def-transport-rel",
        "def-active-weight"
      ]
    },
    {
      "id": "def-weighted-hall",
      "description": "(HALL-COND) for EVERY subfamily X ⊆ I_(p+1): the sum of w_F over X is at most the sum of w_F over the targets A in I_p joined to some member of X by transportRel. All quantities in Nat, no subtraction. NEW in r30 (namespace E993Transport), the frozen text of the C1-LA2 brief §2 (identical to U2's compiled text and to the definitions C1-LA1 freezes; `noncomputable` on its own line as U2 compiled it; `open scoped Classical` in the enclosing block). Registrar entry 21, fragment SHA-256 542c0fc39601c6798f8ea39c8632963c798dcf13d5bfa28a1d24215299d5fc5f. Lean text (whole fragment): namespace E993Transport\n\nopen SimpleGraph\nopen scoped Classical\n\nvariable {V : Type*} [Fintype V] [DecidableEq V]\n\ndef WeightedHall (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ) : Prop :=\n  ∀ X ⊆ indepFamily G (p + 1),\n    ∑ B ∈ X, activeWeight G F B ≤\n      ∑ A ∈ (indepFamily G p).filter (fun A => ∃ B ∈ X, transportRel G B A), activeWeight G F A\n\nend E993Transport\n",
      "lean_name": "E993Transport.WeightedHall",
      "dependencies": [
        "def-indep-family",
