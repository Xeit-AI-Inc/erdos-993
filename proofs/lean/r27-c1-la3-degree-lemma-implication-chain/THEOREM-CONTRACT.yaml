        "domain-graph"
      ]
    },
    {
      "id": "hyp-degree-lemma",
      "statement": "THE hypothesis of the award: `DlHyp`, i.e. the degree lemma (DL) stated exactly as `SOLUTION-CONTRACT.md` §2 `forest_degree_lemma`, universally in the carrier, the instances, the forest and the rank. It is ASSUMED, never proved here; it is the object of award `C1-LA1`.",
      "dependencies": [
        "def-dlhyp",
        "hyp-acyclic",
        "hyp-finiteness",
