{
  "schema_version": "theorem-contract/v1",
  "contract_id": "erdos-993-r27-c1-la3-degree-lemma-implies-extension-chain-v1",
  "theorem": {
    "title": "C1-LA3 - the degree lemma implies the extension inequality, the linear descent-order bound, the rank-5 ceiling 20 and the descent restriction",
    "informal_statement": "Assume (DL): for every finite forest G on a finite vertex type X (quantified over the Fintype/DecidableEq/DecidableRel instances) and every natural k, the incident degree sum D_k(G) is at most 2k i_k(G). Then (EX) n i_k <= (k+1) i_{k+1} + 3k i_k for every finite forest and every k; (LB) Delta_k(G) < 0 implies n <= 4k for every finite forest and every k; (R5) 21 <= n implies 0 <= Delta_5(G) for every finite forest; and (XR) x(G) < r implies n <= 4r - 4 for every finite forest and every r. Each of the five statements is the corresponding frozen SOLUTION-CONTRACT.md section 2 declaration, taken definitionally. The award is the IMPLICATION: none of (DL), (EX), (LB), (R5), (XR) is asserted."
  },
  "formulation_status": {
    "status": "open",
    "evidence": []
  },
  "definitions": [
    {
      "id": "def-indepcount",
      "description": "`i_k(G)`, the number of independent `k`-subsets, as an integer. Carried BYTE-IDENTICALLY from the r25 award source (registrar entry 1, entry SHA-256 5484fc21ffce7bf707240da15858d7d82289f8e6f286a8fa9837cd9a0c474ccb). Lean text: `noncomputable def indepCount {V : Type u} (F : SimpleGraph V) (k : ℕ) : ℤ := (Nat.card {S : Finset V // F.IsNIndepSet k S} : ℤ)`.",
      "lean_name": "Erdos993G1.indepCount",
      "dependencies": []
    },
    {
      "id": "def-coeff",
      "description": "The integer-indexed zero extension of `i_k`. Carried BYTE-IDENTICALLY (r25 entry 2, 211900436b28e4a685af60df26a20e8fe254fd4c9479c12ba2863fa180c1a639). Lean text: `noncomputable def coeff {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ := if 0 ≤ k then Erdos993G1.indepCount F k.toNat else 0`.",
      "lean_name": "Erdos993G1.coeff",
      "dependencies": [
        "def-indepcount"
      ]
    },
    {
      "id": "def-delta",
      "description": "`Δ_k(G) = coeff (k+1) − coeff k`. Carried BYTE-IDENTICALLY (r25 entry 3, bdb46014d98507a7c85cc8de0b806f80c04496479795e28677dde024e216b9ee). Lean text: `noncomputable def delta {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ := Erdos993G1.coeff F (k + 1) - Erdos993G1.coeff F k`.",
      "lean_name": "Erdos993G1.delta",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-closednbhdfinset",
      "description": "`N[J]`, the closed neighbourhood of a finite vertex set. Carried byte-identically from carry row 9 (`U3-Extension.lean`, 116b4f313eedfe4210173226c2f5ef877a6e1ee07061888f4106e908ba6b08a6). Lean text: `def closedNbhdFinset (J : Finset X) : Finset X := J ∪ J.biUnion (fun u => G.neighborFinset u)`.",
      "lean_name": "Erdos993G1.closedNbhdFinset",
      "dependencies": []
    },
    {
      "id": "def-extensionfinset",
      "description": "The extension set of `J`. Carried byte-identically from carry row 9. Lean text: `def extensionFinset (J : Finset X) : Finset X := Finset.univ \\ closedNbhdFinset G J`.",
      "lean_name": "Erdos993G1.extensionFinset",
      "dependencies": [
        "def-closednbhdfinset"
      ]
    },
    {
      "id": "def-extension-count",
      "description": "`e(J)`, the number of extensions of `J` (U1's file calls the same quantity `extensionCount`; carry row 19 records that the run-local definitions agree). Carried byte-identically from carry row 9. Lean text: `def e (J : Finset X) : ℕ := (extensionFinset G J).card`.",
      "lean_name": "Erdos993G1.e",
      "dependencies": [
        "def-extensionfinset"
      ]
    },
    {
      "id": "def-indepdegreesum",
      "description": "`D_k(G)`, the incident degree sum. Carried byte-identically from carry row 9. Lean text: `def indepDegreeSum (k : ℕ) : ℕ := ∑ J ∈ G.indepSetFinset k, ∑ v ∈ J, G.degree v`.",
      "lean_name": "Erdos993G1.indepDegreeSum",
      "dependencies": []
    },
    {
      "id": "def-firstdescent",
      "description": "`x(G)`, the first strict descent, as `Nat.find` of the existence of a negative `Δ_k`. The `def` is carried byte-identically from carry row 9; the existence lemma it consumes is re-derived in-run (registrar ordering; see INFORMAL-PROOF.md §5.2), which by definitional proof irrelevance yields the SAME function — carry row 19 (U adjudicator) proves U1's and U3's definitions equal by `rfl`. Lean text: `noncomputable def firstDescent {X : Type u} [Finite X] (G : SimpleGraph X) : ℕ := by classical exact Nat.find (Erdos993G1.exists_delta_neg G)`.",
      "lean_name": "Erdos993G1.firstDescent",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-dlhyp",
      "description": "(DL) as a `Prop`, definitionally the frozen `SOLUTION-CONTRACT.md` §2 `forest_degree_lemma`. Lean text: `def DlHyp : Prop := ∀ {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj], G.IsAcyclic → ∀ k : ℕ, (indepDegreeSum G k : ℤ) ≤ 2 * k * Erdos993G1.indepCount G k`.",
      "lean_name": "Erdos993G1.DlHyp",
      "dependencies": [
        "def-indepdegreesum",
        "def-indepcount"
      ]
    },
    {
      "id": "def-exhyp",
      "description": "(EX) as a `Prop`, definitionally §2 `forest_extension_inequality`. Lean text: `def ExHyp : Prop := ∀ {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj], G.IsAcyclic → ∀ k : ℕ, (Fintype.card X : ℤ) * Erdos993G1.indepCount G k ≤ (k + 1) * Erdos993G1.indepCount G (k + 1) + 3 * k * Erdos993G1.indepCount G k`.",
      "lean_name": "Erdos993G1.ExHyp",
      "dependencies": [
        "def-indepcount"
      ]
    },
    {
      "id": "def-lbhyp",
      "description": "(LB) as a `Prop`, definitionally §2 `forest_descent_linear_bound`. Lean text: `def LbHyp : Prop := ∀ {X : Type u} [Finite X] (G : SimpleGraph X), G.IsAcyclic → ∀ k : ℕ, Erdos993G1.delta G (k : ℤ) < 0 → Nat.card X ≤ 4 * k`.",
      "lean_name": "Erdos993G1.LbHyp",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-r5hyp",
      "description": "(R5) as a `Prop`, definitionally §2 `forest_rank5_ceiling_20`. Lean text: `def R5Hyp : Prop := ∀ {X : Type u} [Finite X] (G : SimpleGraph X), G.IsAcyclic → 21 ≤ Nat.card X → 0 ≤ Erdos993G1.delta G 5`.",
      "lean_name": "Erdos993G1.R5Hyp",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-xrhyp",
      "description": "(XR) as a `Prop`, definitionally §2 `forest_descent_restriction`. Lean text: `def XrHyp : Prop := ∀ {X : Type u} [Finite X] (G : SimpleGraph X), G.IsAcyclic → ∀ r : ℕ, firstDescent G < r → Nat.card X ≤ 4 * r - 4`. The `4 * r - 4` is truncated ℕ subtraction; `firstDescent G < r` forces `1 ≤ r`, and the `r = 0` case is vacuous-hypothesis-sound, not an arithmetic claim.",
      "lean_name": "Erdos993G1.XrHyp",
      "dependencies": [
        "def-firstdescent"
      ]
    }
  ],
