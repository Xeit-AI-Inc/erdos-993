      ]
    }
  ],
  "conclusion": {
    "id": "conclusion",
    "statement": "`DlHyp → ExHyp ∧ LbHyp ∧ R5Hyp ∧ XrHyp`, at one shared universe parameter: the degree lemma implies the extension inequality, the linear descent-order bound, the rank-5 ceiling 20 and the descent restriction `4r − 4`, each stated exactly as its own frozen §2 declaration. THE IMPLICATION IS THE CLAIM; none of the four consequents is asserted, and all four stay `conditional` until an unconditional (DL) lands (`C1-LA1`). ATTRIBUTION, on every face (`SOLUTION-CONTRACT.md` §3.7): Fang–Lu–Nevo–Yao–Zheng 2026, §8 (Lemma 8.1 with (8.3), and Proposition 8.2's displayed step) for the mathematics of (DL) and (EX); the literature map (FRESH-LEAD, lane 11) for the conditional deductions (LB), (R5) and (XR); r27 seat U3 and critics `C-U1-T`, `C-U3-T`, `C-U3-F` and `C-U1-F` for the derivations carried and used here — carry-list rows 10–16 are critic-attributed and rows 17–19 adjudicator-attributed, never seat work; the U adjudicator for the `firstDescent` reconciliation by `rfl` (carry row 19). No external Lean text is carried or published (Gate ruling 3). FENCES, on every face: (1) NO NO-RECOVERY READING — (LB), (R5) and (XR) are ORDER BOUNDS whose contrapositives have sign `Δ_k ≥ 0`, and no status transfers to `E993-R25-UNR-FOREST-WIDE`, `E993-G1WIDE-NO-SIZE-CAP`, NR1, FOREST, TREE, TRANSFER, `E993-BETA-AGG` or Erdős #993; (2) (XR) IS NOT A UNIFORM BOUND ON `d`, and its `r = 0` truncation of `4 * r - 4` is vacuous-hypothesis-sound, not correct arithmetic; (3) the implication is the award and the targets are not; (4) (DL) is an average over `I_k`, so no pointwise degree statement is registrable; (5) nothing asymptotic is asserted; (6) the r25 award `E993-R25-FOREST-DESCENT-ORDER-BOUND-SHARP` stays registered at its own statement, and `4k ≤ (k+1)²` is a comparison, not a supersession.",
    "dependencies": [
      "hyp-degree-lemma",
      "def-exhyp",
      "def-lbhyp",
      "def-r5hyp",
      "def-xrhyp"
    ]
  },
