    {
      "id": "hyp-acyclic",
      "statement": "`G.IsAcyclic`. It enters the proof EXACTLY ONCE, as the argument handed to the (DL) hypothesis; every counting step used here (double count, `e(J)` bound) is graph-general and carries no acyclicity binder.",
