  "hypotheses": [
    {
      "id": "hyp-finiteness",
      "statement": "Finiteness of the carrier. It is present in every statement of the chain and is the only structural assumption the unconditional counting steps use.",
      "dependencies": [
        "domain-carrier"
      ]
    },
    {
      "id": "hyp-instances",
      "statement": "`[Fintype X]`, `[DecidableEq X]` and `[DecidableRel G.Adj]` are quantified INSTANCE binders inside `DlHyp`/`ExHyp`, not fixed instances (critic `C-U3-F`'s caveat): a (DL) proved at one fixed `Fintype` instance would not compose with this chain.",
