    "id": "conclusion",
    "statement": "theorem bdStepSign_interiorPeak_award :\n    (∀ m g : ℕ, g < m → 1 ≤ m →\n        (m : ℤ) * (2 * (m : ℤ) - (g : ℤ))\n            * (D (2 * (m : ℤ) - ((g : ℤ) + 1)) (m : ℤ) - D (2 * (m : ℤ) - (g : ℤ)) (m : ℤ))\n          = Cz (2 * (m : ℤ) - (g : ℤ)) ((m : ℤ) - 1)\n              * (2 * (m : ℤ) - (g : ℤ) ^ 2 + (g : ℤ))) ∧\n    (∀ m g : ℕ, 7 ≤ m → g ≤ m →\n        2 * (m : ℤ) ≤ (g : ℤ) ^ 2 - (g : ℤ) →\n        ((g : ℤ) - 1) ^ 2 - ((g : ℤ) - 1) < 2 * (m : ℤ) →\n        D (2 * (m : ℤ) - (g : ℤ)) (m : ℤ) ≤ (catalan (m - 1) : ℤ))",
    "dependencies": [
      "domain-nat",
      "def-d-step-sign",
      "def-interior-peak-le-cat"
