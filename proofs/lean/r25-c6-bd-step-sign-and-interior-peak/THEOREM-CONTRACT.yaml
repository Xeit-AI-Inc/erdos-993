  "theorem": {
    "title": "Bd step-sign law and interior peak bound (award group C6-LA4, U-AWARD-BD-STEP-SIGN-AND-INTERIOR-PEAK)",
    "informal_statement": "The explicit conjunction of two theorems over Z-valued functions of naturals m,g, with D(b,m) = C(b,m+1) - 2C(b,m) + C(b,m-1) the zero-extended integer binomial ranged object (SEMANTIC-CONTRACT.md zero-extension convention): (1) D_step_sign, the UNCONDITIONAL D-level step-sign law: for naturals g<m, 1<=m, m*(2m-g)*(D(2m-g-1,m)-D(2m-g,m)) = C(2m-g,m-1)*(2m-g^2+g); this together with peak_bracket_integral is the registered VERIFIED E993-R25-D-ROW-STEP-SIGN-LAW verbatim (both conjuncts) -- a GRADE CHANGE proved_informal -> formally_verified with its Cycle 5 critic attribution (C-U2-T, C-U2-F) preserved; (2) interior_peak_le_cat, the interior peak bound: for naturals 7<=m, g<=m with g^2-g>=2m and (g-1)^2-(g-1)<2m (g supplied as a WITNESS of these two inequalities, never asserted to exist -- precisely the distinction that makes D_unimodal_peak false and this true), D(2m-g,m) <= catalan(m-1); this is NEW content with no registered predecessor and takes the new key E993-R25-BD-INTERIOR-PEAK-CATALAN-BOUND. SCOPE (mandatory fences, per Cycle 6 synthesis Dispatch 4): fixed-band d=5 ARITHMETIC; no graph object occurs anywhere in the corpus; D, N, L, R are the seat's integer functions over Z with zero extension; 'unimodality' here is of the integer function g |-> D(2m-g,m) and is DERIVED from a sign identity, importing no shape premise on any i_k; this raises NOTHING else -- not E993-R25-BD-TAIL-NEGATIVE (the top-level Bd(r,r) < 0, NOT carried), not E993-R25-FOURTH-BAND-CLOSE-ALL-R, and no MaR/BdRR/[6,14]-layer object is carried into this award. Attribution: seat U2 for nodes 1, 2a, 4, 5, 6, 7; critic C-U2-F for node 2b and the interior peak bound; node 2b independently compiled by critic C-U2-T (joint attribution on that node)."
  },
