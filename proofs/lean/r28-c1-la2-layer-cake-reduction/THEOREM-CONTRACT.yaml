{
  "schema_version": "theorem-contract/v1",
  "contract_id": "e993-r28-c1-la2-dominance-implies-degree-lemma-v1",
  "theorem": {
    "title": "E993-R28-DOMINANCE-IMPLIES-DEGREE-LEMMA (LC): threshold leaf/slot dominance at every t implies the degree inequality D_k ≤ 2k·i_k (instance-wise, on a finite tree)",
    "informal_statement": "Let X be a finite type with decidable equality, G a simple graph on X with decidable adjacency that is a tree (G.IsTree), and k a natural number. Write I_k for the independent k-sets, i_k = |I_k|, c_v(k) for the number of J ∈ I_k containing v, D_k = Σ_{J∈I_k} Σ_{v∈J} deg v, slots_{≥t} = Σ over v with deg v ≥ 3 and c_v(k) ≥ t of (deg v − 2), and leaves_{≥t} = #{ℓ : deg ℓ = 1, c_ℓ(k) ≥ t}. If slots_{≥t} ≤ leaves_{≥t} for every t ∈ ℕ, then D_k ≤ 2k·i_k (in ℤ). Erratum R28-E-a: the ∀ t quantifier is kept; on trees the t = 0 row follows from the t ≥ 1 rows, the proof consumes only t ≥ 1, and hT is unused. Scope declaration (separate companion lemmas, critic-attributed, not the key's statement): the same implication holds on every finite simple graph with the hypothesis only at t ≥ 1. Fences: an instance-wise implication, not a proof of (DL) and not a second proof of (DL); its hypothesis fails at (T22, 11) and (T22, 12), (HS) being REFUTED; no composition with tree_leaf_slot_dominance; the r27 reformulation companions are a scope note on E993-R27-TREE-LEAF-BRANCH-REFORMULATION-ORDER-GE-2, never a new key; no status transfer (SOLUTION-CONTRACT §3.1). Attribution: U1 (seat) for (LC); C-U1-T and C-U1-F (critics) for the graph-general form and the reformulation's Lean proofs; r27 C-T2-U (mechanism), the r27 T adjudicator (2 ≤ n), SR-JOIN, Fang–Lu–Nevo–Yao–Zheng 2026 §8 (the degree lemma), r28 SR-PP (PP-3/PP-4)."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "SYNTHESIS.md (r28 Cycle 1 Stage 6) ## Exact established results item 6: E993-R28-DOMINANCE-IMPLIES-DEGREE-LEMMA (LC) graded proved_informal, seat-derived (U1).",
      "U1's Lean proof compiled sorry-free in scratch and was rebuilt three times with byte-identical logs (C-U1-T, C-U1-F, U adjudicator); this is prior evidence, not a grade.",
      "Independent critic proofs of the graph-general t ≥ 1 form: C-U1-T dominance_implies_degree_lemma_graph_general and C-U1-F dominance_implies_degree_lemma_general.",
      "The implication is independent of (HS)'s truth; (HS) itself is REFUTED (T22, SR-HS-REF) and is not a premise of this contract."
    ]
  },
  "definitions": [
    {
      "id": "def-indepcount",
      "description": "i_k(G): the number of independent k-subsets of the vertex set, as an integer. G1 definition of record, r25 award entry 1, registered byte-identically (entry digest 5484fc21…). Lean text: `noncomputable def indepCount {V : Type u} (F : SimpleGraph V) (k : ℕ) : ℤ := (Nat.card {S : Finset V // F.IsNIndepSet k S} : ℤ)`. Bridge `i_k = ((G.indepSetFinset k).card : ℤ)` is r25 entry 4 (`Erdos993G1.indepCount_eq_card_indepSetFinset`, byte-identical, digest 4463e7ee…).",
      "lean_name": "Erdos993G1.indepCount",
      "dependencies": []
    },
    {
      "id": "def-indepdegreesum",
      "description": "D_k(G): the incident degree sum Σ_{J ∈ I_k(G)} Σ_{v ∈ J} deg_G(v), a natural number. r27 C1-LA1 award entry 7, registered byte-identically (entry digest a1ed32eb…); U1's re-typed copy is NOT carried (equal by rfl, C-U1-F Audit.lean). Lean text: `def indepDegreeSum (k : ℕ) : ℕ := ∑ J ∈ G.indepSetFinset k, ∑ v ∈ J, G.degree v` under `variable {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj]`.",
      "lean_name": "Erdos993G1.indepDegreeSum",
      "dependencies": []
    },
    {
      "id": "def-occ",
      "description": "Occupancy count c_v(k): the number of independent k-sets containing v (SOLUTION-CONTRACT §2 text; seat U1, carried byte-identically). Depends only on Mathlib's `indepSetFinset` (not on indepDegreeSum). Lean text: `def occ {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj] (v : X) (k : ℕ) : ℕ := ((G.indepSetFinset k).filter (fun J => v ∈ J)).card`.",
      "lean_name": "Erdos993G1.occ",
      "dependencies": []
    },
    {
      "id": "def-slotsatleast",
      "description": "slots_{≥t}(k): total slot weight deg v − 2 of branch vertices (deg v ≥ 3) with c_v(k) ≥ t; the ℕ subtraction is guarded by 3 ≤ deg v in the filter (SOLUTION-CONTRACT §2 text; seat U1, carried byte-identically). Lean text: `def slotsAtLeast {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj] (k t : ℕ) : ℕ := ∑ v ∈ Finset.univ.filter (fun v => 3 ≤ G.degree v ∧ t ≤ occ G v k), (G.degree v - 2)`.",
      "lean_name": "Erdos993G1.slotsAtLeast",
      "dependencies": [
        "def-occ"
      ]
    },
    {
      "id": "def-leavesatleast",
      "description": "leaves_{≥t}(k): the number of leaves (deg = 1) with c_ℓ(k) ≥ t (SOLUTION-CONTRACT §2 text; seat U1, carried byte-identically). Lean text: `def leavesAtLeast {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj] (k t : ℕ) : ℕ := (Finset.univ.filter (fun ℓ => G.degree ℓ = 1 ∧ t ≤ occ G ℓ k)).card`.",
      "lean_name": "Erdos993G1.leavesAtLeast",
      "dependencies": [
        "def-occ"
      ]
    }
  ],
