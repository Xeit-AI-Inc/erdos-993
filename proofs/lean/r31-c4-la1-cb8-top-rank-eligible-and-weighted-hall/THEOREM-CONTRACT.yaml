    "declaration_name": "E993Transport.cb8_topRank_eligible_and_weightedHall",
    "expected_declaration_kind": "theorem",
    "expected_statement": "theorem cb8_topRank_eligible_and_weightedHall (m : ℕ) (hm : 107 ≤ m) (hres : m % 3 = 2) :\n    (cbGraph m).IsTree ∧\n    C5LA1.crossingIndex (cbGraph m) + 2 ≤ (16 * m + 4) / 3 ∧\n    3 * ((16 * m + 4) / 3) < 2 * (cbGraph m).indepNum + 1 ∧\n    ∃ f, IsSaturatingFlow (cbGraph m) (favorableLeaves (cbGraph m) ((16 * m + 4) / 3)) ((16 * m + 4) / 3) f",
    "expected_statement_sha256": "c17cc9cf5bcc01c53709dd764f02fe37cc481f85794fd5f65affd6efc4174952"
