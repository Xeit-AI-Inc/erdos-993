  "conclusion": {
    "id": "conclusion",
    "statement": "For every type X that is finite, every simple graph G on X that is acyclic, and every natural r: if firstDescent G < r then Nat.card X <= 4 * r - 4, where the subtraction is natural-number truncated subtraction. This is (XR), the descent restriction, the terminal declaration Erdos993G1.forest_descent_restriction of award C1-LA4, stated UNCONDITIONALLY (there is no DlHyp binder). It is an ORDER BOUND whose contrapositive has sign Delta_k >= 0: it is NOT a no-recovery statement, it transfers status to none of E993-R25-UNR-FOREST-WIDE, E993-G1WIDE-NO-SIZE-CAP, NR1, FOREST, TREE, TRANSFER, the aggregates or Erdos #993, it asserts nothing asymptotic, it asserts no sharpness, it says nothing about non-forests, and it is NOT a uniform bound on d (read at n = 2r + d it says d <= 2r - 4, a bound growing with r). The r25 award E993-R25-FOREST-DESCENT-ORDER-BOUND-SHARP is unchanged and stays registered at its own statement.",
