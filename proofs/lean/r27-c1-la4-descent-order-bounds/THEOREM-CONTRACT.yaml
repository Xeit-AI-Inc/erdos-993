      "id": "def-indepcount",
      "description": "G1 definition of record (frozen r25 award source, registrar entry 1, carried byte-identically): i_k(G), the number of independent k-subsets of the vertex type, as an integer. Nonnegative by construction; i_0 = 1 always.\n\nLean text:\nnoncomputable\ndef indepCount {V : Type u} (F : SimpleGraph V) (k : ℕ) : ℤ :=\n  (Nat.card {S : Finset V // F.IsNIndepSet k S} : ℤ)",
      "lean_name": "Erdos993G1.indepCount",
