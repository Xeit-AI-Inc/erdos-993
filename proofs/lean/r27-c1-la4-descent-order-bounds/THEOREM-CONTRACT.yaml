  "theorem": {
    "title": "(XR) descent restriction for finite forests, with (LB) and (R5) as award faces",
    "informal_statement": "Let G be a finite forest and x(G) the least k with Delta_k(G) < 0. (LB) For every natural k, Delta_k(G) < 0 implies n <= 4k. (R5) If n >= 21 then Delta_5(G) >= 0. (XR) For every natural r, x(G) < r implies n <= 4r - 4. Here n = Nat.card X and Delta_k is the G1 definition of record. The terminal declaration of this award is (XR); (LB) and (R5) are the other two award faces, registered as lemmas in the same project. All three are unconditional: the degree lemma (DL) is supplied by the carried, kernel-verified Erdos993G1.forest_degree_lemma of award C1-LA1, so no DlHyp hypothesis appears on any face."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Fang-Lu-Nevo-Yao-Zheng, arXiv:2609.20961v1 (2026), section 8: Lemma 8.1 consequence (8.3) is (DL) and Proposition 8.2's displayed step is (EX); (LB), (R5), (XR) are their conditional consequences.",
      "r27 Cycle 1 synthesis, Lean awards, C1-LA4: the award statement of record, with Decisions 1 and 2, the carry list and the three renames.",
