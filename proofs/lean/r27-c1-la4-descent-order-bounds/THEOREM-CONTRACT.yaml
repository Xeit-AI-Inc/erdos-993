    {
      "id": "def-firstdescent",
      "description": "x(G), the FIRST STRICT DESCENT: the least natural k with Delta_k(G) < 0, by Nat.find on the existence lemma Erdos993G1.exists_delta_neg. This is the run's definition of record (SEMANTIC-CONTRACT.md section 1). Carried byte-identically from C1-LA3 entry 9, together with exists_delta_neg. By proof irrelevance Nat.find does not depend on which proof of the existential is supplied, so this is the same function as C1-LA3's and U1's.\n\nLean text:\nlemma exists_delta_neg {X : Type u} [Finite X] (G : SimpleGraph X) :\n    ∃ k : ℕ, Erdos993G1.delta G (k : ℤ) < 0 := by\n  classical\n  letI := Fintype.ofFinite X\n  have hcoeff : ∀ j : ℕ, Erdos993G1.coeff G (j : ℤ) = Erdos993G1.indepCount G j := by\n    intro j\n    simp [Erdos993G1.coeff]\n  have hdelta : ∀ j : ℕ, Erdos993G1.delta G (j : ℤ)\n      = Erdos993G1.indepCount G (j + 1) - Erdos993G1.indepCount G j := by\n    intro j\n    simpa only [Erdos993G1.delta, Nat.cast_add, Nat.cast_one] using\n      congrArg₂ (· - ·) (hcoeff (j + 1)) (hcoeff j)\n  have hzero : Erdos993G1.indepCount G (Fintype.card X + 1) = 0 := by\n    haveI hempty : IsEmpty {S : Finset X // G.IsNIndepSet (Fintype.card X + 1) S} := by\n      refine ⟨?_⟩\n      rintro ⟨S, hS⟩\n      have h1 : S.card = Fintype.card X + 1 := hS.card_eq\n      have h2 : S.card ≤ Fintype.card X := by\n        simpa [Finset.card_univ] using Finset.card_le_univ S\n      omega\n    unfold Erdos993G1.indepCount\n    simp\n  have hpos : 0 < Erdos993G1.indepCount G 0 := by\n    have hne : Nonempty {S : Finset X // G.IsNIndepSet 0 S} := by\n      refine ⟨⟨∅, ?_, ?_⟩⟩\n      · rw [SimpleGraph.isIndepSet_iff]\n        simp\n      · simp\n    unfold Erdos993G1.indepCount\n    have := Nat.card_pos (α := {S : Finset X // G.IsNIndepSet 0 S})\n    exact_mod_cast this\n  by_contra hcon\n  push Not at hcon\n  have hmono : ∀ j : ℕ, Erdos993G1.indepCount G 0 ≤ Erdos993G1.indepCount G j := by\n    intro j\n    induction j with\n    | zero => exact le_refl _\n    | succ m ih =>\n        have hstep := hcon m\n        have hd := hdelta m\n        omega\n  have hfinal := hmono (Fintype.card X + 1)\n  rw [hzero] at hfinal\n  omega\nnoncomputable def firstDescent {X : Type u} [Finite X] (G : SimpleGraph X) : ℕ := by\n  classical exact Nat.find (Erdos993G1.exists_delta_neg G)\ndef XrHyp : Prop := ∀ {X : Type u} [Finite X] (G : SimpleGraph X), G.IsAcyclic → ∀ r : ℕ,\n  firstDescent G < r → Nat.card X ≤ 4 * r - 4",
      "lean_name": "Erdos993G1.firstDescent",
      "dependencies": [
        "def-delta"
      ]
    },
    {
      "id": "def-xrhyp",
      "description": "The Prop abbreviation of (XR), SOLUTION-CONTRACT.md section 2 forest_descent_restriction. Carried byte-identically from C1-LA3 entry 9 (it shares that registrar entry with firstDescent).\n\nLean text:\nlemma exists_delta_neg {X : Type u} [Finite X] (G : SimpleGraph X) :\n    ∃ k : ℕ, Erdos993G1.delta G (k : ℤ) < 0 := by\n  classical\n  letI := Fintype.ofFinite X\n  have hcoeff : ∀ j : ℕ, Erdos993G1.coeff G (j : ℤ) = Erdos993G1.indepCount G j := by\n    intro j\n    simp [Erdos993G1.coeff]\n  have hdelta : ∀ j : ℕ, Erdos993G1.delta G (j : ℤ)\n      = Erdos993G1.indepCount G (j + 1) - Erdos993G1.indepCount G j := by\n    intro j\n    simpa only [Erdos993G1.delta, Nat.cast_add, Nat.cast_one] using\n      congrArg₂ (· - ·) (hcoeff (j + 1)) (hcoeff j)\n  have hzero : Erdos993G1.indepCount G (Fintype.card X + 1) = 0 := by\n    haveI hempty : IsEmpty {S : Finset X // G.IsNIndepSet (Fintype.card X + 1) S} := by\n      refine ⟨?_⟩\n      rintro ⟨S, hS⟩\n      have h1 : S.card = Fintype.card X + 1 := hS.card_eq\n      have h2 : S.card ≤ Fintype.card X := by\n        simpa [Finset.card_univ] using Finset.card_le_univ S\n      omega\n    unfold Erdos993G1.indepCount\n    simp\n  have hpos : 0 < Erdos993G1.indepCount G 0 := by\n    have hne : Nonempty {S : Finset X // G.IsNIndepSet 0 S} := by\n      refine ⟨⟨∅, ?_, ?_⟩⟩\n      · rw [SimpleGraph.isIndepSet_iff]\n        simp\n      · simp\n    unfold Erdos993G1.indepCount\n    have := Nat.card_pos (α := {S : Finset X // G.IsNIndepSet 0 S})\n    exact_mod_cast this\n  by_contra hcon\n  push Not at hcon\n  have hmono : ∀ j : ℕ, Erdos993G1.indepCount G 0 ≤ Erdos993G1.indepCount G j := by\n    intro j\n    induction j with\n    | zero => exact le_refl _\n    | succ m ih =>\n        have hstep := hcon m\n        have hd := hdelta m\n        omega\n  have hfinal := hmono (Fintype.card X + 1)\n  rw [hzero] at hfinal\n  omega\nnoncomputable def firstDescent {X : Type u} [Finite X] (G : SimpleGraph X) : ℕ := by\n  classical exact Nat.find (Erdos993G1.exists_delta_neg G)\ndef XrHyp : Prop := ∀ {X : Type u} [Finite X] (G : SimpleGraph X), G.IsAcyclic → ∀ r : ℕ,\n  firstDescent G < r → Nat.card X ≤ 4 * r - 4",
