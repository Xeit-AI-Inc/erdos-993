    {
      "id": "def-dlhyp",
      "description": "The Prop abbreviation of (DL), SOLUTION-CONTRACT.md section 2 forest_degree_lemma, quantified over Fintype/DecidableEq/DecidableRel INSTANCES. Carried byte-identically from C1-LA3 entry 5. Registered because R10 mandates the C1-LA3 Prop layer; it is NOT a dependency of the terminal statement (this project's (EX) is already unconditional, so the chain does not route through (DL) a second time).\n\nLean text:\ndef DlHyp : Prop := ∀ {X : Type u} [Fintype X] [DecidableEq X] (G : SimpleGraph X) [DecidableRel G.Adj],\n  G.IsAcyclic → ∀ k : ℕ, (indepDegreeSum G k : ℤ) ≤ 2 * k * Erdos993G1.indepCount G k",
