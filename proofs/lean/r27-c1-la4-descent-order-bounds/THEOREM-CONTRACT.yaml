    {
      "id": "def-delta",
      "description": "G1 definition of record (r25 entry 3, byte-identical): Delta_k(G) = coeff(k+1) - coeff(k) in the integers. Delta_k < 0 is a STRICT descent; Delta_k = 0 is not a descent.\n\nLean text:\nnoncomputable\ndef delta {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ :=\n  Erdos993G1.coeff F (k + 1) - Erdos993G1.coeff F k",
      "lean_name": "Erdos993G1.delta",
      "dependencies": [
        "def-coeff"
