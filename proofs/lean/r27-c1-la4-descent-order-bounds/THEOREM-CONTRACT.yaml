    },
    {
      "id": "def-coeff",
      "description": "G1 definition of record (r25 entry 2, byte-identical): the integer-indexed zero extension of i_k.\n\nLean text:\nnoncomputable\ndef coeff {V : Type u} (F : SimpleGraph V) (k : ℤ) : ℤ :=\n  if 0 ≤ k then Erdos993G1.indepCount F k.toNat else 0",
      "lean_name": "Erdos993G1.coeff",
