  "theorem": {
    "title": "C4-LA1: G_k deletion-arc saturating flow at every rank p >= k + 3 for every leaf tag set",
    "informal_statement": "Canonical run id erdos-993-math-dre-20260926-r30-weighted-transport; award group C4-LA1 (Cycle 4 Stage 7, bounded attempt); key on closure E993-R30-GK-TREE-DELETION-ARC-SATURATING-FLOW-AT-EVERY-RANK-AT-LEAST-K-PLUS-3-FOR-EVERY-LEAF-TAG-SET, formally_verified at the terminal theorem's EXACT scope. Statement: let G_k be the graph on Fin (3k+5) with root 0, leaf 1 on 0, support 2 on 0 with leaves 3 and 4, and for i < k the arm 0 - (5+3i) - (6+3i) - (7+3i). For all natural k and p with k + 3 <= p and every set F of leaves of G_k (F a subset of C5LA1.leafSet (gkGraph k)), the transport network at rank p with tag set F (sources the independent (p+1)-sets, targets the independent p-sets, supplies and capacities the active-tag weight activeWeight) has a saturating integral (natural-number) flow f (IsSaturatingFlow: positive only on (p+1)-set/p-set pairs related by transportRel; every source row sums EXACTLY to its active weight; every target column sums to AT MOST its active weight) whose support consists of single deletions only: f B A > 0 implies A = B.erase q for some q in B. No IsTree, no eligibility, no crossing index, no quotient hypothesis. Proof of record: Theorem CT-1 (critic C-F2-T) with the rank extension R2' (F adjudicator), steps (0)-(4), INFORMAL-PROOF.md. Companions on the face (Lean lemmas gk_weightedHall_of_rank_ge and gk_aggregate_nonpos_of_rank_ge, and every helper of the DAG) are kernel-checked declarations of this source that carry no certificate of their own (R29-N-12); this contract asserts no grade for any companion. Grades are the contract's own list only: the terminal theorem, formally_verified only when the governed award closes (kernel receipt + independent informal audit + independent fidelity review). Fences: one explicit tree family; not (HALL) at any other scope (the (HALL) scope clause EST-3 stays an informal composition with the registered eligibility key at proved_informal); no IsTree, eligibility, crossingIndex or indepNum is asserted; 'every eligible rank of G_k' is NOT claimed (needs x(G_k) >= k+1, open); nothing on the primary aggregate beyond G_k; no RTree statement; nothing about switch arcs elsewhere; not E993-LOWER-REGION-PER-LEAF-DOWN-MAP-INJECTIVITY (a matching is not linear injectivity), not E993-R23-LITERAL-DELETE-ONLY-HALL, not C6-F4, not R19; GK-SIGN is not formally verified by this award. Repairs on the face: C-F2-T's x = k+1 (valid for k >= 2 only) is NOT used; the F draft's instance comment is an authored instance (gkGraph_decAdj, registered as @[reducible, instance] def). Attribution: the network, the active-tag weight and (HALL): Codex GPT-6 (the lower-region run and its corrections); the definition entries 1-13: the first-interior run (Codex) with the r26/r24/r25 definition layers; the transport definitions and (WID): r30 C1-LA1; FLOW=>SIGN: r30 C1-LA2; the G_k family and its eligibility key: r30 Cycles 2-3; CT-1: critic C-F2-T (r30 Cycle 4; Claude Opus 5.5); R2' (the rank extension): the r30 Cycle 4 F adjudicator (Claude Opus 5.5); the bounded G_k Hall record: F2 (Claude Sonnet 5), C-F2-U, the controller replay CF6-1, and the synthesis instrument; r29's high-tail certificates are not used. Lean text of every new declaration: the C4-LA1 formalizer (producer c4-la1-formalizer-opus-20260927, chartered Claude Opus 5.5)."
  },
