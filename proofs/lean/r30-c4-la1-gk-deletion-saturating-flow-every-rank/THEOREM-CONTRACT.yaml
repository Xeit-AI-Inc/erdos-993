      "description": "CARRIED byte-identically (C1-LA1 entry 16, 074ed034...). noncomputable def activeWeight (G : SimpleGraph V) [DecidableRel G.Adj] (F B : Finset V) : ℕ := ((F ∩ B).filter fun v => ¬ Disjoint (B.erase v) (tagWitnesses G v)).card -- counts ACTIVE tags, not |F ∩ B|.",
      "lean_name": "E993Transport.activeWeight",
