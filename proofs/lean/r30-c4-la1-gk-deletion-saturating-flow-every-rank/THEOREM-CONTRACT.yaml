      "description": "CARRIED byte-identically (C1-LA1 entry 19, b1b9ac6c...). def transportRel (G : SimpleGraph V) [DecidableRel G.Adj] (B A : Finset V) : Prop := (∃ q ∈ B, A = B.erase q) ∨ (∃ u, u ∉ B ∧ (G.neighborFinset u ∩ B).card = 2 ∧ A = insert u (B \\ G.neighborFinset u)) -- exactly (D) ∪ (S).",
      "lean_name": "E993Transport.transportRel",
