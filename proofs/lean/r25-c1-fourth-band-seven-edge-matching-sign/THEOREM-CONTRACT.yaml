  "theorem": {
    "title": "Fixed-band d=5 seven-edge matching sign (Award group A, E993-R25-FOURTH-BAND-SEVEN-EDGE-MATCHING-SIGN)",
    "informal_statement": "For every finite simple graph G on a vertex type of cardinality 2r+5 carrying seven pairwise disjoint edges, Delta_r(G) <= 0, for every r >= 1. Bare: no crossing hypothesis, no acyclicity, no forest hypothesis. Delta, coeff, indepCount are the SEMANTIC-CONTRACT.md Erdos993G1 definitions reused verbatim. hr : 1 <= r is retained for fidelity with the C3 analogue (fiveMatching_delta_nonpos, entry 164) though derivable from cardinality (M.card = 14 <= Nat.card X = 2r+5 forces 5 <= r by omega; r <= 4 is vacuous)."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "cycles/cycle-1/stage6/SYNTHESIS.md ## Lean awards, Award group A",
      "cycles/cycle-1/stage5/adjudicators/U/ADJUDICATION.md ## Lean readiness, E1",
      "cycles/cycle-1/stage4/critics/U4/F/CRITIQUE.md (closed-form r-uniform dual, independently re-derived and re-verified in this run)",
      "cycles/cycle-1/stage4/critics/U4/T/CRITIQUE.md (independent chain-elimination re-derivation of m(5)=7)",
      "control/C1-STAGE7-PROTOCOL.md"
    ]
  },
