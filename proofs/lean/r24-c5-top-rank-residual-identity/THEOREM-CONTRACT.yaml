{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c5-la1-top-rank-residual-identity-v1",
  "theorem": {
    "title": "C5-LA1 Top-Rank Residual Identity for Finite Literal Ordinary Trees (F7 Collapse Composed With (RI))",
    "informal_statement": "For every finite simple graph G on a finite vertex type with decidable equality and decidable adjacency, if G is a tree, 2 <= G.indepNum, x(G)+2 <= G.indepNum-1, and every leaf of G belongs to every maximum independent set of G, then with p = G.indepNum-1, L the leaf set, ell = |L|, M = i_alpha(G), and lambda(s) the number of leaf neighbours of s (zero off supports), the equality S(G,p) = ell*M - sum_{B in I_p(G)} (|B intersect L| - sum_{s in B} lambda(s)) holds. This composes the verified F7 selector collapse (which discharges the favorable-filter-equals-leaf-set step) with the (RI) double-counting identity; it asserts no (RC) content, no inequality, and no sign claim."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Award capsule semantic seal bf8fc6c041176f7a11c1d502cb45161e84b4878c87cb93a0efb47707b14df52e verified with all 9 listed file digests and byte counts.",
      "Cycle 5 Stage 6 synthesis (cycles/cycle-5/stage6/SYNTHESIS.md, section 'Lean awards') awards TOP-RANK-RESIDUAL-IDENTITY (F7 collapse composed with (RI)) at exactly this statement, with hyp-tree, hyp-alpha, hyp-eligible, hyp-residual all load-bearing in the terminal declaration.",
      "The base award F7 (C4LA1.topRankSelectorCollapse) is independently kernel- and fidelity-verified (runs/lean-2026-09-15-c4-top-rank-selector-collapse/), digests re-verified in this run's CAPSULE-VERIFICATION.json.",
      "INFORMAL-PROOF.md records the source-bound proof: the leaf-deletion bijection (i_p(H_v)=M), the support-deletion vanishing (i_p(R_v)=0), and the two double-counting identities, all derived from hyp-residual and the general (hResidual-free) leaf/support insertion bijections.",
      "Controller ruling (recorded in control/C5-STAGE7-FORMALIZER-BRIEF.md section 2 and reproduced in INFORMAL-PROOF.md): hyp-eligible is not used by the proof but is mandatory in the terminal statement, and requires a def-crossing-index node for x(G) even though the seven-node list quoted from the Stage 4 T critic omitted it; the synthesis's exact statement governs over that omission."
    ]
  },
  "definitions": [
    {
      "id": "def-independence-number",
      "description": "alpha(G), the maximum cardinality of an independent vertex set of G.",
      "lean_name": "SimpleGraph.indepNum",
      "dependencies": [
        "domain-finite-simple-graph"
      ]
    },
    {
      "id": "def-graph-leaf",
      "description": "A vertex v is a leaf of G exactly when there exists a unique u adjacent to v.",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": [
        "domain-finite-simple-graph",
        "domain-vertex"
      ]
    },
    {
      "id": "def-vertex-deletion-coefficient",
      "description": "i_k(G-v), the number of independent k-subsets of the original finite vertex type that avoid v (F7 convention, reused unchanged).",
      "lean_name": "C4LA1.vertexDeletionIndepSetCount",
      "dependencies": [
        "domain-adjacency-decision",
        "domain-finite-simple-graph",
        "domain-vertex"
      ]
    },
    {
      "id": "def-forward-difference",
      "description": "The integer forward difference i_(p+1)(G-v) - i_p(G-v).",
      "lean_name": "C4LA1.vertexDeletionForwardDifference",
      "dependencies": [
        "def-vertex-deletion-coefficient"
      ]
    },
    {
      "id": "def-favorable",
      "description": "A leaf v is favorable at p exactly when the vertex-deletion forward difference is strictly negative.",
      "lean_name": "C4LA1.IsFavorableAt",
      "dependencies": [
        "def-forward-difference"
      ]
    },
    {
      "id": "def-top-rank",
      "description": "The top interior rank p is alpha(G)-1 in Nat.",
      "lean_name": "Nat.sub",
      "dependencies": [
        "def-independence-number"
      ]
    },
    {
      "id": "def-support",
      "description": "The unique support (neighbour) s_v of an original leaf v, realised by classical choice over the unique-neighbour witness; unconstrained off the leaf set.",
      "lean_name": "C5LA1.support",
      "dependencies": [
        "def-graph-leaf",
        "domain-vertex"
      ]
    },
    {
      "id": "def-leaf-set",
      "description": "L(G), the finite set of original leaves of G.",
      "lean_name": "C5LA1.leafSet",
      "dependencies": [
        "def-graph-leaf"
      ]
    },
    {
      "id": "def-leaf-degree",
      "description": "lambda(s), the number of leaves of G adjacent to s; zero for s that support no leaf.",
      "lean_name": "C5LA1.leafDegree",
      "dependencies": [
        "def-leaf-set",
        "domain-adjacency-decision"
      ]
    },
    {
      "id": "def-h-del",
      "description": "H_v = G - {v, s_v}, realised as the two-element deletion set {v, support G v} used by the vertex-deletion coefficient convention.",
      "lean_name": "C5LA1.H",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-r-del",
      "description": "R_v = G - N[s_v], realised as the deletion set insert (support G v) (neighborFinset (support G v)), i.e. the closed neighbourhood of the leaf's support.",
      "lean_name": "C5LA1.R",
      "dependencies": [
        "def-support",
        "domain-adjacency-decision"
      ]
    },
    {
      "id": "def-indep-sets-card",
      "description": "I_k(G-D): independent k-subsets of the original finite vertex type avoiding a finite deletion set D, generalising def-vertex-deletion-coefficient to an arbitrary deletion set; underlies the derived helpers indepSetCount and forwardDifferenceDel used internally, and I_p(G) is this family at D = the empty set.",
      "lean_name": "C5LA1.indepSetsAvoiding",
      "dependencies": [
        "domain-adjacency-decision",
        "domain-finite-simple-graph"
      ]
    },
    {
      "id": "def-aggregate",
      "description": "S(G,p) = sum over the favorable filter of the leaf set of (b_v - B_v), where b_v and B_v are the (p-1)-rank forward differences of the H_v- and R_v-avoiding coefficients.",
      "lean_name": "C5LA1.aggregate",
      "dependencies": [
        "def-leaf-set",
        "def-favorable",
        "def-h-del",
        "def-r-del",
        "def-indep-sets-card"
      ]
    },
    {
      "id": "def-crossing-index",
      "description": "x(G), the least k with the whole-graph forward difference Delta_k(G) < 0; exists unconditionally because Delta_alpha(G) = -i_alpha(G) < 0 (a maximum independent set of size alpha(G) always exists). Required by hyp-eligible per the controller ruling recorded in the informal proof.",
      "lean_name": "C5LA1.crossingIndex",
      "dependencies": [
        "def-indep-sets-card",
        "def-independence-number"
      ]
    }
  ],
