  "conclusion": {
    "id": "conclusion-top-rank-residual-identity",
    "statement": "aggregate G (G.indepNum-1) = ((leafSet G).card * indepSetCount(G, empty, G.indepNum) : Int) - sum_{B in indepSetsAvoiding G empty (G.indepNum-1)} ( (B intersect leafSet G).card - sum_{s in B} leafDegree G s ), i.e. the literal (RI) identity composed with the F7 collapse. An equality; never weakened to or accompanied by an inequality or sign claim.",
