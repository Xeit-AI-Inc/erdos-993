{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c4-la2-forest-descent-order-bound-v1",
  "theorem": {
    "title": "Forest descent order bound, sharp (k+1)^2 form",
    "informal_statement": "For every finite acyclic simple graph G on a finite vertex type X and every integer k >= 1: if Erdos993G1.delta G k < 0 (a strict descent in the independent-set-count sequence at rank k, verbatim G1 definitions) then Nat.card X <= (k+1)^2. Uniform in k and in G (any forest, connected or not, including the empty forest); no tightness claim beyond k=1; not a no-recovery statement; no transfer to Tier 1, NR1, FOREST, TREE, TRANSFER or Erdos #993."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Compiled and kernel-verified in this run: Lean 4.32.2 / Mathlib 905b95818eb32af7874a58b427f50c1711a5e96c, foreground `lake build` exit 0, every registered declaration reports exactly [propext, Classical.choice, Quot.sound] under #print axioms, no sorry/admit/native_decide (RECEIPTS/kernel-verification.json).",
      "Governing text: cycles/cycle-4/stage6/SYNTHESIS.md '## Lean awards', Award group 2 (FOREST-DESCENT-ORDER-BOUND-SHARP), corroborated by cycles/cycle-4/stage5/adjudicators/T/ADJUDICATION.md E3 and '## Lean readiness'.",
      "The sharp (k+1)^2 form is critic-attributed jointly to C-T4-F and C-T4-U (cycles/cycle-4/stage4/critics/T4/F/CRITIQUE.md finding 1; cycles/cycle-4/stage4/critics/T4/U/CRITIQUE.md Sec.4), who derived it independently; this Lean proof re-derives the exact quadratic itself rather than citing their arithmetic (INFORMAL-PROOF.md Sec.3.5-3.6)."
    ]
  },
