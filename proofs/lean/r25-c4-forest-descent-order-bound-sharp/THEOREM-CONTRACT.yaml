  "hypotheses": [
    {
      "id": "hyp-acyclic",
      "statement": "G.IsAcyclic (G is a forest: no cyclic walk; not required connected, not required nonempty). The only use of forest structure anywhere in the proof is the edge bound e(G) <= Nat.card X - 1 for Nat.card X >= 1 (INFORMAL-PROOF.md Sec.3.2); condition (ii) is discharged because the conclusion is trivially true when Nat.card X = 0, not by a separate vacuous-hypothesis lemma.",
      "dependencies": [
        "domain-x"
      ]
    },
    {
      "id": "hyp-k-lb",
      "statement": "1 <= k. Load-bearing: used in the union-bound rank shift (k+1 >= 2, so C(n-2,k-1) is meaningful) and in the choose_mul absorption identity (Nat.choose_mul needs 2 <= k+1).",
      "dependencies": [
        "domain-k"
      ]
    },
    {
      "id": "hyp-descent",
      "statement": "Erdos993G1.delta G (k : ℤ) < 0, i.e. coeff G (k+1) - coeff G k < 0, i.e. (for k >= 0) indepCount G (k+1) < indepCount G k: a strict descent at rank k.",
      "dependencies": [
        "def-delta",
        "domain-x",
        "domain-k"
      ]
    }
  ],
