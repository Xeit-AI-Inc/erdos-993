  "conclusion": {
    "id": "conclusion",
    "statement": "WeightedHall G (favorableLeaves G p) p holds iff, for every set 𝒮 of source Aut(G)-orbits of I_{p+1}, the sum of the orbit totals supply G (favorableLeaves G p) O over O ∈ 𝒮 is at most the sum of the orbit totals over the target orbits O' of I_p that are joined to 𝒮, where O' is joined to 𝒮 iff some B in some O ∈ 𝒮 and some A ∈ O' satisfy transportRel G B A. Exact Lean statement: theorem weightedHall_iff_autOrbitQuotientHall (G : SimpleGraph V) [DecidableRel G.Adj] (p : ℕ) :\n    WeightedHall G (favorableLeaves G p) p ↔\n      ∀ 𝒮 ⊆ (indepFamily G (p + 1)).image (orbitOf G (p + 1)),\n        ∑ O ∈ 𝒮, supply G (favorableLeaves G p) O ≤\n          ∑ O' ∈ ((indepFamily G p).image (orbitOf G p)).filter\n              (fun O' => ∃ O ∈ 𝒮, ∃ B ∈ O, ∃ A ∈ O', transportRel G B A),\n            supply G (favorableLeaves G p) O'",
    "dependencies": [
      "hyp-typeclass-binders",
      "hyp-full-automorphism-group",
      "hyp-tag-set-fixed-selector",
      "def-weighted-hall",
      "def-supply",
      "def-transport-rel",
      "dom-source-orbit-families"
    ]
  },
