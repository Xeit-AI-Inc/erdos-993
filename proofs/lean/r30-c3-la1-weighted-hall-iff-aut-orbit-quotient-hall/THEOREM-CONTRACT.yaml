  "definitions": [
    {
      "id": "def-indep-family",
      "description": "Layer I_j(G): the independent j-subsets of V. C1-LA1 entry 14 (carried byte-identically; this run index 14). Fragment SHA-256 73df20a8511ea67885d45631688cf693e58cebe9cfd5413ee67e782c1030ef9e. Lean text: /-- the independent `j`-subsets of `V`: the layer `I_j(G)` (SEMANTIC-CONTRACT §1.2). -/\ndef indepFamily (G : SimpleGraph V) [DecidableRel G.Adj] (j : ℕ) : Finset (Finset V) :=\n  (Finset.univ.powersetCard j).filter fun s => G.IsIndepSet (s : Set V)",
      "lean_name": "E993Transport.indepFamily",
      "dependencies": []
    },
    {
      "id": "def-is-graph-leaf",
      "description": "A graph leaf: exactly one adjacent vertex. C1-LA1 entry 4. This run index 4. Fragment SHA-256 65acd314d3bfd74aca476e00dd8866434c67682b627bce5e105d372a556f7ae5. Lean text: /-- A graph leaf has exactly one adjacent vertex. -/\ndef IsGraphLeaf (G : SimpleGraph V) (v : V) : Prop :=\n  ∃! u, G.Adj v u",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": []
    },
    {
      "id": "def-support",
      "description": "The support s_v of a leaf v (its unique neighbour); unconstrained off the leaf set. C1-LA1 entry 5. This run index 5. Fragment SHA-256 8e1e1a689393f555eb5c216207b1368c7415a8543c569884b2fc86954b7bc2b4. Lean text: /-- The unique support (neighbour) of an original leaf `v`; unconstrained\n(any value satisfying nothing further) off the leaf set. -/\nnoncomputable\ndef support (G : SimpleGraph V) (v : V) : V :=\n  Classical.choose (p := fun u => C4LA1.IsGraphLeaf G v → G.Adj v u ∧ ∀ w, G.Adj v w → w = u)\n    (by\n      by_cases h : C4LA1.IsGraphLeaf G v\n      · obtain ⟨u, hu, huniq⟩ := h\n        exact ⟨u, fun _ => ⟨hu, huniq⟩⟩\n      · exact ⟨v, fun hc => absurd hc h⟩)",
      "lean_name": "C5LA1.support",
      "dependencies": [
        "def-is-graph-leaf"
      ]
    },
    {
      "id": "def-leaf-set",
      "description": "The set of original leaves of G. C1-LA1 entry 6. This run index 6. Fragment SHA-256 78ec65517bde90cc2fc5e542fc7c60d6a5147b243b74b9ac3de33d4efd1df697. Lean text: /-- The set of original leaves of `G`. -/\nnoncomputable\ndef leafSet (G : SimpleGraph V) : Finset V :=\n  Finset.univ.filter (C4LA1.IsGraphLeaf G)",
      "lean_name": "C5LA1.leafSet",
      "dependencies": [
        "def-is-graph-leaf"
      ]
    },
    {
      "id": "def-vertex-deletion-count",
      "description": "i_k(G - v): independent k-subsets of V avoiding v. C1-LA1 entry 1. This run index 1. Fragment SHA-256 7e0a588e243735a611c919ea1080816911a3e27e4523478af0c0f560ce1b3b48. Lean text: /-- The coefficient `i_k(G-v)`, represented without changing vertex types:\nindependent `k`-subsets of the original finite vertex type that avoid `v`. -/\ndef vertexDeletionIndepSetCount (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (k : Nat) : Nat :=\n  (((Finset.univ.erase v).powersetCard k).filter fun s : Finset V =>\n    G.IsIndepSet (s : Set V)).card",
      "lean_name": "C4LA1.vertexDeletionIndepSetCount",
      "dependencies": []
    },
    {
      "id": "def-vertex-deletion-difference",
      "description": "i_{p+1}(G - v) - i_p(G - v) in Int. C1-LA1 entry 2. This run index 2. Fragment SHA-256 c2da50eb16ee788c439b146577efeedd7dd42811c6943fb437585edcf63b5880. Lean text: /-- The forward coefficient difference `i_(p+1)(G-v) - i_p(G-v)`, with\nnatural counts embedded in the integers. -/\ndef vertexDeletionForwardDifference (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (p : Nat) : Int :=\n  (vertexDeletionIndepSetCount G v (p + 1) : Int) -\n    vertexDeletionIndepSetCount G v p",
      "lean_name": "C4LA1.vertexDeletionForwardDifference",
      "dependencies": [
        "def-vertex-deletion-count"
      ]
    },
    {
      "id": "def-is-favorable-at",
      "description": "Literal strict favorability of a leaf at rank p: the forward difference is negative. C1-LA1 entry 3. This run index 3. Fragment SHA-256 25d8f7d274f9080468bf6d46acc6db3d4a469c2e399e7faee6cdcee24290a0db. Lean text: /-- Literal strict favorability of an original leaf at rank `p`. -/\ndef IsFavorableAt (G : SimpleGraph V) [DecidableRel G.Adj] (v : V) (p : Nat) : Prop :=\n  vertexDeletionForwardDifference G v p < 0",
      "lean_name": "C4LA1.IsFavorableAt",
      "dependencies": [
        "def-vertex-deletion-difference"
      ]
    },
    {
      "id": "def-favorable-leaves",
      "description": "The fixed original strict selector F_p(G): leaves of G favorable at rank p. C1-LA1 entry 18. Aut-invariant unconditionally (C2-LA1 entry 41, favorableLeaves_map_aut). This run index 18. Fragment SHA-256 16b0c7672ed66c4cb53ba24d853764df160d6694f63b231346a2eb71c390ec77. Lean text: /-- the fixed original strict selector `F_p(G)`. -/\nnoncomputable\ndef favorableLeaves (G : SimpleGraph V) [DecidableRel G.Adj] (p : ℕ) : Finset V :=\n  (C5LA1.leafSet G).filter fun v => C4LA1.IsFavorableAt G v p",
      "lean_name": "E993Transport.favorableLeaves",
      "dependencies": [
        "def-leaf-set",
        "def-is-favorable-at"
      ]
    },
    {
      "id": "def-tag-witnesses",
      "description": "W_v = N_G(s_v) minus {v}. C1-LA1 entry 15. This run index 15. Fragment SHA-256 113d952167528dfc045eb79961e8fbff0326da8f04277799436d6c8962022025. Lean text: /-- `W_v = N_G(s_v) \\ {v}` (SEMANTIC-CONTRACT §1.2). -/\nnoncomputable\ndef tagWitnesses (G : SimpleGraph V) [DecidableRel G.Adj] (v : V) : Finset V :=\n  (G.neighborFinset (C5LA1.support G v)).erase v",
      "lean_name": "E993Transport.tagWitnesses",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-active-weight",
      "description": "Active-tag weight w_F(B): the number of v in F ∩ B that are ACTIVE in B, i.e. (B minus {v}) meets W_v; inactive tags are not counted. C1-LA1 entry 16. This run index 16. Fragment SHA-256 074ed034729850d34722d0b1ceeb96d8362beaebf3b7a409cb3fab28a9850b93. Lean text: /-- the active-tag weight of `B` w.r.t. the tag set `F`: `v ∈ F ∩ B` is counted\niff `B` contains another neighbour of `v`'s original support. -/\nnoncomputable\ndef activeWeight (G : SimpleGraph V) [DecidableRel G.Adj] (F B : Finset V) : ℕ :=\n  ((F ∩ B).filter fun v => ¬ Disjoint (B.erase v) (tagWitnesses G v)).card",
      "lean_name": "E993Transport.activeWeight",
      "dependencies": [
        "def-tag-witnesses"
      ]
    },
    {
      "id": "def-transport-rel",
      "description": "Exactly (D) ∪ (S): (D) A = B minus {q} for some q in B (deletion); (S) some u not in B has |N_G(u) ∩ B| = 2 and A = (B minus N_G(u)) ∪ {u} (two-for-one switch). C1-LA1 entry 19. This run index 19. Fragment SHA-256 b1b9ac6c8de56fa740a37e5bac0fa628f1d817c2e33625ca34dcab33a1100d95. Lean text: /-- the deletion / two-for-one relation from `(p+1)`-sets to `p`-sets. -/\ndef transportRel (G : SimpleGraph V) [DecidableRel G.Adj] (B A : Finset V) : Prop :=\n  (∃ q ∈ B, A = B.erase q) ∨\n  (∃ u, u ∉ B ∧ (G.neighborFinset u ∩ B).card = 2 ∧ A = insert u (B \\ G.neighborFinset u))",
      "lean_name": "E993Transport.transportRel",
      "dependencies": []
    },
    {
      "id": "def-weighted-hall",
      "description": "Weighted Hall for every source subfamily X ⊆ I_{p+1}: supply of X at most the weight of the targets in I_p joined to X. C1-LA1 entry 21. This run index 21. Fragment SHA-256 63534ffbfcc4bb1297228e598da165dcf98732939cd51a5d7fda3e62bc518478. Lean text: /-- weighted Hall for every source subfamily. -/\ndef WeightedHall (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ) : Prop :=\n  ∀ X ⊆ indepFamily G (p + 1),\n    ∑ B ∈ X, activeWeight G F B ≤\n      ∑ A ∈ (indepFamily G p).filter (fun A => ∃ B ∈ X, transportRel G B A), activeWeight G F A",
      "lean_name": "E993Transport.WeightedHall",
      "dependencies": [
        "def-indep-family",
        "def-active-weight",
        "def-transport-rel"
      ]
    },
    {
      "id": "def-supply",
      "description": "Total active weight of a family of sets (orbit total when the family is an orbit). C2-LA1 entry 25. Section variables (G) [DecidableRel G.Adj] (F) (p); p is unused in the body and not a parameter, so supply G F X. This run index 25. Fragment SHA-256 e981d867eed11f032fe42f04adfab048d213b00a6d921368dca040478b7cf2d7. Lean text: /-- The total supply of `X`. -/\nnoncomputable\ndef supply (X : Finset (Finset V)) : ℕ :=\n  ∑ B ∈ X, activeWeight G F B",
      "lean_name": "E993Transport.supply",
      "dependencies": [
        "def-active-weight"
      ]
    },
    {
      "id": "def-orbit-of",
      "description": "NEW (U1, r30 Cycle 3; U1-Main.lean lines 2717-2721): the Aut(G)-orbit of B inside the layer I_j(G), realised as the filter of the finite layer by \"equals the image of B under some automorphism\"; no Fintype (G ≃g G) is needed. Registered after the carried definitions (registrar ordering). This run index 31. Fragment SHA-256 1df6865fc16475343a841e7fdffb4168a1a983615aa6f1afe455d8f27b77f354. Lean text: /-- The `Aut(G)`-orbit of `B` inside the layer `I_j(G)`: the members of the layer that are the\nimage of `B` under some automorphism of `G`. -/\nnoncomputable\ndef orbitOf (G : SimpleGraph V) [DecidableRel G.Adj] (j : ℕ) (B : Finset V) : Finset (Finset V) :=\n  (indepFamily G j).filter (fun B' => ∃ γ : G ≃g G, B' = B.map γ.toEquiv.toEmbedding)",
      "lean_name": "E993Transport.orbitOf",
      "dependencies": [
        "def-indep-family"
      ]
    }
  ],
