    "declaration_name": "E993Transport.weightedHall_iff_autOrbitQuotientHall",
    "expected_declaration_kind": "theorem",
    "expected_statement": "theorem weightedHall_iff_autOrbitQuotientHall (G : SimpleGraph V) [DecidableRel G.Adj] (p : ℕ) :\n    WeightedHall G (favorableLeaves G p) p ↔\n      ∀ 𝒮 ⊆ (indepFamily G (p + 1)).image (orbitOf G (p + 1)),\n        ∑ O ∈ 𝒮, supply G (favorableLeaves G p) O ≤\n          ∑ O' ∈ ((indepFamily G p).image (orbitOf G p)).filter\n              (fun O' => ∃ O ∈ 𝒮, ∃ B ∈ O, ∃ A ∈ O', transportRel G B A),\n            supply G (favorableLeaves G p) O'",
    "expected_statement_sha256": "3c5b2226c71307eb66bd7833efe6f68ad2bbc4192b253cf9d8683238568e3052"
  },
