  "theorem": {
    "title": "Coefficientwise nonnegativity of N_j for every j <= m (award group C6-LA3, clause (a) of E993-R25-MATCHING-ALL-INDEX-DUAL-POSITIVITY)",
    "informal_statement": "Coefficientwise-in-t nonnegativity of the certificate-dual polynomial N_j, for EVERY index j <= m (clause (a) only of E993-R25-MATCHING-ALL-INDEX-DUAL-POSITIVITY). For every m, K, d : Nat with K + d = 2m and the chartered region 3d <= 2m+2: for every j <= m, the Polynomial Z object Nj K m j = sum_{i<=j} (K+1-2i) * 2^i * C(m,i) * A_i(t) * B_i(t) (A_i(t) = prod_{l<i}(t+K+1-l), B_i(t) = prod_{i<l<=j}(t+l)) has every coefficient >= 0. Uniform in d, m AND j; no horizon, no census; no ν, τ, x(F) < r anywhere; no SimpleGraph, indepCount, delta, or firstDescent occurs anywhere in the corpus -- the sixth award's PStatement and P_holds_critic_general are imported byte-identically and never re-proved. The rank substitution t = r - K: since the Polynomial Z statement is substitution-free, coefficientwise nonnegativity implies 0 <= (Nj K m j).eval t for every integer t >= 0, in particular at t = r - K for every r >= K; on the region m <= K+1 (region_le), so r >= K already implies the standing condition r >= m-1 that E993-R25-CLAMPED-DUAL-DOMINATION needs. No Lean identifier in this project mentions r. SCOPE (mandatory fences): this discharges CLAUSE (a) ONLY of E993-R25-MATCHING-ALL-INDEX-DUAL-POSITIVITY; clause (b) (mu_j^g(t) >= 0, denominator positivity, clamp persistence) is formalised NOWHERE, so the registered claim as a whole stays proved_informal -- 'the coefficientwise positivity lemma is formal' must never be shortened to 'the all-index dual positivity claim is formal'. The j = m instance IS the sufficiency half of the separately registered E993-R25-MATCHING-CERTIFICATE-POSITIVITY-IFF (Q_{m,d} = m! * N_m); two registry keys, not one. The CONVERSE half of that iff is NOT formalised. This bears NOT AT ALL on E993-R25-MATCHING-BRANCH-UNIFORM-SIGN, which stays OPEN. The region 3d <= 2m+2 is exactly sharp (off-region witness (m,d) = (1,2): N_1 = -t-1) -- evidence, not on the theorem's own face. No graph, forest, G1 tuple, tier, FOREST, TREE, TRANSFER or Erdos #993 statement occurs anywhere. Attribution: seat U1 for the apparatus and the j = m assembly; the general-j lift critic-attributed jointly to C-U1-T and C-U1-F (independently); the imported sixth award's induction step is C-U1-F (primary, toolkit-free)/C-U1-T (induction-principle scaffold) of Cycle 5, already on that award's own face."
  },
