  "theorem": {
    "title": "C1-LA3 Tree-Structural Core: the P_3 Lemma for Finite Literal Ordinary Trees (r26 Cycle 1)",
    "informal_statement": "For every finite simple graph G on a finite vertex type with decidable equality and decidable adjacency, if G is a tree, its leaf set has exactly two elements, and some vertex s has leaf degree exactly 2 (both leaves are adjacent to s), then G.indepNum = 2. The declaration is the deepest fact of award group C1-LA3, whose registered declarations are the tree-structural core of C1-ALLOCATION.md item 9 (a)-(f) in the sharp forms ruled by the Cycle 1 synthesis, together with the critic-compiled extensions L intersect C(G) = empty, lambda identically zero on the leaf set, j*|C_j| <= |L| hence k_2 <= floor(|L|/2), and k_2 = 0 on the eligible class when |L| = 2. No registered declaration mentions the aggregate S, W_III, the families, or (RC), and none consumes hyp-residual."
  },
