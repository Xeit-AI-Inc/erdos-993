  "conclusion": {
    "id": "conclusion",
    "statement": "Erdos993G1.delta G (r : Z) <= 0. Proved via two named lemmas: perfectMatching_containment ((r+1)*indepCount G (r+1) <= (2*(m-r):N:Z)*indepCount G r, the incidence double count over the m matching edges) and perfectMatching_threshold_arith ((2*(m-r):N:Z) <= (r:Z)+1, by omega from hyp-threshold), combined by cancellation (indepCount nonneg, r+1>0) for r<m, with the r>=m case handled separately (indepCount G (r+1) = 0 since every independent set has cardinality <= m under a perfect matching).",
    "dependencies": [
      "hyp-card",
      "hyp-threshold",
      "hyp-matching-inj",
      "hyp-matching-adj",
      "def-delta"
    ]
  },
