{
  "schema_version": "theorem-contract/v1",
  "contract_id": "c1-la2-perfect-matching-uniform-sign-v1",
  "theorem": {
    "title": "Perfect-matching uniform sign (Cycle 1 award group B, companion contract)",
    "informal_statement": "For every finite simple graph G on a vertex type X of cardinality 2m carrying a perfect matching (an injective f : Fin m x Bool -> X with G.Adj (f (i,false)) (f (i,true)) for every i : Fin m), and every natural r with 2m <= 3r+1: Delta_r(G) <= 0. Equivalently, with d = 2m-2r (always even, forced by the perfect-matching hypothesis): a perfect-matching graph of order 2r+d with 3d <= 2m+2 has Delta_r <= 0. Uniform over even d only; not Tier 3a (says nothing about graphs without a perfect matching); no sharpness claim; no transfer to firstDescent/x(G), forests, residuals, G1 tuples, Tier 1, Tier 2, the diagnostic band, FOREST, TREE, TRANSFER, E993-BETA-AGG, or Erdos #993."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Admitted by the Cycle 1 synthesis (cycles/cycle-1/stage6/SYNTHESIS.md, '## Lean awards', 'Award group B (companion) -- the perfect-matching uniform lemma'), the only uniform-in-d statement Cycle 1 produced.",
      "Originating return cycles/cycle-1/stage3/returns/U2/RETURN.md; the outright perfect-matching proof is given in critique cycles/cycle-1/stage4/critics/U2/F/CRITIQUE.md section 4 (containment count (r+1)A_{r+1} <= 2(m-r)A_r, then 3d <= 2m+2 gives d <= r+1); reconciled in cycles/cycle-1/stage5/adjudicators/U/ADJUDICATION.md.",
      "This run's kernel verification (RECEIPTS/kernel-verification.json, verdict 'verified') establishes only that the exact stated Lean declaration below type-checks with axioms propext, Classical.choice, Quot.sound; it is not, by itself, an independent informal audit or a fidelity review."
    ]
  },
  "definitions": [
    {
      "id": "def-simple-graph",
      "lean_name": "SimpleGraph",
      "description": "Ordinary undirected loopless graph on an arbitrary vertex type.",
      "dependencies": []
    },
    {
      "id": "def-count",
      "lean_name": "Erdos993G1.indepCount",
      "description": "i_k(F) = (Nat.card {S : Finset V // F.IsNIndepSet k S} : Z). Actual independent k-subsets counted once; i_0=1 for every finite graph; zero beyond the independence number. Re-registered in this run (entry 1) with the identical defining body as the frozen G1 source, wrapped in 'namespace Erdos993G1 ... end Erdos993G1' instead of a top-level dotted declaration (a tooling-forced syntactic change only; see INFORMAL-PROOF.md section 1).",
      "dependencies": [
        "def-simple-graph"
      ]
    },
    {
      "id": "def-coeff",
      "lean_name": "Erdos993G1.coeff",
      "description": "coeff F k = if 0<=k then indepCount F k.toNat else 0 (integer zero extension). Re-registered in this run (entry 2), same tooling note as def-count.",
      "dependencies": [
        "def-count"
      ]
    },
    {
      "id": "def-delta",
      "lean_name": "Erdos993G1.delta",
      "description": "delta F k = coeff F (k+1) - coeff F k. Re-registered in this run (entry 3), same tooling note as def-count.",
      "dependencies": [
        "def-coeff"
      ]
    },
    {
      "id": "def-perfect-matching",
      "lean_name": "Function.Injective",
      "description": "The perfect-matching certificate is an injective f : Fin m x Bool -> X together with adjacency he : forall i, G.Adj (f (i,false)) (f (i,true)); since Nat.card X = 2*m = Fintype.card (Fin m x Bool), injectivity of f forces Finset.univ.image f = Finset.univ (perfectMatching_endpoints_univ, entry 11), i.e. f enumerates every vertex of X exactly once as one of m disjoint matched pairs.",
      "dependencies": [
        "def-simple-graph"
      ]
    }
  ],
