{
  "schema_version": "theorem-contract/v1",
  "contract_id": "erdos-993-r30-c2-la1-aut-invariant-positive-deficient-family-v1",
  "theorem": {
    "title": "E993-R30-NOT-WEIGHTED-HALL-IMPLIES-AUT-INVARIANT-POSITIVE-DEFICIENT-FAMILY (r30 C2-LA1): failure of weighted Hall for the fixed selector yields an Aut(G)-invariant, positive-weight, deficient source family (X_min)",
    "informal_statement": "Canonical run id erdos-993-math-dre-20260926-r30-weighted-transport. For every finite type V with decidable equality, every simple graph G on V with decidable adjacency, and every p in N, let F = favorableLeaves G p (the fixed strict selector F_p(G)). If WeightedHall G F p fails, then there is a family X of independent (p+1)-sets (X a subset of I_(p+1)(G)) such that (i) famMap G gamma X = X for every graph automorphism gamma : G ≃g G, where famMap G gamma X is the image under gamma of each member set of X; (ii) every member B of X has active weight activeWeight G F B > 0 (active tags: v in F intersect B with (B minus {v}) meeting W_v); and (iii) the total active weight of the targets N(X) = {A in I_p(G) : some B in X has transportRel G B A}, under exactly (D) union (S), is strictly less than the total active weight of X. The witness is X_min, the least maximizer of phi = supply - cov. Graph-generic; hypotheses are finiteness and decidability only (no IsTree, no eligibility, no p >= 1). Companions on the face (weightedHall_iff_invariant, weightedHall_iff_phi_nonpos, favorableLeaves_map_aut, activeWeight_map_aut, transportRel_map_aut, phi_supermodular, canonMin_isMaximizer, canonMin_famMap, canonMin_pos, filter_eq_covered) are lemmas with no certificate of their own."
  },
  "formulation_status": {
    "status": "established",
    "evidence": [
      "Registered mathematics: the invariant-family half of (INV) E993-R30-WEIGHTED-HALL-IFF-AUT-ORBIT-QUOTIENT-HALL, VERIFIED proved_informal (r30 Cycle 1); synthesis S10.",
      "Kernel-checked in scratch before this run (synthesis S13): U1 INV.lean 174d84c3... and C-U1-T CritINV.lean e6cbd7e6..., replayed by both critics and the U adjudicator; no formal grade until this governed award closes (R29-N-12).",
      "Witness ruling: X_min, not X_max (synthesis S12; U adjudication cross-route item 1)."
    ]
  },
  "definitions": [
    {
      "id": "def-vertex-deletion-indep-set-count",
      "description": "i_k(G - v): the number of independent k-subsets of V avoiding v (carried C1-LA1 entry 1, first-interior text). Registered entry 1 (fragment sha256 7e0a588e243735a611c919ea1080816911a3e27e4523478af0c0f560ce1b3b48); Lean text, verbatim:\n/-- The coefficient `i_k(G-v)`, represented without changing vertex types:\nindependent `k`-subsets of the original finite vertex type that avoid `v`. -/\ndef vertexDeletionIndepSetCount (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (k : Nat) : Nat :=\n  (((Finset.univ.erase v).powersetCard k).filter fun s : Finset V =>\n    G.IsIndepSet (s : Set V)).card",
      "lean_name": "C4LA1.vertexDeletionIndepSetCount",
      "dependencies": []
    },
    {
      "id": "def-vertex-deletion-forward-difference",
      "description": "Delta_p(G - v) = i_(p+1)(G - v) - i_p(G - v) in Int (carried C1-LA1 entry 2). Registered entry 2 (fragment sha256 c2da50eb16ee788c439b146577efeedd7dd42811c6943fb437585edcf63b5880); Lean text, verbatim:\n/-- The forward coefficient difference `i_(p+1)(G-v) - i_p(G-v)`, with\nnatural counts embedded in the integers. -/\ndef vertexDeletionForwardDifference (G : SimpleGraph V) [DecidableRel G.Adj]\n    (v : V) (p : Nat) : Int :=\n  (vertexDeletionIndepSetCount G v (p + 1) : Int) -\n    vertexDeletionIndepSetCount G v p",
      "lean_name": "C4LA1.vertexDeletionForwardDifference",
      "dependencies": [
        "def-vertex-deletion-indep-set-count"
      ]
    },
    {
      "id": "def-is-favorable-at",
      "description": "Strict favorability of v at rank p: Delta_p(G - v) < 0 (carried C1-LA1 entry 3). Registered entry 3 (fragment sha256 25d8f7d274f9080468bf6d46acc6db3d4a469c2e399e7faee6cdcee24290a0db); Lean text, verbatim:\n/-- Literal strict favorability of an original leaf at rank `p`. -/\ndef IsFavorableAt (G : SimpleGraph V) [DecidableRel G.Adj] (v : V) (p : Nat) : Prop :=\n  vertexDeletionForwardDifference G v p < 0",
      "lean_name": "C4LA1.IsFavorableAt",
      "dependencies": [
        "def-vertex-deletion-forward-difference"
      ]
    },
    {
      "id": "def-is-graph-leaf",
      "description": "v has exactly one neighbour (carried C1-LA1 entry 4). Registered entry 4 (fragment sha256 65acd314d3bfd74aca476e00dd8866434c67682b627bce5e105d372a556f7ae5); Lean text, verbatim:\n/-- A graph leaf has exactly one adjacent vertex. -/\ndef IsGraphLeaf (G : SimpleGraph V) (v : V) : Prop :=\n  ∃! u, G.Adj v u",
      "lean_name": "C4LA1.IsGraphLeaf",
      "dependencies": []
    },
    {
      "id": "def-support",
      "description": "s_v: the unique neighbour of a leaf v, an unconstrained choice off the leaves (carried C1-LA1 entry 5). Registered entry 5 (fragment sha256 8e1e1a689393f555eb5c216207b1368c7415a8543c569884b2fc86954b7bc2b4); Lean text, verbatim:\n/-- The unique support (neighbour) of an original leaf `v`; unconstrained\n(any value satisfying nothing further) off the leaf set. -/\nnoncomputable\ndef support (G : SimpleGraph V) (v : V) : V :=\n  Classical.choose (p := fun u => C4LA1.IsGraphLeaf G v → G.Adj v u ∧ ∀ w, G.Adj v w → w = u)\n    (by\n      by_cases h : C4LA1.IsGraphLeaf G v\n      · obtain ⟨u, hu, huniq⟩ := h\n        exact ⟨u, fun _ => ⟨hu, huniq⟩⟩\n      · exact ⟨v, fun hc => absurd hc h⟩)",
      "lean_name": "C5LA1.support",
      "dependencies": [
        "def-is-graph-leaf"
      ]
    },
    {
      "id": "def-leaf-set",
      "description": "The finset of leaves of G (carried C1-LA1 entry 6). Registered entry 6 (fragment sha256 78ec65517bde90cc2fc5e542fc7c60d6a5147b243b74b9ac3de33d4efd1df697); Lean text, verbatim:\nopen Classical in\n/-- The set of original leaves of `G`. -/\nnoncomputable\ndef leafSet (G : SimpleGraph V) : Finset V :=\n  Finset.univ.filter (C4LA1.IsGraphLeaf G)",
      "lean_name": "C5LA1.leafSet",
      "dependencies": [
        "def-is-graph-leaf"
      ]
    },
    {
      "id": "def-indep-family",
      "description": "I_j(G): the independent j-subsets of V (carried C1-LA1 entry 14). Registered entry 14 (fragment sha256 73df20a8511ea67885d45631688cf693e58cebe9cfd5413ee67e782c1030ef9e); Lean text, verbatim:\n/-- the independent `j`-subsets of `V`: the layer `I_j(G)` (SEMANTIC-CONTRACT §1.2). -/\ndef indepFamily (G : SimpleGraph V) [DecidableRel G.Adj] (j : ℕ) : Finset (Finset V) :=\n  (Finset.univ.powersetCard j).filter fun s => G.IsIndepSet (s : Set V)",
      "lean_name": "E993Transport.indepFamily",
      "dependencies": []
    },
    {
      "id": "def-tag-witnesses",
      "description": "W_v = N_G(s_v) minus {v} (carried C1-LA1 entry 15). Registered entry 15 (fragment sha256 113d952167528dfc045eb79961e8fbff0326da8f04277799436d6c8962022025); Lean text, verbatim:\n/-- `W_v = N_G(s_v) \\ {v}` (SEMANTIC-CONTRACT §1.2). -/\nnoncomputable\ndef tagWitnesses (G : SimpleGraph V) [DecidableRel G.Adj] (v : V) : Finset V :=\n  (G.neighborFinset (C5LA1.support G v)).erase v",
      "lean_name": "E993Transport.tagWitnesses",
      "dependencies": [
        "def-support"
      ]
    },
    {
      "id": "def-active-weight",
      "description": "w_F(B): the number of ACTIVE tags v in F intersect B, i.e. with (B minus {v}) meeting W_v; never |F intersect B| (carried C1-LA1 entry 16). Registered entry 16 (fragment sha256 074ed034729850d34722d0b1ceeb96d8362beaebf3b7a409cb3fab28a9850b93); Lean text, verbatim:\n/-- the active-tag weight of `B` w.r.t. the tag set `F`: `v ∈ F ∩ B` is counted\niff `B` contains another neighbour of `v`'s original support. -/\nnoncomputable\ndef activeWeight (G : SimpleGraph V) [DecidableRel G.Adj] (F B : Finset V) : ℕ :=\n  ((F ∩ B).filter fun v => ¬ Disjoint (B.erase v) (tagWitnesses G v)).card",
      "lean_name": "E993Transport.activeWeight",
      "dependencies": [
        "def-tag-witnesses"
      ]
    },
    {
      "id": "def-favorable-leaves",
      "description": "F_p(G): the fixed original strict selector, the leaves favorable at rank p (carried C1-LA1 entry 18). Registered entry 18 (fragment sha256 16b0c7672ed66c4cb53ba24d853764df160d6694f63b231346a2eb71c390ec77); Lean text, verbatim:\nopen Classical in\n/-- the fixed original strict selector `F_p(G)`. -/\nnoncomputable\ndef favorableLeaves (G : SimpleGraph V) [DecidableRel G.Adj] (p : ℕ) : Finset V :=\n  (C5LA1.leafSet G).filter fun v => C4LA1.IsFavorableAt G v p",
      "lean_name": "E993Transport.favorableLeaves",
      "dependencies": [
        "def-leaf-set",
        "def-is-favorable-at"
      ]
    },
    {
      "id": "def-transport-rel",
      "description": "B -> A: exactly (D) union (S): deletion A = B minus {q} with q in B, or two-for-one A = {u} union (B minus N(u)) with u not in B and |N(u) intersect B| = 2 (carried C1-LA1 entry 19). Registered entry 19 (fragment sha256 b1b9ac6c8de56fa740a37e5bac0fa628f1d817c2e33625ca34dcab33a1100d95); Lean text, verbatim:\n/-- the deletion / two-for-one relation from `(p+1)`-sets to `p`-sets. -/\ndef transportRel (G : SimpleGraph V) [DecidableRel G.Adj] (B A : Finset V) : Prop :=\n  (∃ q ∈ B, A = B.erase q) ∨\n  (∃ u, u ∉ B ∧ (G.neighborFinset u ∩ B).card = 2 ∧ A = insert u (B \\ G.neighborFinset u))",
      "lean_name": "E993Transport.transportRel",
      "dependencies": []
    },
    {
      "id": "def-weighted-hall",
      "description": "Weighted Hall for every source subfamily X of I_(p+1): the supply of X is at most the active weight of its targets N(X) (carried C1-LA1 entry 21). Registered entry 21 (fragment sha256 63534ffbfcc4bb1297228e598da165dcf98732939cd51a5d7fda3e62bc518478); Lean text, verbatim:\nopen Classical in\n/-- weighted Hall for every source subfamily. -/\ndef WeightedHall (G : SimpleGraph V) [DecidableRel G.Adj] (F : Finset V) (p : ℕ) : Prop :=\n  ∀ X ⊆ indepFamily G (p + 1),\n    ∑ B ∈ X, activeWeight G F B ≤\n      ∑ A ∈ (indepFamily G p).filter (fun A => ∃ B ∈ X, transportRel G B A), activeWeight G F A",
      "lean_name": "E993Transport.WeightedHall",
      "dependencies": [
        "def-indep-family",
        "def-active-weight",
        "def-transport-rel"
      ]
    },
    {
      "id": "def-fam-map",
      "description": "NEW vocabulary (synthesis-frozen form): the image under gamma of each member set of a family, and nothing wider; elaborates to Finset.map <fun s => Finset.map (Equiv.toEmbedding (RelIso.toEquiv gamma)) s, _> X. Registered entry 22 (fragment sha256 0072baac5b2a65b21aede9c79e8891f86bdef34d2980e9a53208382cf7977d91); Lean text, verbatim:\n/-- the induced action of an automorphism `γ` on source/target families: the image under `γ` of each\nmember set, and nothing wider. -/\ndef famMap (G : SimpleGraph V) [DecidableRel G.Adj] (γ : G ≃g G) (X : Finset (Finset V)) :\n    Finset (Finset V) :=\n  X.map ⟨fun s => s.map γ.toEquiv.toEmbedding, Finset.map_injective _⟩",
      "lean_name": "E993Transport.famMap",
      "dependencies": []
    }
  ],
