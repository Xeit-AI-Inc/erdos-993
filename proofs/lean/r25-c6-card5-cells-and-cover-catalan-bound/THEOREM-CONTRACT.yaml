  "theorem": {
    "informal_statement": "TWO award statements bound as one terminal conjunction. (a) FIXED-CELL, five theorems Erdos993G1.ThirdWide.cell_9/11/13/15/17: for an acyclic SimpleGraph F on Fintype.card X = 2k+7 vertices (k=1..5, orders 9,11,13,15,17) with a vertex cover C0 of cardinality <= 5 (tau(F) <= 5), t_k <= delta F k with t = 9,5,9,21,42. Not uniform in d, in the order, or in r; the Lean formalisation, at these five ranks, of the registered VERIFIED E993-R25-CARD5-JOINT-BUDGET-CELLS (a grade change, not a new claim; proved_informal -> formally_verified). ALIAS IN FULL: also names E993-R25-COVER-BRANCH-UNIFORM-PREHISTORY (OPEN, the uniform-in-d schema of which these cells are d=5 instances) and E993-GRAPH-VERTEX-COVER-DELTA-PARTITION (the cover-fiber partition the whole assembly rests on). MANDATORY: cell_9's registered content is already frozen ENTRY 175 (forest_delta_one_pos) more generally -- delivered novelty is FOUR cells, not five; the cover hypothesis is VACUOUS at orders 9 and 11 (tau <= floor(n/2) for any forest by Koenig) and cover-essential only at 15 and 17. Does NOT discharge E993-R25-COVER-THRESHOLD-MIN-D-5-FOREST (each cell proves one rank k=r-1; that claim asks for every k<r). Far from sharp at four of five cells (true minima 19/39/56/56/43); the population at order 13 is 3,073 (tau<=5), not 3,658 (the total order-13 forest class count). (b) PARAMETERIZED in (n,k), Erdos993G1.ThirdWide.cover_catalan_bound_five, taking the controller-assigned NEW KEY E993-R25-CARD5-COVER-CATALAN-BOUND: for ANY SimpleGraph F (no acyclicity hypothesis) with a card-5 vertex cover C and Fintype.card X = n+5, n.choose(k+1) - n.choose k - 5*Cat(k-1) - 10*Cat(k-2) - 10*Cat(k-3) - 5*Cat(k-4) - Cat(k-5) <= delta F k (Cat = Mathlib's catalan, each term guarded by an if-k-large-enough zero extension). Unconditional (no hfloor hypothesis); this is the object of record per the U adjudication (C-U3-F's form, not C-U3-T's conditional form). catalan_gap5_pos / catalan_gap_five_pos (Gamma(5,k) > 0 for k>=6) is an instance of the already formally verified E993-R25-CATALAN-GAP-MONOTONE-RATIO at tau=5 and is explicitly NOT registered as new by this contract. x(F) < r is never a hypothesis anywhere in this group; the group is never c(d)=min(d,5) and never a tier statement. Frozen line spans (verified against sources/g1/lean/g1-c3-third-wide/LeanProof/Main.lean before this text was written): ENTRY 174 (cover_singleton_available) spans frozen lines 3743-3765; ENTRY 178 (cover_available_empty) spans frozen lines 3844-3861.",
    "title": "Card-5 joint-budget cells (five fixed cells) and the card-5 cover_catalan_bound (parameterized)"
  }
